<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 时代新刚需 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#BBDEFB 0%, #FFE082 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#0277BD; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#0277BD; }
  h1 em { font-style:normal; background:#FFEB3B; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #FF6F00; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#0277BD; color:#FFEB3B; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 26px; color: #B71C1C; font-weight: 900; padding-left: 50px; }
  .myth .truth { font-size: 24px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #0277BD; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #FF6F00; }
  .pull h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">家长别被裹挟 · 4 个真相</span>
    <h1>这 4 件事<br><em>别瞎担心</em></h1>
    <div class="myth"><div class="x">!</div><div class="lie">"5 个刚需 = 5 个补习班"</div><div class="truth">不是每项都报班 · <b>大部分能在家培养</b><br>提问力 / 表达力 = 饭桌上每天就能练</div></div>
    <div class="myth"><div class="x">!</div><div class="lie">"5 个一起学 · 娃要崩溃"</div><div class="truth">不是同时全力 · <b>有节奏轮流</b><br>语数英学校已包 · 编程 / 表达课外补</div></div>
    <div class="myth"><div class="x">!</div><div class="lie">"AI 时代不需要英语了"</div><div class="truth">机器翻译 ≠ 真理解 · <b>顶级 AI 论文都是英文</b><br>会英语 = 资源多 100 倍</div></div>
    <div class="myth"><div class="x">!</div><div class="lie">"数学不重要 · AI 帮算"</div><div class="truth">AI 的核心 = 数学 · <b>不学数学的娃看不懂 AI 原理</b><br>反而更需要数学</div></div>
    <div class="pull">
      <h2>大连家长真心话<br><b>"5 个刚需 ≠ 5 个补习班 · 是 5 个长期方向"</b></h2>
    </div>
  </div>
</body>
</html>
