<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 时代新刚需 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg, #0277BD 0%, #FF6F00 50%, #FFEB3B 100%); color:#FFFFFF; position:relative; }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,235,59,0.55) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:14px 32px; border-radius:100px; font-size:30px; font-weight:900; letter-spacing:3px; margin-bottom: 50px; box-shadow: 6px 6px 0 #FF6F00; }
  .pre { font-size: 42px; font-weight: 800; color: #FFEB3B; margin-bottom: 18px; }
  .title { font-size: 144px; font-weight:900; line-height:0.95; color:#FFFFFF; text-shadow: 6px 6px 0 #0277BD; letter-spacing: -4px; }
  .title em { font-style:normal; color:#0277BD; background:#FFEB3B; padding: 0 14px; box-shadow: 8px 8px 0 #1A1A1A; display: inline-block; }
  .grid-row { margin-top: 36px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .it { background:#FFFFFF; color:#0277BD; border: 4px solid #1A1A1A; border-radius: 12px; padding: 12px 4px; text-align: center; box-shadow: 4px 4px 0 #FF6F00; font-weight: 900; }
  .it .v { font-size: 24px; line-height: 1; }
  .it .l { font-size: 14px; opacity: 0.85; margin-top: 4px; color: #1A1A1A; }
  .sub { margin-top: 36px; background:#1A1A1A; color:#FFEB3B; padding: 18px 26px; border-radius: 14px; box-shadow: 6px 6px 0 #FF6F00; font-size: 36px; font-weight: 800; line-height: 1.4; display: inline-block; border: 4px solid #FFEB3B; }
  .sub b { color: #FFFFFF; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#FFEB3B; font-weight:900; }
  .stamp { background:#FFEB3B; color:#0277BD; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长 AI 系列 · 第 4 篇</div>
    <div class="pre">"语数英之外 · 还该学啥"</div>
    <div class="title">AI 时代<br><em>新刚需</em></div>
    <div class="grid-row">
      <div class="it"><div class="v">编程</div><div class="l">逻辑</div></div>
      <div class="it"><div class="v">英语</div><div class="l">交流</div></div>
      <div class="it"><div class="v">数学</div><div class="l">思维</div></div>
      <div class="it"><div class="v">阅读</div><div class="l">理解</div></div>
      <div class="it"><div class="v">表达</div><div class="l">输出</div></div>
    </div>
    <div class="sub">不是科目堆砌<br><b>5 个真"刚需"</b></div>
  </div>
  <div class="footer">
    <span># 新刚需 # AI 时代 # 大连娃</span>
    <span class="stamp">收藏不亏</span>
  </div>
</body>
</html>
