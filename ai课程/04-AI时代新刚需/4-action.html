<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 时代新刚需 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#0277BD; color:#FFFFFF; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(255,111,0,0.5) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,235,59,0.45) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#0277BD; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#FFEB3B; }
  h1 em { font-style:normal; color:#FFFFFF; }
  .ex { background:#FFFFFF; color:#1A1A1A; border-radius: 16px; padding: 18px 22px; margin-top: 14px; border-left: 12px solid #FF6F00; box-shadow: 5px 5px 0 #FFEB3B; }
  .ex .name { display:inline-block; background:#0277BD; color:#FFEB3B; padding:4px 14px; border-radius: 8px; font-weight:900; font-size:22px; }
  .ex h3 { font-size: 26px; font-weight: 900; color: #0277BD; margin-top: 8px; }
  .ex p { font-size: 22px; color:#424242; line-height: 1.5; margin-top: 4px; font-weight: 700; }
  .ex p b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: linear-gradient(135deg, #FF6F00, #FFEB3B); color:#1A1A1A; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; }
  .pull h2 { font-size: 36px; font-weight:900; line-height: 1.35; }
  .pull h2 b { color: #B71C1C; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFEB3B; font-weight:700; }
  .pill { background:#FFEB3B; color:#0277BD; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">5 个刚需 · 5 个家庭练法</span>
    <h1>不报班<br><em>5 件事在家也能做</em></h1>

    <div class="ex"><span class="name">编程</span><h3>每周 1 小时 Scratch / Python</h3><p>启蒙不报班 · <b>免费工具够用</b></p></div>
    <div class="ex"><span class="name">英语</span><h3>每天 15 分钟原版动画</h3><p>磨耳朵优先 · <b>不要拼写背单词</b></p></div>
    <div class="ex"><span class="name">数学</span><h3>每天 20 分钟思维题</h3><p>不刷题量 · <b>会一题想 3 种解法</b></p></div>
    <div class="ex"><span class="name">阅读</span><h3>每周 1 本书</h3><p>不论小说 / 科普 · <b>家长一起读</b></p></div>
    <div class="ex"><span class="name">表达</span><h3>每周 1 次"小演讲"</h3><p>娃讲 3 分钟最近读的 / 学的</p></div>

    <div class="pull">
      <h2>大连家长口诀<br><b>"5 个方向 · 不抢早 · 长期坚持"</b></h2>
    </div>
  </div>
  <div class="cta">
    <span># 新刚需 # 在家培养 # 大连娃</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
