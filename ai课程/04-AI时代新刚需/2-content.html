<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 时代新刚需 · 详解</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#E1F5FE; color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #0277BD, #FFEB3B); }
  body::after  { content:""; position:absolute; bottom:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #FFEB3B, #0277BD); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#0277BD; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 70px; font-weight:900; margin-top:18px; line-height:1.1; color:#0277BD; }
  h1 em { font-style:normal; background: linear-gradient(transparent 60%, #FFEB3B 60%); padding: 0 6px; }
  .row { display:flex; align-items:center; padding: 16px 22px; background:#FFF; border-radius: 16px; margin-top: 14px; border: 4px solid #1A1A1A; box-shadow: 5px 5px 0 #0277BD; }
  .row .icon { flex: 0 0 76px; height:76px; border-radius: 14px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:28px; color:#FFFFFF; margin-right: 18px; box-shadow: 3px 3px 0 #1A1A1A; }
  .ic1 { background:#1976D2;}
  .ic2 { background:#FF6F00;}
  .ic3 { background:#7B1FA2;}
  .ic4 { background:#388E3C;}
  .ic5 { background:#C2185B;}
  .row .body { flex: 1; }
  .row .body h3 { font-size: 28px; font-weight: 900; color: #0277BD; line-height: 1.2; }
  .row .body p { font-size: 22px; color: #424242; margin-top: 4px; line-height: 1.4; }
  .row .body p b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #0277BD; }
  .key { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #FF6F00; }
  .key h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .key h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">5 个新刚需 · AI 时代必备</span>
    <h1>5 个能力<em>不能少</em></h1>

    <div class="row"><div class="icon ic1">编</div><div class="body"><h3>编程 · 跟 AI 沟通的母语</h3><p>不学编程 = <b>看不懂 AI 在做什么</b></p></div></div>
    <div class="row"><div class="icon ic2">英</div><div class="body"><h3>英语 · 仍是世界通用语</h3><p>顶级 AI 资源 80% 是英文 · <b>翻译效率差几倍</b></p></div></div>
    <div class="row"><div class="icon ic3">数</div><div class="body"><h3>数学 · AI 的灵魂</h3><p>算法 / 概率 / 线性代数 · <b>AI 时代反而更值钱</b></p></div></div>
    <div class="row"><div class="icon ic4">读</div><div class="body"><h3>阅读理解 · 提炼信息的核心</h3><p>每天读海量 AI 信息 · <b>理解力决定你能用多少</b></p></div></div>
    <div class="row"><div class="icon ic5">写</div><div class="body"><h3>表达 · AI 时代的"提问力"</h3><p>问 AI 的问题表达不清 · <b>AI 给的答案就垃圾</b></p></div></div>

    <div class="key">
      <h2>核心 ·<br><b>5 个新刚需 = "工具(编程) + 内容(语数英) + 能力(读+写)"</b></h2>
    </div>
  </div>
</body>
</html>
