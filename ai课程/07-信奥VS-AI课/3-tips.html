<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>信奥 VS AI 课 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#FFE082 0%, #FFCDD2 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#1A1A1A; }
  h1 em { font-style:normal; background:#FFEB3B; padding: 0 8px; box-shadow: 4px 4px 0 #B71C1C; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #1A1A1A; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#B71C1C; color:#FFEB3B; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 26px; color: #B71C1C; font-weight: 900; padding-left: 50px; }
  .myth .truth { font-size: 24px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #B71C1C; }
  .pull h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">家长 4 个常见错选</span>
    <h1>这 4 个想法<br><em>容易选错</em></h1>
    <div class="myth"><div class="x">×</div><div class="lie">"AI 火 · 信奥过时了"</div><div class="truth">信奥<b>练算法 = AI 内核</b><br>不是过时 · 反而是 AI 的"地基"</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">"娃喜欢 AI · 直接报 AI 不报信奥"</div><div class="truth">AI 课入门容易 · 但<b>没算法练习娃只能停在表面</b><br>建议先信奥 1 年 · 再玩 AI 项目</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">"AI 课就是教用 ChatGPT"</div><div class="truth">真正 AI 课 = <b>机器学习 + 数据 + Python</b><br>"教用 ChatGPT" 那种是水课</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">"两个都报 · 越多越好"</div><div class="truth">同时报 = <b>娃容易精力分散</b><br>建议<b>一段时间专攻一个</b></div></div>
    <div class="pull">
      <h2>大连家长真心话<br><b>"信奥练底子 · AI 出作品 · 顺序很关键"</b></h2>
    </div>
  </div>
</body>
</html>
