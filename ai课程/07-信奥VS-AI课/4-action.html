<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>信奥 VS AI 课 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#0A0A0A; color:#FFEB3B; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(25,118,210,0.5) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,235,59,0.4) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#0A0A0A; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#FFEB3B; }
  .stage { background:#1A1A1A; border-radius: 14px; padding: 18px 22px; margin-top: 16px; border-left: 10px solid #FFEB3B; position: relative; }
  .stage .age { display:inline-block; background:#FFEB3B; color:#1A1A1A; padding:4px 14px; border-radius: 8px; font-weight:900; font-size:22px; }
  .stage h3 { font-size: 28px; color:#FFEB3B; font-weight:900; margin-top: 8px; }
  .stage p { font-size: 22px; color:#E0E0E0; line-height: 1.5; margin-top: 4px; font-weight: 700; }
  .stage p b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: linear-gradient(135deg, #FFEB3B, #B71C1C); color:#FFFFFF; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; text-shadow: 2px 2px 0 #1A1A1A; }
  .pull h2 { font-size: 36px; font-weight:900; line-height: 1.35; }
  .pull h2 b { color: #FFEB3B; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFEB3B; font-weight:700; }
  .pill { background:#FFEB3B; color:#0A0A0A; padding:10px 22px; border-radius:6px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">分龄路线图 · 不内卷</span>
    <h1>3 个阶段<br><em>顺序很重要</em></h1>

    <div class="stage"><span class="age">7-12 岁</span><h3>启蒙 + 试探</h3><p>Scratch 入门 + 简单 AI 工具体验<br><b>不要急着选边</b> · 看娃哪个有兴趣</p></div>
    <div class="stage"><span class="age">10-14 岁</span><h3>主攻信奥（如有兴趣）</h3><p>C++ + 算法 = <b>底子打深</b><br>过 GESP 4-6 级 / 准备 CSP-J</p></div>
    <div class="stage"><span class="age">14+ 岁</span><h3>叠加 AI 项目</h3><p>用 Python 做<b>数据 / 简单机器学习项目</b><br>信奥底子 + AI 应用 = 全能选手</p></div>

    <div class="pull">
      <h2>大连家长真心话<br><b>"信奥练根 · AI 开花 · 一前一后"</b></h2>
    </div>
  </div>
  <div class="cta">
    <span># 信奥 + AI # 路径 # 大连娃</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
