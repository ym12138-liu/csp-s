<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 会写代码 = 失业吗 · 反转</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#FFEBEE; color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #B71C1C, #FFD700); }
  body::after  { content:""; position:absolute; bottom:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #FFD700, #B71C1C); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#B71C1C; color:#FFD700; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 70px; font-weight:900; margin-top:18px; line-height:1.1; color:#B71C1C; }
  h1 em { font-style:normal; background: linear-gradient(transparent 60%, #FFD700 60%); padding: 0 6px; }
  .case { background:#FFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #B71C1C; }
  .case .num { display:inline-block; background:#B71C1C; color:#FFD700; padding:6px 16px; border-radius: 8px; font-weight:900; font-size: 24px; }
  .case h3 { font-size: 30px; font-weight: 900; color: #1A1A1A; margin-top: 8px; }
  .case .fact { background:#FFF8E1; padding: 12px 16px; border-radius: 10px; border-left: 6px solid #FFD700; font-size: 22px; font-weight: 700; color: #1A1A1A; line-height: 1.5; margin-top: 8px; }
  .case .fact b { background:#B71C1C; color:#FFD700; padding: 0 6px; border-radius: 4px; }
  .key { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFD700; border-radius: 16px; box-shadow: 8px 8px 0 #B71C1C; }
  .key h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .key h2 b { color: #FFD700; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">3 个反转事实</span>
    <h1>"AI 替代程序员"<em>没那么简单</em></h1>

    <div class="case">
      <span class="num">事实 1</span>
      <h3>程序员岗位反而在涨</h3>
      <div class="fact">2024 年全球程序员岗位 <b>+12%</b><br>但"低端代码工"岗位 <b>-30%</b> · 高端架构师 <b>+50%</b></div>
    </div>

    <div class="case">
      <span class="num">事实 2</span>
      <h3>AI 让"会编程"反而更值钱</h3>
      <div class="fact">用 AI 的程序员效率 <b>×10</b><br>不会编程的人用 AI = 看不懂结果对错</div>
    </div>

    <div class="case">
      <span class="num">事实 3</span>
      <h3>新职业层出不穷</h3>
      <div class="fact"><b>AI 工程师 / Prompt 工程师 / 数据科学家</b><br>这些岗位 5 年前不存在 · 现在是热门</div>
    </div>

    <div class="key">
      <h2>核心 ·<br><b>AI 替代的是"做不出花"的程序员</b><br>不是程序员这个职业</h2>
    </div>
  </div>
</body>
</html>
