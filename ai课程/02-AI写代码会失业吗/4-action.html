<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 失业吗 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#1A1A1A; color:#FFD700; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(183,28,28,0.5) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,215,0,0.5) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFD700; color:#B71C1C; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#FFD700; }
  .step { background:#2C2C2C; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 10px solid #FFD700; position: relative; }
  .step::before { content: attr(data-n); position:absolute; left: -28px; top: -16px; width: 60px; height: 60px; border-radius: 50%; background:#FFD700; color:#B71C1C; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #B71C1C; }
  .step h3 { font-size: 30px; color:#FFD700; font-weight:900; padding-left: 40px; }
  .step p { font-size: 24px; color:#E0E0E0; margin-top: 6px; line-height: 1.5; }
  .step p b { background:#FFD700; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .pull { margin-top: 26px; padding: 24px 28px; background: linear-gradient(135deg, #FFD700, #B71C1C); color:#FFFFFF; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; text-shadow: 2px 2px 0 #1A1A1A; }
  .pull h2 { font-size: 38px; font-weight:900; line-height: 1.35; }
  .pull h2 b { color: #FFD700; }
  .pull p { font-size: 22px; font-weight:700; margin-top: 8px; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFD700; font-weight:700; }
  .pill { background:#FFD700; color:#B71C1C; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">把娃推到赢家位 · 3 步</span>
    <h1>不让娃<br><em>被 AI 替代</em></h1>
    <div class="step" data-n="1"><h3>培养"提问力"</h3><p>每天饭桌让娃<b>问 3 个为什么</b><br>会提问的孩子 = AI 时代的赢家</p></div>
    <div class="step" data-n="2"><h3>练"判断力"</h3><p>AI 答案给娃看 · 让娃<b>找出哪里错</b><br>批判思维比记忆更值钱</p></div>
    <div class="step" data-n="3"><h3>培养"创造力"</h3><p>每月一个<b>自由项目</b>(画 / 做 / 编)<br>让娃造点东西 · 不只是学 / 用</p></div>
    <div class="pull">
      <h2>大连家长教科书<br><b>"提问 + 判断 + 创造 = 不被替代"</b></h2>
      <p>这 3 项 AI 一辈子学不会</p>
    </div>
  </div>
  <div class="cta">
    <span># 不被替代 # AI # 大连娃</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
