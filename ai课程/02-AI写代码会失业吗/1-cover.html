<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 会写代码 = 失业吗 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(135deg, #1A1A1A 0%, #B71C1C 50%, #FFD700 100%);
    color: #FFFFFF; position: relative;
  }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,215,0,0.45) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,23,68,0.45) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#FFD700; color:#1A1A1A; padding:14px 32px; border-radius:6px; font-size:30px; font-weight:900; letter-spacing:3px; margin-bottom: 50px; box-shadow: 6px 6px 0 #B71C1C; }
  .pre { font-size: 42px; font-weight: 800; color: #FFD700; margin-bottom: 18px; }
  .title { font-size: 144px; font-weight:900; line-height:0.95; color:#FFD700; text-shadow: 6px 6px 0 #1A1A1A; letter-spacing: -4px; }
  .title em { font-style:normal; color:#FFFFFF; background:#B71C1C; padding: 0 14px; box-shadow: 8px 8px 0 #1A1A1A; display: inline-block; }
  .qmark { font-size: 200px; font-weight:900; color: #FFFFFF; text-shadow: 8px 8px 0 #B71C1C; line-height: 1; }
  .sub { margin-top: 36px; background:#1A1A1A; color:#FFD700; padding: 18px 26px; border-radius: 14px; box-shadow: 6px 6px 0 #FFD700; font-size: 36px; font-weight: 800; line-height: 1.4; display: inline-block; border: 4px solid #FFD700; }
  .sub b { color: #FFFFFF; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#FFD700; font-weight:900; }
  .stamp { background:#FFD700; color:#B71C1C; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长 AI 系列 · 第 2 篇</div>
    <div class="pre">"程序员都要失业 · 学编程图啥"</div>
    <div class="title">失业 <span class="qmark">?</span><br><em>反转</em></div>
    <div class="sub">数据说话<br><b>3 个反转事实</b></div>
  </div>
  <div class="footer">
    <span># AI 失业 # 真相 # 大连娃</span>
    <span class="stamp">收藏不亏</span>
  </div>
</body>
</html>
