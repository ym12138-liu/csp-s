<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 时代还学编程吗 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#0A0A0A; color:#FFEB3B; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(0,229,255,0.5) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(124,77,255,0.4) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#00E5FF; color:#0A0A0A; padding:10px 26px; border-radius:6px; font-weight:900; font-size:28px; font-family:"SF Mono",monospace; }
  h1 { font-size: 84px; font-weight:900; margin-top:18px; line-height:1.05; color:#FFEB3B; }
  h1 em { font-style:normal; color:#00E5FF; }
  .step { background:#1A1A1A; border-radius: 14px; padding: 22px 26px; margin-top: 18px; border-left: 10px solid #00E5FF; position: relative; }
  .step::before { content: attr(data-n); position:absolute; left: -28px; top: -16px; width: 60px; height: 60px; border-radius: 50%; background:#FFEB3B; color:#0A0A0A; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 0 0 20px rgba(255,235,59,0.5); font-family:"SF Mono",monospace; }
  .step h3 { font-size: 32px; color:#00E5FF; font-weight:900; padding-left: 40px; }
  .step p { font-size: 24px; color:#E0E0E0; margin-top: 6px; line-height: 1.5; }
  .step p b { background:#FFEB3B; color:#0A0A0A; padding: 0 6px; border-radius: 4px; }
  .pull { margin-top: 26px; padding: 24px 28px; background: linear-gradient(135deg, #00E5FF, #FFEB3B); color:#0A0A0A; border-radius: 18px; font-family: "SF Mono", monospace; box-shadow: 0 0 40px rgba(0,229,255,0.4); }
  .pull h2 { font-size: 36px; font-weight:900; line-height: 1.35; }
  .pull h2 b { background:#0A0A0A; color:#FFEB3B; padding: 0 8px; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFEB3B; font-weight:700; font-family:"SF Mono",monospace; }
  .pill { background:#FFEB3B; color:#0A0A0A; padding:10px 22px; border-radius:6px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">{ ACTION } 这周开始</span>
    <h1>3 件事<br>立刻 <em>能做</em></h1>

    <div class="step" data-n="1">
      <h3>给娃 30 分钟用 AI</h3>
      <p>让娃问 ChatGPT / DeepSeek <b>5 个问题</b><br>看哪个回答好 / 哪个不对 → 培养判断力</p>
    </div>
    <div class="step" data-n="2">
      <h3>玩 1 小时 Scratch</h3>
      <p>免费工具 · 拖积木 · <b>10 分钟出动画</b><br>编程启蒙第一步 · 不用打字也能开始</p>
    </div>
    <div class="step" data-n="3">
      <h3>看 1 个 AI 项目</h3>
      <p>B 站搜"AI 小学生项目" · <b>挑娃感兴趣的</b><br>看完讨论"AI 是怎么做到的"</p>
    </div>

    <div class="pull">
      <h2>// 大连家长共识<br><b>不学编程 = 给娃少一种"未来语言"</b></h2>
    </div>
  </div>
  <div class="cta">
    <span># AI 编程 # 启蒙 # 大连娃</span>
    <span class="pill">{ 收藏 }</span>
  </div>
</body>
</html>
