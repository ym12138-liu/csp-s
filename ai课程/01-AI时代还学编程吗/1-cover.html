<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 时代还学编程吗 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: #0A0A0A;
    color: #FFEB3B;
    position: relative;
  }
  body::before {
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(0,229,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  body::after {
    content:""; position:absolute; bottom:0; left:0; right:0; height:50%;
    background: radial-gradient(ellipse at center bottom, rgba(124,77,255,0.4) 0%, transparent 70%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge {
    display:inline-block; background:#FFEB3B; color:#0A0A0A;
    padding:14px 32px; border-radius:6px;
    font-size:30px; font-weight:900; letter-spacing:3px;
    margin-bottom: 50px;
    font-family: "SF Mono", monospace;
    box-shadow: 0 0 30px rgba(255,235,59,0.6);
  }
  .pre {
    font-family: "SF Mono", monospace;
    font-size: 36px; color: #00E5FF; font-weight: 900;
    margin-bottom: 18px;
  }
  .title {
    font-size: 156px; font-weight: 900; line-height: 0.95;
    color: #FFEB3B;
    text-shadow: 0 0 30px rgba(255,235,59,0.5), 6px 6px 0 #7C4DFF;
    letter-spacing: -4px;
  }
  .title em {
    font-style: normal; color: #00E5FF;
    text-shadow: 6px 6px 0 #FF1744;
  }
  .qmark {
    font-size: 200px; font-weight: 900;
    color: #FF1744;
    text-shadow: 0 0 40px rgba(255,23,68,0.5);
    line-height: 1;
  }
  .sub {
    margin-top: 36px;
    font-family: "SF Mono", monospace;
    background:#FFEB3B; color:#0A0A0A;
    padding: 18px 24px; border-radius: 6px;
    font-size: 32px; font-weight: 900;
    display:inline-block; line-height: 1.4;
    box-shadow: 6px 6px 0 #FF1744;
  }
  .sub b { background:#0A0A0A; color:#FFEB3B; padding: 0 8px; }
  .footer {
    position:absolute; bottom:0; left:70px; right:70px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:28px; color:#FFEB3B; font-weight:800; font-family: "SF Mono", monospace;
  }
  .stamp {
    background:#FF1744; color:#FFEB3B;
    padding:14px 24px; border-radius:6px;
    transform:rotate(-5deg); font-weight:900;
    font-family: "SF Mono", monospace;
  }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">$ AI.era / 大连家长必读</div>
    <div class="pre">// AI 都会写代码了</div>
    <div class="title">
      还学<br>
      <em>编程</em><span class="qmark">?</span>
    </div>
    <div class="sub">
      不学编程 = 不学英语<br>
      <b>10 年后回头会后悔</b>
    </div>
  </div>
  <div class="footer">
    <span># AI 时代 # 编程启蒙 # 大连娃</span>
    <span class="stamp">{ 收藏 }</span>
  </div>
</body>
</html>
