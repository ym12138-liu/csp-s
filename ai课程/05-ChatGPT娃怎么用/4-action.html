<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ChatGPT 娃怎么用 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#0A1F0A; color:#00FF41; position:relative; }
  body::before { content:""; position:absolute; inset:0; background-image: linear-gradient(rgba(0,255,65,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,65,0.04) 1px, transparent 1px); background-size: 50px 50px; }
  body::after { content:""; position:absolute; bottom:0; left:0; right:0; height:50%; background: radial-gradient(ellipse at center bottom, rgba(255,235,59,0.2) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#0A1F0A; padding:10px 26px; border-radius:6px; font-weight:900; font-size:28px; font-family:"SF Mono",monospace; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#00FF41; }
  h1 em { font-style:normal; color:#FFEB3B; }
  .prompt { background:#1A1A1A; border:2px solid #00FF41; border-radius: 10px; padding: 14px 18px; margin-top: 12px; font-family: "SF Mono", monospace; box-shadow: 4px 4px 0 #00FF41; }
  .prompt .lbl { font-size: 18px; color: #FFEB3B; font-weight: 900; margin-bottom: 4px; }
  .prompt .text { font-size: 22px; color: #00FF41; font-weight: 700; line-height: 1.4; }
  .prompt .text b { background:#FFEB3B; color:#0A1F0A; padding: 0 6px; border-radius: 3px; }
  .pull { margin-top: 24px; padding: 22px 26px; background: linear-gradient(135deg, #00FF41, #FFEB3B); color: #0A1F0A; border-radius: 12px; font-family: "SF Mono", monospace; box-shadow: 0 0 40px rgba(0,255,65,0.5); }
  .pull h2 { font-size: 32px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background:#0A1F0A; color:#00FF41; padding: 0 8px; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFEB3B; font-weight:700; font-family:"SF Mono",monospace; }
  .pill { background:#FFEB3B; color:#0A1F0A; padding:10px 22px; border-radius:6px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">{ PROMPTS } 6 个学习用</span>
    <h1>给娃<br>抄这 <em>6 个</em></h1>

    <div class="prompt"><div class="lbl">1 · 学知识</div><div class="text">"我想学 X · 帮我用 <b>5 个例子</b>解释 · 由浅到深"</div></div>
    <div class="prompt"><div class="lbl">2 · 找错</div><div class="text">"这是我写的 X · 帮我找<b>3 个可以改进的地方</b>"</div></div>
    <div class="prompt"><div class="lbl">3 · 解题</div><div class="text">"X 题目 · 帮我<b>讲思路 · 不要直接给答案</b>"</div></div>
    <div class="prompt"><div class="lbl">4 · 对比</div><div class="text">"X 和 Y 有什么区别 · 用<b>表格列出来</b>"</div></div>
    <div class="prompt"><div class="lbl">5 · 检查</div><div class="text">"我的理解是 X · <b>对吗 · 哪里错了</b>"</div></div>
    <div class="prompt"><div class="lbl">6 · 拓展</div><div class="text">"X 学完了 · <b>下一步该学什么</b>"</div></div>

    <div class="pull">
      <h2>// 大连家长真心话<br><b>"6 个 prompt = 娃的随身 1 对 1 老师"</b></h2>
    </div>
  </div>
  <div class="cta">
    <span># prompt # ChatGPT # 大连娃</span>
    <span class="pill">{ 收藏 }</span>
  </div>
</body>
</html>
