<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ChatGPT 娃怎么用 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#0A1F0A 0%, #1B5E20 100%); color:#00FF41; position:relative; }
  body::before { content:""; position:absolute; inset:0; background-image: linear-gradient(rgba(0,255,65,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,65,0.04) 1px, transparent 1px); background-size: 50px 50px; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FF1744; color:#FFFFFF; padding:10px 26px; border-radius:6px; font-weight:900; font-size:28px; font-family:"SF Mono",monospace; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#00FF41; }
  h1 em { font-style:normal; color:#FFEB3B; }
  .rule { background:#1A1A1A; border:2px solid #FFEB3B; border-radius: 14px; padding: 22px 26px; margin-top: 18px; box-shadow: 5px 5px 0 #FF1744; position: relative; }
  .rule .num { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:6px; background:#FFEB3B; color:#0A1F0A; font-weight:900; font-size:28px; display:flex; align-items:center; justify-content:center; box-shadow: 0 0 20px rgba(255,235,59,0.5); font-family:"SF Mono",monospace; }
  .rule h3 { font-size: 28px; color: #FFEB3B; font-weight: 900; padding-left: 50px; }
  .rule p { font-size: 22px; color: #FFFFFF; line-height: 1.5; margin-top: 8px; font-weight: 700; }
  .rule p b { background:#00FF41; color:#0A1F0A; padding: 0 6px; border-radius: 4px; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #FFEB3B; color: #0A1F0A; border-radius: 12px; font-family: "SF Mono", monospace; box-shadow: 0 0 30px rgba(255,235,59,0.4); }
  .pull h2 { font-size: 30px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background:#FF1744; color:#FFFFFF; padding: 0 8px; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">$ RULES.txt · 4 条铁律</span>
    <h1>娃用 AI<br>这 4 条 <em>必守</em></h1>
    <div class="rule"><div class="num">1</div><h3>先自己想 · 再问 AI</h3><p>遇到题先<b>自己思考 5 分钟</b><br>抄答案前 = 思维必然萎缩</p></div>
    <div class="rule"><div class="num">2</div><h3>问"为什么" · 不问"是什么"</h3><p>"为什么这么算" 比 "答案是啥" <b>有用 10 倍</b><br>培养追问的习惯</p></div>
    <div class="rule"><div class="num">3</div><h3>必须验证 · AI 会瞎编</h3><p>AI 不全对 · <b>10% 答案是错的</b><br>娃要会查证 · 别全信</p></div>
    <div class="rule"><div class="num">4</div><h3>家长陪用 · 不要单飞</h3><p>低龄娃<b>家长一起在场</b><br>避免娃用 AI 抄作业偷懒</p></div>
    <div class="pull">
      <h2>大连家长真心话<br><b>"AI 是助手 · 不是替身"</b></h2>
    </div>
  </div>
</body>
</html>
