<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ChatGPT 娃怎么用 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #0A1F0A; color:#00FF41; position:relative; }
  body::before { content:""; position:absolute; inset:0; background-image: linear-gradient(rgba(0,255,65,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,65,0.06) 1px, transparent 1px); background-size: 40px 40px; }
  body::after { content:""; position:absolute; bottom:0; left:0; right:0; height:50%; background: radial-gradient(ellipse at center bottom, rgba(0,255,65,0.25) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#00FF41; color:#0A1F0A; padding:14px 32px; border-radius:6px; font-size:30px; font-weight:900; letter-spacing:3px; margin-bottom: 50px; font-family: "SF Mono", monospace; box-shadow: 0 0 30px rgba(0,255,65,0.6); }
  .pre { font-family: "SF Mono", monospace; font-size: 36px; color: #FFEB3B; font-weight: 900; margin-bottom: 18px; }
  .title { font-size: 156px; font-weight:900; line-height:0.95; color:#00FF41; text-shadow: 0 0 30px rgba(0,255,65,0.5), 6px 6px 0 #003300; letter-spacing: -4px; }
  .title em { font-style:normal; color:#FFEB3B; text-shadow: 6px 6px 0 #B71C1C; }
  .qmark { font-size: 200px; font-weight: 900; color: #FFEB3B; text-shadow: 0 0 40px rgba(255,235,59,0.5); line-height: 1; }
  .sub { margin-top: 36px; font-family: "SF Mono", monospace; background:#FFEB3B; color:#0A1F0A; padding: 18px 24px; border-radius: 6px; font-size: 32px; font-weight: 900; display:inline-block; line-height: 1.4; box-shadow: 6px 6px 0 #00FF41; }
  .sub b { background:#0A1F0A; color:#00FF41; padding: 0 8px; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#00FF41; font-weight:800; font-family: "SF Mono", monospace; }
  .stamp { background:#FFEB3B; color:#0A1F0A; padding:14px 24px; border-radius:6px; transform:rotate(-5deg); font-weight:900; font-family: "SF Mono", monospace; }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">$ AI.tools / 第 5 篇</div>
    <div class="pre">// 娃用 ChatGPT 是开挂还是作弊?</div>
    <div class="title">怎么用<br><em>不作弊</em><span class="qmark">?</span></div>
    <div class="sub">用对了 = <b>外挂大脑</b><br>用错了 = 作弊抄作业</div>
  </div>
  <div class="footer">
    <span># ChatGPT # 娃用法 # 大连家长</span>
    <span class="stamp">{ 收藏 }</span>
  </div>
</body>
</html>
