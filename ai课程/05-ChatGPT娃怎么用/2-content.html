<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>RULE · 4 条铁律</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; overflow: hidden;
font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
background: #FFFFFF; color: #1A1A1A; }
.top { position: absolute; top: 0; left: 0; right: 0; height: 150px;
background: #0D47A1; display: flex; align-items: center; padding: 0 60px; }
.top .badge { background: #FFFFFF; color: #0D47A1; padding: 12px 24px;
border-radius: 8px; font-size: 28px; font-weight: 900; }
.top .right { margin-left: auto; color: #FFFFFF; font-size: 22px; font-weight: 800; }
.h1 { position: absolute; top: 200px; left: 60px; right: 60px; }
.h1 .pre { color: #2196F3; font-size: 26px; font-weight: 800; letter-spacing: 3px; margin-bottom: 10px; }
.h1 h1 { font-size: 60px; font-weight: 900; color: #0D47A1; line-height: 1.1; }
.h1 h1 b { background: #2196F3; color: #FFFFFF; padding: 0 12px; border-radius: 6px; }
.pull { position: absolute; bottom: 200px; left: 60px; right: 60px;
background: #0D47A1; color: #FFFFFF; padding: 22px 28px; border-radius: 16px; }
.pull h2 { font-size: 26px; font-weight: 900; line-height: 1.4; }
.pull h2 b { background: #2196F3; padding: 0 8px; border-radius: 4px; }
.footer { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
background: #0D47A1; display: flex; align-items: center; justify-content: center; }
.footer .txt { color: #FFFFFF; font-size: 22px; font-weight: 900; letter-spacing: 4px; }

.myths { position: absolute; top: 380px; left: 60px; right: 60px; }
.myth { background: #FFFFFF; border: 3px solid #FFEBEE; border-left: 8px solid #B71C1C;
padding: 14px 20px; margin-bottom: 14px; border-radius: 6px; position: relative; }
.myth .x { position: absolute; top: -12px; left: -12px;
width: 36px; height: 36px; border-radius: 50%;
background: #B71C1C; color: #FFFFFF;
display: flex; align-items: center; justify-content: center;
font-size: 20px; font-weight: 900; }
.myth .lie { font-size: 20px; color: #B71C1C; font-weight: 900;
text-decoration: line-through; padding-left: 36px; }
.myth .truth { font-size: 17px; color: #1A1A1A; margin-top: 6px; font-weight: 700;
line-height: 1.4; }
.myth .truth b { background: #FFF59D; padding: 0 4px; color: #2E7D32; border-radius: 3px; }
</style></head><body><div class="top"><span class="badge">RULE · 4 条铁律</span><span class="right">因诺信奥 · 大连</span></div>
<div class="h1"><div class="pre">// 守住底线 · AI 才是助手</div><h1>娃用 AI<br>4 条<b>铁律</b></h1></div>
<div class="myths"><div class="myth"><div class="x">!</div><div class="lie">"先自己想 · 再问 AI"</div><div class="truth">遇到题先自己想 5 分钟 · <b>抄答案前思维必然萎缩</b></div></div><div class="myth"><div class="x">!</div><div class="lie">"问"为什么"不问"是什么""</div><div class="truth">"为什么这么算"比"答案是啥"<b>有用 10 倍</b> · 培养追问的习惯</div></div><div class="myth"><div class="x">!</div><div class="lie">"必须验证 · AI 会瞎编"</div><div class="truth">AI 不全对 · 10% 答案是错的 · 娃要会查证 · <b>别全信</b></div></div><div class="myth"><div class="x">!</div><div class="lie">"家长陪用 · 不要单飞"</div><div class="truth">低龄娃<b>家长一起玩</b> · 避免娃用 AI 抄作业偷懒</div></div></div>
<div class="pull"><h2>AI 是<b>助手</b> · 不是替身</h2></div>
<div class="footer"><span class="txt">守住底线</span></div>
</body></html>
