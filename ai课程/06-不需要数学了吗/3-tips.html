<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>不需要数学了吗 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#FFE0B2 0%, #BBDEFB 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#E65100; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#E65100; }
  h1 em { font-style:normal; background:#FFEB3B; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #1565C0; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#E65100; color:#FFEB3B; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 26px; color: #B71C1C; font-weight: 900; padding-left: 50px; }
  .myth .truth { font-size: 24px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #E65100; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #1565C0; }
  .pull h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">家长 4 个误解 · 别再听</span>
    <h1>这 4 句<br><em>都是谎</em></h1>
    <div class="myth"><div class="x">×</div><div class="lie">"AI 帮算 · 数学随便学"</div><div class="truth">AI 算结果 ≠ 你理解过程<br>不懂过程 → <b>看不懂 AI 哪步错</b></div></div>
    <div class="myth"><div class="x">×</div><div class="lie">"小学数学已经够了"</div><div class="truth">基础是底子 · 但 AI 时代核心算法<br>需要<b>初中代数 + 高中函数</b>打基础</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">"奥数太难 · 对 AI 没用"</div><div class="truth">奥数练的是<b>抽象建模能力</b><br>这恰恰是 AI 工程师的核心素养</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">"读文科逃避数学 · AI 时代也行"</div><div class="truth">文科 + AI 一样要数学 · <b>数据分析 / 心理统计 / 经济学</b>都要数学</div></div>
    <div class="pull">
      <h2>大连家长真心话<br><b>"AI 时代 = 数学比以前更重要"</b></h2>
    </div>
  </div>
</body>
</html>
