<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>不需要数学了吗 · 真相</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#FFF3E0; color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #E65100, #1565C0); }
  body::after  { content:""; position:absolute; bottom:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #1565C0, #E65100); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#E65100; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 70px; font-weight:900; margin-top:18px; line-height:1.1; color:#E65100; }
  h1 em { font-style:normal; background: linear-gradient(transparent 60%, #FFEB3B 60%); padding: 0 6px; }
  .case { background:#FFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #1565C0; }
  .case .num { display:inline-block; background:#1565C0; color:#FFEB3B; padding:6px 16px; border-radius: 8px; font-weight:900; font-size: 24px; }
  .case h3 { font-size: 30px; font-weight: 900; color: #1A1A1A; margin-top: 8px; }
  .case .fact { background:#FFF8E1; padding: 12px 16px; border-radius: 10px; border-left: 6px solid #FFEB3B; font-size: 22px; font-weight: 700; color: #1A1A1A; line-height: 1.5; margin-top: 8px; }
  .case .fact b { background:#E65100; color:#FFEB3B; padding: 0 6px; border-radius: 4px; }
  .key { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #1565C0; }
  .key h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .key h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">3 个真相 · AI 与数学</span>
    <h1>数学 = <em>AI 的灵魂</em></h1>

    <div class="case">
      <span class="num">真相 1</span>
      <h3>AI 本质就是一堆数学</h3>
      <div class="fact">神经网络 = <b>线性代数 + 微积分 + 概率</b><br>不学数学 → 永远是"用 AI 的人" · 当不了"造 AI 的人"</div>
    </div>

    <div class="case">
      <span class="num">真相 2</span>
      <h3>AI 算 ≠ 人会算</h3>
      <div class="fact">AI 帮你算 1+1 · 不代表你<b>理解了等式</b><br>不会数学 → 看不懂 AI 给的图表 / 数据 / 结论</div>
    </div>

    <div class="case">
      <span class="num">真相 3</span>
      <h3>顶级岗位都需要数学</h3>
      <div class="fact">AI 工程师 / 数据科学家 / 算法工程师<br>这些<b>百万年薪岗</b> · 都要数学硬核</div>
    </div>

    <div class="key">
      <h2>核心 ·<br><b>AI 时代 = 数学比以往任何时候都重要</b></h2>
    </div>
  </div>
</body>
</html>
