<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>不需要数学了吗 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg, #E65100 0%, #1565C0 60%, #FFEB3B 100%); color:#FFFFFF; position:relative; }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,235,59,0.5) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:14px 32px; border-radius:100px; font-size:30px; font-weight:900; letter-spacing:3px; margin-bottom: 50px; box-shadow: 6px 6px 0 #E65100; }
  .pre { font-size: 42px; font-weight: 800; color: #FFEB3B; margin-bottom: 18px; }
  .title { font-size: 144px; font-weight:900; line-height:0.95; color:#FFFFFF; text-shadow: 6px 6px 0 #1565C0; letter-spacing: -4px; }
  .title em { font-style:normal; color:#1565C0; background:#FFEB3B; padding: 0 14px; box-shadow: 8px 8px 0 #1A1A1A; display: inline-block; }
  .qmark { font-size: 200px; font-weight: 900; color: #FFEB3B; text-shadow: 6px 6px 0 #1A1A1A; line-height: 1; }
  .sub { margin-top: 36px; background:#1A1A1A; color:#FFEB3B; padding: 18px 26px; border-radius: 14px; box-shadow: 6px 6px 0 #FFEB3B; font-size: 36px; font-weight: 800; line-height: 1.4; display: inline-block; border: 4px solid #FFEB3B; }
  .sub b { color: #FFFFFF; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#FFEB3B; font-weight:900; }
  .stamp { background:#FFEB3B; color:#1565C0; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长 AI 系列 · 第 6 篇</div>
    <div class="pre">"AI 都能算了 · 还学数学吗"</div>
    <div class="title">数学 <span class="qmark">?</span><br><em>反而</em> 更要</div>
    <div class="sub">不是不要数学<br><b>是 AI 时代数学最值钱</b></div>
  </div>
  <div class="footer">
    <span># AI 数学 # 真相 # 大连娃</span>
    <span class="stamp">收藏不亏</span>
  </div>
</body>
</html>
