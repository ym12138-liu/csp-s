<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 时代 5 大能力 · 误判</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#D1C4E9 0%, #FFE082 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#311B92; color:#FFD700; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#311B92; }
  h1 em { font-style:normal; background:#FFD700; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #7C4DFF; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#311B92; color:#FFD700; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 26px; color: #311B92; font-weight: 900; padding-left: 50px; }
  .myth .truth { font-size: 24px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFD700; padding: 0 6px; border-radius: 4px; color: #311B92; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFD700; border-radius: 16px; box-shadow: 8px 8px 0 #7C4DFF; }
  .pull h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFD700; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">家长常错把这 4 件当能力</span>
    <h1>这 4 件<br><em>不是真能力</em></h1>
    <div class="myth"><div class="x">×</div><div class="lie">背完了所有公式 = 能力强</div><div class="truth">背诵 = AI 比人强 100 倍 · 已不算"能力"<br><b>会用知识解决问题</b>才是真能力</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">考试 100 分 = AI 时代赢家</div><div class="truth">考试是<b>测"对答案的能力"</b><br>AI 时代要"问对问题的能力"</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">会用 ChatGPT = 有 AI 能力</div><div class="truth">用 AI = <b>第一步</b> · 但不是终点<br>真正能力是<b>判断 AI 答案</b></div></div>
    <div class="myth"><div class="x">×</div><div class="lie">娃听话守规矩 = 好</div><div class="truth">AI 时代<b>太听话 = 容易被替代</b><br>有想法 + 敢质疑 + 能创造 = 难替代</div></div>
    <div class="pull">
      <h2>大连家长真心话<br><b>"考试分数 ≠ AI 时代竞争力"</b></h2>
    </div>
  </div>
</body>
</html>
