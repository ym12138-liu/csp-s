<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 时代 5 大能力 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg, #311B92 0%, #7C4DFF 50%, #FFD700 100%); color:#FFFFFF; position:relative; }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,215,0,0.5) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#FFD700; color:#311B92; padding:14px 32px; border-radius:100px; font-size:30px; font-weight:900; letter-spacing:3px; margin-bottom: 50px; box-shadow: 6px 6px 0 #1A1A1A; }
  .pre { font-size: 42px; font-weight: 800; color: #FFD700; margin-bottom: 18px; }
  .title { font-size: 156px; font-weight:900; line-height:0.95; color:#FFFFFF; text-shadow: 6px 6px 0 #311B92; letter-spacing: -4px; }
  .title em { font-style:normal; color:#311B92; background:#FFD700; padding: 0 14px; box-shadow: 8px 8px 0 #1A1A1A; display: inline-block; }
  .ability-row { margin-top: 36px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .ab { background:#FFFFFF; color:#311B92; border: 4px solid #1A1A1A; border-radius: 12px; padding: 12px 4px; text-align: center; box-shadow: 4px 4px 0 #FFD700; font-weight: 900; }
  .ab .v { font-size: 24px; line-height: 1; }
  .ab .l { font-size: 14px; opacity: 0.85; margin-top: 4px; color: #1A1A1A; }
  .sub { margin-top: 36px; background:#1A1A1A; color:#FFD700; padding: 18px 26px; border-radius: 14px; box-shadow: 6px 6px 0 #FFD700; font-size: 36px; font-weight: 800; line-height: 1.4; display: inline-block; border: 4px solid #FFD700; }
  .sub b { color: #FFFFFF; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#FFD700; font-weight:900; }
  .stamp { background:#FFD700; color:#311B92; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长 AI 系列 · 第 3 篇</div>
    <div class="pre">"娃要培养啥 · 才能挺过 AI 时代"</div>
    <div class="title">AI 时代<br><em>5 大能力</em></div>
    <div class="ability-row">
      <div class="ab"><div class="v">提问</div><div class="l">力</div></div>
      <div class="ab"><div class="v">判断</div><div class="l">力</div></div>
      <div class="ab"><div class="v">迁移</div><div class="l">力</div></div>
      <div class="ab"><div class="v">创造</div><div class="l">力</div></div>
      <div class="ab"><div class="v">协作</div><div class="l">力</div></div>
    </div>
    <div class="sub">不是分数<br><b>这 5 项才是真竞争力</b></div>
  </div>
  <div class="footer">
    <span># AI 5 大能力 # 大连娃</span>
    <span class="stamp">收藏不亏</span>
  </div>
</body>
</html>
