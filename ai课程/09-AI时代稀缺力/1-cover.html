<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 时代稀缺能力 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg, #1A1A1A 0%, #4A148C 50%, #FFD700 100%); color:#FFFFFF; position:relative; }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,215,0,0.55) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(124,77,255,0.4) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#FFD700; color:#1A1A1A; padding:14px 32px; border-radius:100px; font-size:30px; font-weight:900; letter-spacing:3px; margin-bottom: 50px; box-shadow: 6px 6px 0 #4A148C; }
  .pre { font-size: 42px; font-weight: 800; color: #FFD700; margin-bottom: 18px; }
  .title { font-size: 156px; font-weight:900; line-height:0.95; color:#FFD700; text-shadow: 6px 6px 0 #4A148C; letter-spacing: -4px; }
  .title em { font-style:normal; color:#1A1A1A; background:#FFD700; padding: 0 14px; box-shadow: 8px 8px 0 #FFFFFF; display: inline-block; }
  .ability { margin-top: 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .ab { background:#FFD700; color:#4A148C; border: 4px solid #1A1A1A; border-radius: 14px; padding: 16px 8px; text-align: center; box-shadow: 4px 4px 0 #FFFFFF; font-weight: 900; }
  .ab .v { font-size: 30px; line-height: 1; }
  .ab .l { font-size: 18px; opacity: 0.85; margin-top: 6px; color: #1A1A1A; }
  .sub { margin-top: 36px; background:#FFD700; color:#1A1A1A; padding: 18px 26px; border-radius: 14px; box-shadow: 6px 6px 0 #1A1A1A; font-size: 36px; font-weight: 800; line-height: 1.4; display: inline-block; border: 4px solid #1A1A1A; }
  .sub b { color: #B71C1C; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#FFD700; font-weight:900; }
  .stamp { background:#FFD700; color:#4A148C; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长 AI 系列 · 第 9 篇</div>
    <div class="pre">"AI 学不会的能力 · 才最贵"</div>
    <div class="title">AI 时代<br><em>真稀缺</em></div>
    <div class="ability">
      <div class="ab"><div class="v">提问</div><div class="l">力</div></div>
      <div class="ab"><div class="v">批判</div><div class="l">力</div></div>
      <div class="ab"><div class="v">创造</div><div class="l">力</div></div>
    </div>
    <div class="sub">3 项 AI 学不会<br><b>娃练好就赢</b></div>
  </div>
  <div class="footer">
    <span># 稀缺能力 # AI # 大连娃</span>
    <span class="stamp">收藏不亏</span>
  </div>
</body>
</html>
