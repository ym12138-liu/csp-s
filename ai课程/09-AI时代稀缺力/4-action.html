<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 时代稀缺能力 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#1A1A1A; color:#FFD700; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(74,20,140,0.55) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,215,0,0.5) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFD700; color:#4A148C; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#FFD700; }
  h1 em { font-style:normal; color:#FFFFFF; }
  .ex { background:#FFFFFF; color:#1A1A1A; border-radius: 16px; padding: 18px 22px; margin-top: 14px; border-left: 12px solid #FFD700; box-shadow: 5px 5px 0 #4A148C; }
  .ex .name { display:inline-block; background:#4A148C; color:#FFD700; padding:4px 14px; border-radius:8px; font-weight:900; font-size:22px; }
  .ex h3 { font-size: 26px; font-weight: 900; color: #4A148C; margin-top: 8px; }
  .ex p { font-size: 22px; color:#424242; line-height: 1.5; margin-top: 4px; font-weight: 700; }
  .ex p b { background:#FFD700; padding: 0 6px; border-radius: 4px; color: #4A148C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: linear-gradient(135deg, #FFD700, #4A148C); color:#FFFFFF; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; text-shadow: 2px 2px 0 #1A1A1A; }
  .pull h2 { font-size: 36px; font-weight:900; line-height: 1.35; }
  .pull h2 b { color: #FFD700; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFD700; font-weight:700; }
  .pill { background:#FFD700; color:#4A148C; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">家庭 3 个游戏 · 练 3 项</span>
    <h1>3 个游戏<br><em>每天都能玩</em></h1>
    <div class="ex"><span class="name">提问游戏</span><h3>每天饭桌"5 个为什么"</h3><p>娃问 5 个 <b>"为什么"</b> · 全家一起讨论<br>不要求答对 · 要求<b>问得有意思</b></p></div>
    <div class="ex"><span class="name">批判游戏</span><h3>找广告 / 新闻里的 1 处错</h3><p>每天家长指 1 段文字 · <b>让娃挑刺</b><br>培养"不轻信"的本能</p></div>
    <div class="ex"><span class="name">创造游戏</span><h3>每周 1 个"如果……会怎样"</h3><p>"如果地心引力消失" · <b>让娃天马行空想</b><br>不否定 · 鼓励奇思妙想</p></div>
    <div class="pull">
      <h2>大连家长真心话<br><b>"3 个游戏 · 每天 15 分钟 · 受益终身"</b></h2>
    </div>
  </div>
  <div class="cta">
    <span># 稀缺能力 # 家庭游戏 # 大连</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
