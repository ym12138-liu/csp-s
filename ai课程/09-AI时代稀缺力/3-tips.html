<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 时代稀缺能力 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#D1C4E9 0%, #FFE082 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#4A148C; color:#FFD700; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#4A148C; }
  h1 em { font-style:normal; background:#FFD700; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #4A148C; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#4A148C; color:#FFD700; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 26px; color: #4A148C; font-weight: 900; padding-left: 50px; }
  .myth .truth { font-size: 24px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFD700; padding: 0 6px; border-radius: 4px; color: #4A148C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFD700; border-radius: 16px; box-shadow: 8px 8px 0 #4A148C; }
  .pull h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFD700; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">家长 4 个误判 · 别犯</span>
    <h1>这 4 件事<br>家长 <em>常做反</em></h1>
    <div class="myth"><div class="x">×</div><div class="lie">"娃乖 · 不顶嘴 = 好"</div><div class="truth">乖 = <b>批判力萎缩</b><br>太听话的娃 · AI 时代最危险</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">"标准答案 = 学到了"</div><div class="truth">考标准答案能 100 分 · 但<b>提不出新问题</b><br>AI 时代要"问问题"不是"答问题"</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">"创造力 = 画画 / 弹琴"</div><div class="truth">创造力 = <b>解决从未见过的问题</b><br>不是艺术专属 · 数学物理一样要</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">"娃质疑老师 = 没礼貌"</div><div class="truth">在尊重前提下质疑 = <b>批判思维的训练</b><br>压制质疑 = 浇灭批判力火苗</div></div>
    <div class="pull">
      <h2>大连家长真心话<br><b>"AI 时代 · 太乖反而被淘汰"</b></h2>
    </div>
  </div>
</body>
</html>
