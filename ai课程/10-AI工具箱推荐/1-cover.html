<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 工具箱推荐 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg, #FF1744 0%, #00E5FF 33%, #FFEB3B 66%, #00FF41 100%); color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,235,59,0.6) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:14px 32px; border-radius:100px; font-size:30px; font-weight:900; letter-spacing:3px; margin-bottom: 50px; box-shadow: 6px 6px 0 #FF1744; }
  .pre { font-size: 42px; font-weight: 800; color: #1A1A1A; margin-bottom: 18px; }
  .title { font-size: 144px; font-weight:900; line-height:0.95; color:#FFFFFF; text-shadow: 6px 6px 0 #1A1A1A; letter-spacing: -4px; }
  .title em { font-style:normal; background: #1A1A1A; color:#FFEB3B; padding: 0 16px; display: inline-block; box-shadow: 8px 8px 0 #FFFFFF; }
  .tools-row { margin-top: 36px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .t { background:#FFFFFF; color:#1A1A1A; border: 4px solid #1A1A1A; border-radius: 12px; padding: 14px 4px; text-align: center; box-shadow: 4px 4px 0 #1A1A1A; font-weight: 900; }
  .t .v { font-size: 22px; line-height: 1; color: #1A1A1A; }
  .t .l { font-size: 14px; opacity: 0.85; margin-top: 4px; color: #424242; }
  .sub { margin-top: 36px; background:#1A1A1A; color:#FFEB3B; padding: 18px 26px; border-radius: 14px; box-shadow: 6px 6px 0 #FFFFFF; font-size: 36px; font-weight: 800; line-height: 1.4; display: inline-block; border: 4px solid #FFEB3B; }
  .sub b { color: #FFFFFF; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#1A1A1A; font-weight:900; }
  .stamp { background:#1A1A1A; color:#FFEB3B; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长 AI 系列 · 第 10 篇 · 收官</div>
    <div class="pre">"娃要玩 AI · 用啥工具？"</div>
    <div class="title">AI<br><em>工具箱</em></div>
    <div class="tools-row">
      <div class="t"><div class="v">DeepSeek</div><div class="l">国产首选</div></div>
      <div class="t"><div class="v">ChatGPT</div><div class="l">英文之王</div></div>
      <div class="t"><div class="v">Claude</div><div class="l">写作之神</div></div>
      <div class="t"><div class="v">通义</div><div class="l">学习神器</div></div>
      <div class="t"><div class="v">Scratch</div><div class="l">编程启蒙</div></div>
    </div>
    <div class="sub">5 个工具<br><b>大部分免费 · 不报班</b></div>
  </div>
  <div class="footer">
    <span># AI 工具箱 # 0 基础 # 大连娃</span>
    <span class="stamp">收官收藏</span>
  </div>
</body>
</html>
