<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 工具箱推荐 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg,#1A1A1A 0%, #4A148C 50%, #00E5FF 100%); color:#FFEB3B; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(255,23,68,0.4) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,235,59,0.4) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#1A1A1A; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#00E5FF; }
  .step { background:#FFFFFF; color:#1A1A1A; border-radius: 16px; padding: 18px 22px; margin-top: 14px; border-left: 12px solid #FFEB3B; box-shadow: 5px 5px 0 #FF1744; position: relative; }
  .step::before { content: attr(data-n); position:absolute; left: -22px; top: -16px; width: 56px; height: 56px; border-radius: 50%; background:#FFEB3B; color:#1A1A1A; font-weight:900; font-size:28px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #FF1744; }
  .step h3 { font-size: 28px; color:#1A1A1A; font-weight:900; padding-left: 40px; }
  .step p { font-size: 22px; color:#424242; margin-top: 4px; line-height: 1.5; font-weight: 700; }
  .step p b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: linear-gradient(135deg, #FFEB3B, #00E5FF); color:#1A1A1A; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; }
  .pull h2 { font-size: 36px; font-weight:900; line-height: 1.35; }
  .pull h2 b { color: #B71C1C; }
  .pull p { font-size: 22px; font-weight:700; margin-top: 8px; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFEB3B; font-weight:700; }
  .pill { background:#FFEB3B; color:#1A1A1A; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">3 步配置家庭工具箱</span>
    <h1>3 步搞定<br><em>娃的 AI 工具</em></h1>

    <div class="step" data-n="1">
      <h3>第 1 步 · 注册 DeepSeek（免费）</h3>
      <p>家长邮箱注册 · <b>娃用家长账号</b><br>设密码 · 不让娃单独登 · 共享设备</p>
    </div>
    <div class="step" data-n="2">
      <h3>第 2 步 · 装 Scratch（免费）</h3>
      <p>scratch.mit.edu · <b>不用注册也能玩</b><br>10 分钟做出第一个动画 · 娃必上瘾</p>
    </div>
    <div class="step" data-n="3">
      <h3>第 3 步 · 立 5 条家规</h3>
      <p>作业不用 / 考试不用 / 不填真信息<br>不当朋友 · <b>每天家长见证 5 分钟</b></p>
    </div>

    <div class="pull">
      <h2>10 篇科普收官<br><b>"工具是免费的 · 习惯是无价的"</b></h2>
      <p>大连家长加油 · 不焦虑也能跟上 AI 时代</p>
    </div>
  </div>
  <div class="cta">
    <span># AI 工具 # 家庭配置 # 大连</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
