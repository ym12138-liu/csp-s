<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 工具箱推荐 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#FFCDD2 0%, #B2DFDB 50%, #FFF59D 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#1A1A1A; }
  h1 em { font-style:normal; background:#FFEB3B; padding: 0 8px; box-shadow: 4px 4px 0 #B71C1C; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #FF1744; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#B71C1C; color:#FFEB3B; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 26px; color: #B71C1C; font-weight: 900; padding-left: 50px; }
  .myth .truth { font-size: 24px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #00BCD4; }
  .pull h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">5 条使用底线 · 必守</span>
    <h1>娃用 AI<br>这 5 条 <em>不能破</em></h1>
    <div class="myth"><div class="x">!</div><div class="lie">"账号给娃 · 自己管"</div><div class="truth">低龄娃<b>必须家长账号 + 共享设备</b><br>避免娃半夜偷用 / 误买付费</div></div>
    <div class="myth"><div class="x">!</div><div class="lie">"考试作业 · AI 都能用"</div><div class="truth">明确底线：<b>作业 / 考试不许用</b><br>用了 = 思维退化 · 长期亏大</div></div>
    <div class="myth"><div class="x">!</div><div class="lie">"AI 教啥都信"</div><div class="truth">AI 经常瞎编 · <b>娃要学会查证</b><br>家长帮忙挑刺 = 培养判断力</div></div>
    <div class="myth"><div class="x">!</div><div class="lie">"个人信息随便填"</div><div class="truth">不要填<b>真名 / 学校 / 住址</b><br>AI 隐私保护跟传统软件不同</div></div>
    <div class="myth"><div class="x">!</div><div class="lie">"AI 也能聊天解闷"</div><div class="truth">娃<b>不能拿 AI 当朋友</b><br>替代真实社交 · 长期会孤独</div></div>
    <div class="pull">
      <h2>大连家长真心话<br><b>"AI 是工具 · 不是玩具 · 不是朋友"</b></h2>
    </div>
  </div>
</body>
</html>
