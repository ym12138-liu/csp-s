<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>家长帮娃玩 AI · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#BF360C; color:#FFFFFF; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(255,202,40,0.55) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,235,59,0.5) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#BF360C; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#FFEB3B; }
  h1 em { font-style:normal; color:#FFFFFF; }
  .min { background:#FFFFFF; color:#1A1A1A; border-radius: 16px; padding: 18px 22px; margin-top: 14px; border-left: 12px solid #E65100; box-shadow: 5px 5px 0 #FFCA28; position: relative; }
  .min::before { content: attr(data-t); position:absolute; left: -20px; top: -16px; padding: 8px 14px; border-radius: 12px; background:#FFEB3B; color:#BF360C; font-weight:900; font-size:20px; box-shadow: 4px 4px 0 #1A1A1A; }
  .min h3 { font-size: 26px; color:#BF360C; font-weight:900; padding-left: 60px; }
  .min p { font-size: 22px; color:#424242; margin-top: 4px; line-height: 1.5; font-weight: 700; }
  .min p b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #BF360C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: linear-gradient(135deg, #FFCA28, #FFEB3B); color:#1A1A1A; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; }
  .pull h2 { font-size: 36px; font-weight:900; line-height: 1.35; }
  .pull h2 b { color: #B71C1C; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFEB3B; font-weight:700; }
  .pill { background:#FFEB3B; color:#BF360C; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">每天 10 分钟陪 AI 法</span>
    <h1>每天 10 分钟<br><em>就够</em></h1>
    <div class="min" data-t="0-3 分"><h3>问 · "今天 AI 帮你了啥"</h3><p>娃复述用过的 1-2 个 AI 场景</p></div>
    <div class="min" data-t="3-5 分"><h3>看 · 那个回答靠不靠谱</h3><p>家长一起看 · <b>找 1 处可疑</b></p></div>
    <div class="min" data-t="5-7 分"><h3>追 · 还能怎么追问</h3><p>"如果再问 1 个问题 · 你会问啥"</p></div>
    <div class="min" data-t="7-10 分"><h3>赞 · 找出娃的好提问</h3><p>"你那个问题问得真好" · <b>具体表扬</b></p></div>
    <div class="pull">
      <h2>大连家长真心话<br><b>"10 分钟 × 365 天 = 娃自然成 AI 原住民"</b></h2>
    </div>
  </div>
  <div class="cta">
    <span># AI 陪学 # 10 分钟 # 大连</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
