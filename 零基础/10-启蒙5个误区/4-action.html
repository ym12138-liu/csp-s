<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>启蒙 5 个误区 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#4A148C; color:#FFF; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(194,24,91,0.55) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,215,0,0.5) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFD700; color:#4A148C; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#FFD700; }
  .mantra { background:#FFFFFF; color:#1A1A1A; border-radius: 16px; padding: 18px 22px; margin-top: 16px; border-left: 12px solid #FFD700; box-shadow: 6px 6px 0 #C2185B; position: relative; }
  .mantra::before { content: attr(data-n); position:absolute; left: -16px; top: -16px; width: 50px; height: 50px; border-radius: 50%; background:#FFD700; color:#4A148C; font-weight:900; font-size:26px; display:flex; align-items:center; justify-content:center; box-shadow: 3px 3px 0 #1A1A1A; }
  .mantra h3 { font-size: 30px; color:#4A148C; font-weight:900; padding-left: 50px; }
  .mantra p { font-size: 22px; color:#424242; margin-top: 4px; line-height: 1.5; }
  .pull { margin-top: 26px; padding: 24px 28px; background: linear-gradient(135deg, #FFD700, #C2185B); color:#FFFFFF; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; text-shadow: 2px 2px 0 #1A1A1A; }
  .pull h2 { font-size: 38px; font-weight:900; line-height: 1.35; }
  .pull h2 b { color: #FFD700; }
  .pull p { font-size: 22px; font-weight:700; margin-top: 8px; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFD700; font-weight:700; }
  .pill { background:#FFD700; color:#4A148C; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">家长 5 句口诀 · 收藏</span>
    <h1>家长 5 句<br><em>口诀</em></h1>

    <div class="mantra" data-n="1"><h3>不抢早 · 等娃逻辑成熟</h3><p>3 个测试都通过 · 才是开始的时候</p></div>
    <div class="mantra" data-n="2"><h3>不堆量 · 每周 5 小时够</h3><p>主科是 1 · 编程是 0 · 没 1 不行</p></div>
    <div class="mantra" data-n="3"><h3>不迷信 · 报班短期试</h3><p>免费试听 + 3 个月观察 + 看效果再续</p></div>
    <div class="mantra" data-n="4"><h3>不过度 · 看孩子兴趣</h3><p>娃哭闹 / 抗拒 = 暂停信号 · 别硬撑</p></div>
    <div class="mantra" data-n="5"><h3>不内卷 · 关注成长</h3><p>对比邻居家娃 = 伤娃自信</p></div>

    <div class="pull">
      <h2>10 篇科普收官<br><b>"娃喜欢 · 家长不焦虑 · 信奥才有意义"</b></h2>
      <p>大连家长加油 · 别被机构话术裹挟</p>
    </div>
  </div>
  <div class="cta">
    <span>#启蒙 #零基础 #大连娃</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
