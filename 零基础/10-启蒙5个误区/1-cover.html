<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>启蒙 5 个误区 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg, #4A148C 0%, #C2185B 50%, #FFD700 100%); color:#FFF; position:relative; }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,215,0,0.55) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFD700; padding:14px 32px; border-radius:100px; font-size:32px; font-weight:900; letter-spacing:2px; margin-bottom: 50px; box-shadow: 6px 6px 0 #FFD700; }
  .pre { font-size: 42px; font-weight: 800; color: #FFD700; margin-bottom: 18px; }
  .title { font-size: 156px; font-weight:900; line-height:0.95; color:#FFFFFF; text-shadow: 6px 6px 0 #4A148C; letter-spacing: -4px; }
  .title em { font-style:normal; background: #FFD700; color:#4A148C; padding: 0 16px; display: inline-block; box-shadow: 8px 8px 0 #1A1A1A; }
  .pit-row { margin-top: 40px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .pit { background: #FFFFFF; border: 4px solid #1A1A1A; border-radius: 14px; padding: 14px 4px; text-align: center; box-shadow: 4px 4px 0 #B71C1C; }
  .pit .v { font-size: 36px; font-weight: 900; color: #B71C1C; line-height: 1; }
  .pit .l { font-size: 14px; font-weight: 800; color: #1A1A1A; margin-top: 6px; }
  .sub { margin-top: 36px; background:#1A1A1A; color:#FFD700; padding: 18px 26px; border-radius: 14px; box-shadow: 6px 6px 0 #FFD700; font-size: 36px; font-weight: 800; line-height: 1.4; display: inline-block; border: 4px solid #FFD700; }
  .sub b { color: #FFFFFF; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#FFD700; font-weight:900; }
  .stamp { background:#FFD700; color:#4A148C; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长不焦虑系列 · 启蒙第 10 篇 · 收官</div>
    <div class="pre">"我都中招了几条？"</div>
    <div class="title">5 个 <em>误区</em><br>必看</div>
    <div class="pit-row">
      <div class="pit"><div class="v">1</div><div class="l">越早越好</div></div>
      <div class="pit"><div class="v">2</div><div class="l">报班保过</div></div>
      <div class="pit"><div class="v">3</div><div class="l">学多就好</div></div>
      <div class="pit"><div class="v">4</div><div class="l">必须 C++</div></div>
      <div class="pit"><div class="v">5</div><div class="l">奖牌至上</div></div>
    </div>
    <div class="sub">10 篇科普收官<br><b>5 个误区一次讲清</b></div>
  </div>
  <div class="footer">
    <span>#启蒙误区 #零基础 #大连娃</span>
    <span class="stamp">收官收藏</span>
  </div>
</body>
</html>
