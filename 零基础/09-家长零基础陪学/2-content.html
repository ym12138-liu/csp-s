<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>家长零基础陪学 · 4 招</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#FFF8E1; color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #BF360C, #FFCA28); }
  body::after  { content:""; position:absolute; bottom:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #FFCA28, #BF360C); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#BF360C; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 70px; font-weight:900; margin-top:18px; line-height:1.1; color:#BF360C; }
  h1 em { font-style:normal; background: linear-gradient(transparent 60%, #FFEB3B 60%); padding: 0 6px; }
  .row { display:flex; align-items:center; padding: 18px 22px; background:#FFF; border-radius: 16px; margin-top: 16px; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #E65100; }
  .row .num { flex: 0 0 80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:38px; color:#FFF; margin-right: 20px; box-shadow: 3px 3px 0 #1A1A1A; }
  .n1 { background: #FF8A65; }
  .n2 { background: #66BB6A; }
  .n3 { background: #5C6BC0; }
  .n4 { background: #AB47BC; }
  .row .body { flex: 1; }
  .row .body h3 { font-size: 28px; font-weight: 900; color: #1A1A1A; line-height: 1.2; }
  .row .body p { font-size: 22px; color: #424242; margin-top: 4px; line-height: 1.4; }
  .row .body p b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #BF360C; }
  .key { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #FF6F00; }
  .key h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .key h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">4 种陪学法 · 不需要会代码</span>
    <h1>家长 4 招 <em>都能上手</em></h1>

    <div class="row"><div class="num n1">1</div><div class="body"><h3>当"代码听众"</h3><p>娃讲他写的代码 · 你假装听不懂 <b>多问"为什么"</b><br>讲懂了 · 娃自己也理清了</p></div></div>
    <div class="row"><div class="num n2">2</div><div class="body"><h3>当"运行测试员"</h3><p>娃说他的程序能算 · <b>你出 5 个测试数据</b>验证<br>娃要解释每个数据为什么对</p></div></div>
    <div class="row"><div class="num n3">3</div><div class="body"><h3>当"时间管理员"</h3><p>不懂代码也能管时间 · <b>每周计算编程时长</b><br>5 小时内 = 健康 · 超过就提醒</p></div></div>
    <div class="row"><div class="num n4">4</div><div class="body"><h3>当"成果记录员"</h3><p>娃做的项目 / 解的题 · <b>拍照存档</b><br>3 个月后回看 · 娃自己看到进步</p></div></div>

    <div class="key">
      <h2>核心 ·<br><b>陪学不是教 · 是<br>"听 · 测 · 管 · 记"</b></h2>
    </div>
  </div>
</body>
</html>
