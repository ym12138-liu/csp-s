<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>家长零基础陪学 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#BF360C; color:#FFF; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(255,202,40,0.5) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,235,59,0.4) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#BF360C; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#FFEB3B; }
  .min { background:#2C2C2C; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 10px solid #FFCA28; position: relative; }
  .min::before { content: attr(data-t); position:absolute; left: -32px; top: -16px; padding: 8px 14px; border-radius: 12px; background:#FFEB3B; color:#BF360C; font-weight:900; font-size:22px; box-shadow: 4px 4px 0 #1A1A1A; }
  .min h3 { font-size: 30px; color:#FFEB3B; font-weight:900; padding-left: 60px; }
  .min p { font-size: 24px; color:#E0E0E0; margin-top: 6px; line-height: 1.5; }
  .min p b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #BF360C; }
  .pull { margin-top: 26px; padding: 24px 28px; background: linear-gradient(135deg, #FFCA28, #FFEB3B); color:#1A1A1A; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; }
  .pull h2 { font-size: 38px; font-weight:900; line-height: 1.35; }
  .pull h2 b { color: #B71C1C; }
  .pull p { font-size: 22px; font-weight:700; margin-top: 8px; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFEB3B; font-weight:700; }
  .pill { background:#FFEB3B; color:#BF360C; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">每天 5 分钟陪学法</span>
    <h1>每天 5 分钟<br><em>就能陪</em></h1>
    <div class="min" data-t="0-1 分"><h3>问 · 今天写啥代码</h3><p>娃简单说 · 你不用懂细节 · <b>关键听他能不能讲清楚</b></p></div>
    <div class="min" data-t="1-3 分"><h3>看 · 程序跑起来啥效果</h3><p>请娃<b>当面跑一遍</b> · 你看到结果即可<br>不用懂代码 · 看效果对不对即可</p></div>
    <div class="min" data-t="3-4 分"><h3>问 · 有没有遇到 bug</h3><p>关键问题：<b>"哪一步卡住了"</b><br>娃边讲边理 · 90% 自己能想明白</p></div>
    <div class="min" data-t="4-5 分"><h3>赞 · 具体表扬</h3><p>不说"你真棒" · 说<b>"今天这个循环写得很巧"</b><br>具体表扬比泛泛夸奖管用 10 倍</p></div>
    <div class="pull">
      <h2>大连家长真心话<br><b>"5 分钟 × 365 天 > 1 小时 × 1 次"</b></h2>
      <p>陪伴的关键是稳定 · 不是时长</p>
    </div>
  </div>
  <div class="cta">
    <span>#家长陪学 #5分钟 #大连</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
