<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>家长零基础陪学 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#FFE0B2 0%, #FFF59D 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#BF360C; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#BF360C; }
  h1 em { font-style:normal; background:#FFEB3B; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #E65100; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#B71C1C; color:#FFEB3B; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 28px; color: #B71C1C; font-weight: 900; text-decoration: line-through; padding-left: 50px; }
  .myth .truth { font-size: 26px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #BF360C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #E65100; }
  .pull h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">家长别做这 4 件事</span>
    <h1>陪学雷区<br>这 4 件 <em>千万别</em></h1>

    <div class="myth"><div class="x">×</div><div class="lie">替娃写代码 · "妈妈帮你"</div><div class="truth">家长一动手 · 娃<b>立马放手</b><br>你帮一次 · 后面 100 次都要靠你</div></div>

    <div class="myth"><div class="x">×</div><div class="lie">娃写错了立刻指出来</div><div class="truth">娃需要<b>自己 debug</b> · 这是核心能力<br>你直接说错哪 · 等于剥夺成长机会</div></div>

    <div class="myth"><div class="x">×</div><div class="lie">老对比"邻居家娃 GESP X 级"</div><div class="truth">娃<b>最讨厌被对比</b> · 自尊受伤 → 抗拒编程<br>每个娃节奏不同 · 看自己进步即可</div></div>

    <div class="myth"><div class="x">×</div><div class="lie">娃不会就不停催</div><div class="truth">编程要静下心思考 · <b>催只会让娃慌</b><br>给 30 分钟 · 实在不会再讨论</div></div>

    <div class="pull">
      <h2>大连家长真心话<br><b>"陪伴 ≠ 干涉 · 见证 ≠ 评判"</b></h2>
    </div>
  </div>
</body>
</html>
