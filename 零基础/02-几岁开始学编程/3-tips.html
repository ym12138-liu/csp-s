<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>几岁开始学编程 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#FFF59D 0%, #B2DFDB 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#00897B; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#004D40; }
  h1 em { font-style:normal; background:#FFEB3B; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #00897B; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#B71C1C; color:#FFEB3B; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 28px; color: #B71C1C; font-weight: 900; text-decoration: line-through; padding-left: 50px; }
  .myth .truth { font-size: 26px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #B71C1C; }

  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #00897B; }
  .pull h2 { font-size: 36px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">误区扫荡 · 别走极端</span>
    <h1>关于年龄<br>这 3 件事 <em>是误传</em></h1>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">越早开始越好 · 3 岁就要学</div>
      <div class="truth">3 岁手指还不灵 · 抽象思维没发育<br>过早学只会让娃<b>排斥编程</b> · 反而是负面效果</div>
    </div>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">小学不学就晚了 · 初中追不上</div>
      <div class="truth">很多 NOIP 拿奖的娃<b>初一才开始</b><br>关键看<b>逻辑成熟度</b>不是年龄 · 初中学不晚</div>
    </div>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">必须连续学 · 不能停</div>
      <div class="truth">学一段时间 + <b>学校学业重时暂停</b>很正常<br>编程是技能 · 不是钢琴 · 短暂中断不会"忘"</div>
    </div>

    <div class="pull">
      <h2>大连家长真心话<br><b>看孩子的"逻辑窗口期" · 不看年龄数字</b></h2>
    </div>
  </div>
</body>
</html>
