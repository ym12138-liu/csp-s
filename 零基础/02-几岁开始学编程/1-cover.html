<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>几岁开始学编程 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(135deg, #00BFA5 0%, #4DB6AC 50%, #FFEB3B 100%);
    color:#1A1A1A; position:relative;
  }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,235,59,0.6) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:14px 32px; border-radius:100px; font-size:32px; font-weight:900; letter-spacing:2px; margin-bottom: 50px; box-shadow: 6px 6px 0 #00897B; }
  .pre { font-size: 42px; font-weight: 800; color: #004D40; margin-bottom: 18px; }
  .title { font-size: 144px; font-weight:900; line-height:0.95; color:#1A1A1A; text-shadow: 6px 6px 0 #FFFFFF; letter-spacing: -4px; }
  .title em { font-style:normal; background: #1A1A1A; color:#1DE9B6; padding: 0 16px; display: inline-block; box-shadow: 8px 8px 0 #FFFFFF; }
  .age-row {
    margin-top: 30px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  }
  .age-card {
    background:#FFF; border: 4px solid #1A1A1A;
    border-radius: 14px; padding: 14px 8px;
    text-align: center; box-shadow: 4px 4px 0 #00897B;
  }
  .age-card .v { font-size: 32px; font-weight: 900; color: #00897B; line-height: 1.1; }
  .age-card .l { font-size: 18px; font-weight: 700; color: #1A1A1A; margin-top: 4px; }
  .sub {
    margin-top: 36px;
    background:#FFFFFF; color:#004D40;
    padding: 18px 26px; border-radius: 14px;
    border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #00897B;
    font-size: 36px; font-weight: 800; line-height: 1.4;
    display: inline-block;
  }
  .sub b { color: #B71C1C; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#1A1A1A; font-weight:900; }
  .stamp { background:#1A1A1A; color:#FFEB3B; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长不焦虑系列 · 启蒙第 2 篇</div>
    <div class="pre">"3 岁就开始能跟得上吗？"</div>
    <div class="title">
      几岁<br>
      开始 <em>学编程</em>
    </div>
    <div class="age-row">
      <div class="age-card"><div class="v">4-6</div><div class="l">幼儿园</div></div>
      <div class="age-card"><div class="v">7-9</div><div class="l">小学低</div></div>
      <div class="age-card"><div class="v">10-12</div><div class="l">小学高</div></div>
      <div class="age-card"><div class="v">13+</div><div class="l">初中</div></div>
    </div>
    <div class="sub">
      不是越早越好<br>
      <b>每个阶段有不同玩法</b>
    </div>
  </div>
  <div class="footer">
    <span>#零基础 #编程启蒙 #大连娃</span>
    <span class="stamp">收藏不亏</span>
  </div>
</body>
</html>
