<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>信奥是什么 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(135deg, #FF8A65 0%, #FFB74D 50%, #FFEB3B 100%);
    color: #1A1A1A; position: relative;
  }
  body::before {
    content:""; position:absolute; top:-100px; right:-100px;
    width: 460px; height: 460px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 70%);
  }
  body::after {
    content:""; position:absolute; bottom:-80px; left:-80px;
    width: 380px; height: 380px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,235,59,0.6) 0%, transparent 70%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge {
    display:inline-block; background:#1A1A1A; color:#FFEB3B;
    padding:14px 32px; border-radius:100px;
    font-size:32px; font-weight:900; letter-spacing:2px;
    margin-bottom: 50px;
    box-shadow: 6px 6px 0 #E64A19;
  }
  .pre { font-size: 42px; font-weight: 800; color: #BF360C; margin-bottom: 18px; }
  .title {
    font-size: 144px; font-weight: 900; line-height: 0.95; color: #1A1A1A;
    text-shadow: 6px 6px 0 #FFFFFF;
    letter-spacing: -4px;
  }
  .title em {
    font-style:normal;
    background: #1A1A1A; color:#FFEB3B;
    padding: 0 16px; display: inline-block;
    box-shadow: 8px 8px 0 #FFFFFF;
  }
  .qmark {
    font-size: 200px; font-weight:900; color: #B71C1C;
    text-shadow: 8px 8px 0 #FFFFFF;
    line-height: 1;
  }
  .sub {
    margin-top: 36px;
    background: #FFFFFF; color: #1A1A1A;
    padding: 18px 26px; border-radius: 14px;
    border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #E64A19;
    font-size: 36px; font-weight: 800; line-height: 1.4;
    display: inline-block;
  }
  .sub b { color: #B71C1C; }
  .footer {
    position:absolute; bottom:0; left:70px; right:70px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:28px; color:#1A1A1A; font-weight:900;
  }
  .stamp { background:#1A1A1A; color:#FFEB3B; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长不焦虑系列 · 启蒙第 1 篇</div>
    <div class="pre">娃说"我要学信奥" · 你蒙了吗？</div>
    <div class="title">
      信奥<span class="qmark">?</span><br>
      是<em>啥</em>
    </div>
    <div class="sub">
      不是奥数 · 不是奥英<br>
      <b>说人话讲清楚 · 5 分钟看懂</b>
    </div>
  </div>
  <div class="footer">
    <span>#零基础家长 #信奥启蒙 #大连娃</span>
    <span class="stamp">收藏不亏</span>
  </div>
</body>
</html>
