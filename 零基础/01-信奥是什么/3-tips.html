<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>信奥是什么 · 误区</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#FFE0B2 0%, #FFCCBC 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#E64A19; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#BF360C; }
  h1 em { font-style:normal; background:#FFEB3B; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth {
    background:#FFFFFF; border-radius: 18px;
    padding: 22px 26px; margin-top: 18px;
    border-left: 12px solid #E64A19;
    position: relative;
  }
  .myth .x {
    position: absolute; top: -16px; left: -16px;
    width: 56px; height: 56px; border-radius:50%;
    background:#B71C1C; color:#FFEB3B; font-weight:900; font-size:32px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 4px 4px 0 #1A1A1A;
  }
  .myth .lie {
    font-size: 28px; color: #B71C1C; font-weight: 900;
    text-decoration: line-through;
    padding-left: 50px;
  }
  .myth .truth {
    font-size: 26px; color: #1A1A1A;
    font-weight: 700; line-height: 1.5;
    margin-top: 8px;
  }
  .myth .truth b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .pull {
    margin-top: 22px; padding: 22px 26px;
    background: #1A1A1A; color: #FFEB3B;
    border-radius: 16px;
    box-shadow: 8px 8px 0 #E64A19;
  }
  .pull h2 { font-size: 36px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">误区扫荡 · 别再误会</span>
    <h1>关于信奥<br>这 4 件事 <em>是谣言</em></h1>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">信奥就是少儿编程</div>
      <div class="truth">少儿编程是<b>启蒙游戏</b>（拖积木）<br>信奥是<b>竞技解题</b>（写算法）· 难度差好几个维度</div>
    </div>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">学了信奥就能当程序员</div>
      <div class="truth">信奥练的是 <b>算法 + 数学思维</b><br>实际工作中"程序员"用的是工程能力 · <b>两件事不是一件</b></div>
    </div>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">信奥拿奖就能保送</div>
      <div class="truth">只有<b>极少数</b>顶级奖项（如 NOI 银牌以上）+ 高考分够才有<b>强基计划</b>资格<br>普通省一 / 省二 ≠ 保送</div>
    </div>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">学不会信奥孩子就不是码农苗子</div>
      <div class="truth">信奥练的是<b>算法天赋</b> · 写代码的能力**多种多样**<br>有的娃做产品、做游戏更厉害 · <b>别用一把尺子量所有娃</b></div>
    </div>

    <div class="pull">
      <h2>记住一句话<br><b>信奥是一种"学科竞赛" · 不是必经之路</b></h2>
    </div>
  </div>
</body>
</html>
