<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大连娃 3 个坑 · 详解</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#E1F5FE; color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #01579B, #FFEB3B); }
  body::after  { content:""; position:absolute; bottom:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #FFEB3B, #01579B); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#01579B; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 70px; font-weight:900; margin-top:18px; line-height:1.1; color:#01579B; }
  h1 em { font-style:normal; background: linear-gradient(transparent 60%, #FFEB3B 60%); padding: 0 6px; }
  .pit-card { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #B71C1C; }
  .pit-card .num { display:inline-block; background:#B71C1C; color:#FFEB3B; padding:6px 16px; border-radius: 8px; font-weight:900; font-size: 24px; }
  .pit-card h3 { font-size: 32px; font-weight: 900; color: #B71C1C; margin-top: 8px; }
  .pit-card .scene { font-size: 22px; color: #424242; line-height: 1.5; margin-top: 8px; padding: 10px 14px; background: #FFEBEE; border-left: 6px solid #B71C1C; border-radius: 6px; font-weight: 700; }
  .pit-card .fix { font-size: 22px; color: #2E7D32; line-height: 1.5; margin-top: 8px; padding: 10px 14px; background: #E8F5E9; border-left: 6px solid #4CAF50; border-radius: 6px; font-weight: 700; }
  .pit-card .fix b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .key { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #4FC3F7; }
  .key h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .key h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">大连家长真实踩坑实录</span>
    <h1>3 个<em>大坑</em></h1>

    <div class="pit-card">
      <span class="num">坑 1</span>
      <h3>选错机构 · 一年学费打水漂</h3>
      <div class="scene">"包过 GESP 八级"广告 → 报全年 → 娃只会套模板 → CSP 一来就懵</div>
      <div class="fix">[对] <b>试听 1-2 节</b> → 短期报 → 看效果再续</div>
    </div>

    <div class="pit-card">
      <span class="num">坑 2</span>
      <h3>语言选错 · 学半年要重来</h3>
      <div class="scene">娃 8 岁直接学 C++ → 语法搞不清 → 厌学放弃</div>
      <div class="fix">[对] <b>低龄先 Scratch</b> → 12 岁前必转 Python / C++</div>
    </div>

    <div class="pit-card">
      <span class="num">坑 3</span>
      <h3>节奏抢早 · 拔苗助长</h3>
      <div class="scene">小学一年级强塞 GESP 课 → 娃看不懂 → 后续更抗拒</div>
      <div class="fix">[对] <b>等娃逻辑成熟</b>再开始 · 不是早就好</div>
    </div>

    <div class="key">
      <h2>核心 ·<br><b>3 个坑的根都是"急" · 慢一点反而快</b></h2>
    </div>
  </div>
</body>
</html>
