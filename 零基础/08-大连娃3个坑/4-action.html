<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大连娃 3 个坑 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#01579B; color:#FFF; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(79,195,247,0.5) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,235,59,0.4) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#01579B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#FFEB3B; }
  .step { background:#2C2C2C; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 10px solid #4FC3F7; position: relative; }
  .step::before { content: attr(data-n); position:absolute; left: -28px; top: -16px; width: 60px; height: 60px; border-radius: 50%; background:#FFEB3B; color:#01579B; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .step h3 { font-size: 30px; color:#FFEB3B; font-weight:900; padding-left: 40px; }
  .step p { font-size: 24px; color:#E0E0E0; margin-top: 6px; line-height: 1.5; }
  .step p b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #01579B; }
  .pull { margin-top: 26px; padding: 24px 28px; background: linear-gradient(135deg, #4FC3F7, #FFEB3B); color:#1A1A1A; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; }
  .pull h2 { font-size: 38px; font-weight:900; line-height: 1.35; }
  .pull h2 b { color: #B71C1C; }
  .pull p { font-size: 22px; font-weight:700; margin-top: 8px; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFEB3B; font-weight:700; }
  .pill { background:#FFEB3B; color:#01579B; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">3 步避坑指南</span>
    <h1>大连家长 <br>3 步 <em>避坑</em></h1>
    <div class="step" data-n="1"><h3>第 1 步 · 不急下决定</h3><p>看到广告别立马报 · <b>问 3 个老家长再说</b><br>大连家长群是免费咨询所</p></div>
    <div class="step" data-n="2"><h3>第 2 步 · 给 3 个月观察期</h3><p>不论选啥 · 都<b>给 3 个月观察期</b><br>不行就立刻调整 · 别死磕</p></div>
    <div class="step" data-n="3"><h3>第 3 步 · 关注娃 · 不关注名次</h3><p>娃<b>主动想学</b> = 路线对<br>抗拒 / 哭闹 = 立即停下找问题</p></div>
    <div class="pull">
      <h2>大连家长教训<br><b>"焦虑买单 · 平静观察 · 才不踩坑"</b></h2>
      <p>娃的成长不是赛跑 · 是马拉松</p>
    </div>
  </div>
  <div class="cta">
    <span>#避坑 #大连家长 #真实经验</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
