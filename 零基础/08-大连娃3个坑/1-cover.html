<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大连娃 3 个坑 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg, #0277BD 0%, #4FC3F7 50%, #FFEB3B 100%); color:#FFF; position:relative; }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,235,59,0.6) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:14px 32px; border-radius:100px; font-size:32px; font-weight:900; letter-spacing:2px; margin-bottom: 50px; box-shadow: 6px 6px 0 #01579B; }
  .pre { font-size: 42px; font-weight: 800; color: #FFEB3B; margin-bottom: 18px; }
  .title { font-size: 152px; font-weight:900; line-height:0.95; color:#FFFFFF; text-shadow: 6px 6px 0 #01579B; letter-spacing: -4px; }
  .title em { font-style:normal; background: #FFEB3B; color:#01579B; padding: 0 16px; display: inline-block; box-shadow: 8px 8px 0 #1A1A1A; }
  .pit-row { margin-top: 36px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .pit { background: #FFFFFF; border: 4px solid #1A1A1A; border-radius: 14px; padding: 16px 8px; text-align: center; box-shadow: 4px 4px 0 #B71C1C; }
  .pit .v { font-size: 48px; font-weight: 900; color: #B71C1C; line-height: 1; }
  .pit .l { font-size: 22px; font-weight: 800; color: #1A1A1A; margin-top: 8px; }
  .sub { margin-top: 36px; background:#1A1A1A; color:#FFEB3B; padding: 18px 26px; border-radius: 14px; box-shadow: 6px 6px 0 #FFEB3B; font-size: 36px; font-weight: 800; line-height: 1.4; display: inline-block; border: 4px solid #FFEB3B; }
  .sub b { color: #FFFFFF; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#FFEB3B; font-weight:900; }
  .stamp { background:#FFEB3B; color:#01579B; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长不焦虑系列 · 启蒙第 8 篇</div>
    <div class="pre">"邻居家娃踩过的坑 · 别再踩"</div>
    <div class="title">大连娃<br>3 个 <em>坑</em></div>
    <div class="pit-row">
      <div class="pit"><div class="v">坑 1</div><div class="l">机构选错</div></div>
      <div class="pit"><div class="v">坑 2</div><div class="l">语言选错</div></div>
      <div class="pit"><div class="v">坑 3</div><div class="l">节奏抢早</div></div>
    </div>
    <div class="sub">大连家长群里<br><b>这 3 个坑年年踩</b></div>
  </div>
  <div class="footer">
    <span>#大连娃 #避坑 #真实经验</span>
    <span class="stamp">收藏不踩坑</span>
  </div>
</body>
</html>
