<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>编程语言怎么选 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#C5CAE9 0%, #FFF59D 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#1A237E; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#1A237E; }
  h1 em { font-style:normal; background:#FFEB3B; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #3F51B5; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#B71C1C; color:#FFEB3B; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 28px; color: #B71C1C; font-weight: 900; text-decoration: line-through; padding-left: 50px; }
  .myth .truth { font-size: 26px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #3F51B5; }
  .pull h2 { font-size: 36px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">误区扫荡 · 别被忽悠</span>
    <h1>关于语言<br>这 3 件事 <em>是误传</em></h1>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">直接学 C++ 最高效 · 跳过 Scratch</div>
      <div class="truth">小学低年级直接 C++<b>大概率挂掉</b><br>语法严 / 错误提示晦涩 · 没逻辑基础先打地基</div>
    </div>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">学 Python 没用 · 比赛不让用</div>
      <div class="truth">Python <b>能做更多实用项目</b>（爬虫 / AI / 数据）<br>不冲信奥的娃学 Python 比 C++ 更<b>有持续动力</b></div>
    </div>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">Scratch 太简单 · 浪费时间</div>
      <div class="truth">Scratch 练的是<b>逻辑思维</b>不是语法<br>跳过它直接打字写代码 · 很多娃<b>3 个月就放弃了</b></div>
    </div>

    <div class="pull">
      <h2>大连家长真心话<br><b>语言只是工具 · 思维才是目的</b></h2>
    </div>
  </div>
</body>
</html>
