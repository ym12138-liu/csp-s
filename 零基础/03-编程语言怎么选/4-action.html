<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>编程语言怎么选 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#1A237E; color:#FFF; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(63,81,181,0.5) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,235,59,0.4) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#1A237E; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#FFEB3B; }
  .tree { background:#FFFFFF; color:#1A1A1A; border-radius: 18px; padding: 24px 28px; margin-top: 22px; border: 4px solid #1A1A1A; box-shadow: 8px 8px 0 #FFEB3B; }
  .tree h3 { font-size: 30px; font-weight: 900; color: #1A237E; margin-bottom: 14px; text-align: center; }
  .branch { padding: 14px 18px; background: #E8EAF6; border-radius: 12px; margin-top: 12px; border-left: 8px solid #3F51B5; }
  .branch .q { font-size: 24px; font-weight: 800; color: #1A237E; }
  .branch .a { font-size: 26px; font-weight: 900; color: #B71C1C; margin-top: 6px; }
  .branch .a b { background:#FFEB3B; padding: 0 8px; border-radius: 4px; }
  .pull { margin-top: 26px; padding: 24px 28px; background: linear-gradient(135deg, #FFEB3B, #3F51B5); color:#1A1A1A; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; }
  .pull h2 { font-size: 38px; font-weight:900; line-height: 1.35; }
  .pull h2 b { color: #B71C1C; }
  .pull p { font-size: 22px; font-weight:700; margin-top: 8px; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFEB3B; font-weight:700; }
  .pill { background:#FFEB3B; color:#1A237E; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">5 分钟决策 · 直接挑</span>
    <h1>3 问 3 答<br><em>就选好</em></h1>

    <div class="tree">
      <h3>家长问自己 3 个问题</h3>
      <div class="branch">
        <div class="q">Q1 · 娃多大？</div>
        <div class="a">7-9 岁 → <b>Scratch</b> 起步</div>
      </div>
      <div class="branch">
        <div class="q">Q2 · 想冲 NOIP / 信奥吗？</div>
        <div class="a">想 → 直接 <b>C++</b> · 不绕路</div>
      </div>
      <div class="branch">
        <div class="q">Q3 · 不冲信奥但想长期学？</div>
        <div class="a">推荐 <b>Python</b> · 能做更多实用项目</div>
      </div>
    </div>

    <div class="pull">
      <h2>大连家长简单决策<br><b>"小学先 Scratch · 中学冲信奥换 C++"</b></h2>
      <p>不冲信奥就坚持 Python · 别浪费时间在不感兴趣的语言上</p>
    </div>
  </div>
  <div class="cta">
    <span>#编程语言 #Scratch #Python #C++</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
