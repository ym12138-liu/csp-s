<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>影响成绩吗 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#0D47A1; color:#FFF; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(100,181,246,0.5) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,235,59,0.4) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#0D47A1; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#FFEB3B; }
  .week-table { background:#FFFFFF; color:#1A1A1A; border-radius: 18px; padding: 22px 26px; margin-top: 22px; border: 4px solid #1A1A1A; box-shadow: 8px 8px 0 #FFEB3B; }
  .week-table h3 { font-size: 30px; font-weight: 900; color: #0D47A1; margin-bottom: 14px; }
  .day-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px dashed #BBDEFB; font-size: 22px; }
  .day-row:last-child { border-bottom:none; }
  .day-row .day { flex: 0 0 110px; font-weight: 900; color: #0D47A1; background: #E3F2FD; padding: 6px 12px; border-radius: 8px; text-align: center; }
  .day-row .task { flex: 1; color: #424242; font-weight:700; padding-left: 16px; }
  .day-row .task b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .pull { margin-top: 24px; padding: 22px 26px; background: linear-gradient(135deg, #1976D2, #FFEB3B); color: #1A1A1A; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; }
  .pull h2 { font-size: 36px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #B71C1C; }
  .pull p { font-size: 22px; font-weight: 700; margin-top: 8px; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFEB3B; font-weight:700; }
  .pill { background:#FFEB3B; color:#0D47A1; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">家长 5 分钟排表</span>
    <h1>每周 5 小时<br><em>合理表</em></h1>

    <div class="week-table">
      <h3>小学版 · 适合 3-5 年级</h3>
      <div class="day-row"><div class="day">周一 - 周四</div><div class="task">作业完成后 · <b>30 分钟</b>编程</div></div>
      <div class="day-row"><div class="day">周五</div><div class="task">休息 / 学校加油 · <b>不安排</b></div></div>
      <div class="day-row"><div class="day">周六</div><div class="task">报班 / 集中刷题 · <b>1.5 小时</b></div></div>
      <div class="day-row"><div class="day">周日</div><div class="task">自由编程项目 / 复盘 · <b>1.5 小时</b></div></div>
      <div class="day-row"><div class="day"><b>合计</b></div><div class="task">≈ <b>5 小时 / 周</b></div></div>
    </div>

    <div class="pull">
      <h2>关键提醒<br><b>"考试周自动减半 · 不要硬撑"</b></h2>
      <p>大连家长的经验 · 灵活才能持久</p>
    </div>
  </div>
  <div class="cta">
    <span>#时间表 #平衡 #大连娃</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
