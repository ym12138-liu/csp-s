<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>影响成绩吗 · 数据</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#E3F2FD; color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #0D47A1, #FFEB3B); }
  body::after  { content:""; position:absolute; bottom:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #FFEB3B, #0D47A1); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#0D47A1; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 70px; font-weight:900; margin-top:18px; line-height:1.1; color:#0D47A1; }
  h1 em { font-style:normal; background: linear-gradient(transparent 60%, #FFEB3B 60%); padding: 0 6px; }
  .row { display:flex; align-items:center; padding: 18px 22px; background:#FFF; border-radius: 16px; margin-top: 16px; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #1976D2; }
  .row .when { flex: 0 0 130px; height: 90px; border-radius: 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:900; color:#FFF; margin-right: 18px; box-shadow: 3px 3px 0 #1A1A1A; }
  .w1 { background: #4CAF50; }
  .w2 { background: #FF9800; }
  .w3 { background: #B71C1C; }
  .row .when .v { font-size: 22px; line-height: 1; }
  .row .when .l { font-size: 14px; opacity: 0.9; margin-top: 4px; }
  .row .body { flex: 1; }
  .row .body h3 { font-size: 28px; font-weight: 900; color: #1A1A1A; line-height: 1.2; }
  .row .body p { font-size: 22px; color: #424242; margin-top: 4px; line-height: 1.4; }
  .row .body p b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #0D47A1; }
  .stat-box { margin-top: 22px; background:#FFFFFF; border: 4px solid #1A1A1A; border-radius: 16px; padding: 18px 22px; box-shadow: 6px 6px 0 #FFEB3B; }
  .stat-box h2 { font-size: 28px; font-weight: 900; color: #0D47A1; margin-bottom: 10px; }
  .stat-box p { font-size: 22px; line-height: 1.5; color: #424242; font-weight: 700; padding: 6px 0; }
  .stat-box p b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .key { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #B71C1C; }
  .key h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .key h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">分情况看 · 别一棒打死</span>
    <h1>3 种情况<em>结果不同</em></h1>

    <div class="row"><div class="when w1"><div class="v">3-5h</div><div class="l">每周</div></div><div class="body"><h3>不影响 · 反而促进</h3><p>逻辑思维好了 · <b>数学应用题反而提分</b></p></div></div>
    <div class="row"><div class="when w2"><div class="v">5-10h</div><div class="l">每周</div></div><div class="body"><h3>临界状态 · 看科目</h3><p>语文 / 英语<b>抢时间</b> · 数学物理可能受益</p></div></div>
    <div class="row"><div class="when w3"><div class="v">10h+</div><div class="l">每周</div></div><div class="body"><h3>大概率影响</h3><p>主科作业完不成 · <b>排名下滑明显</b></p></div></div>

    <div class="stat-box">
      <h2>大连家长真实反馈</h2>
      <p>每周 ≤ <b>5 小时</b> · 80% 反馈"不影响"</p>
      <p>每周 5-10 小时 · 半数说 <b>"语文英语下滑"</b></p>
      <p>每周 10+ 小时 · 多数承认 <b>主科有牺牲</b></p>
    </div>

    <div class="key">
      <h2>核心 ·<br><b>不是"学不学" · 是"学多久"</b></h2>
    </div>
  </div>
</body>
</html>
