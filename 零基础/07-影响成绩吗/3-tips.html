<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>影响成绩吗 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#BBDEFB 0%, #FFF59D 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#0D47A1; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#0D47A1; }
  h1 em { font-style:normal; background:#FFEB3B; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #1976D2; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#B71C1C; color:#FFEB3B; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 28px; color: #B71C1C; font-weight: 900; text-decoration: line-through; padding-left: 50px; }
  .myth .truth { font-size: 26px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #0D47A1; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #1976D2; }
  .pull h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">误区扫荡 · 别极端</span>
    <h1>关于时间<br>这 3 句话 <em>是误传</em></h1>
    <div class="myth"><div class="x">×</div><div class="lie">编程跟主科绝对冲突</div><div class="truth">编程练的<b>逻辑思维</b>跟数理是<b>同源</b><br>合理时间反而会促进数学物理</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">为了信奥放弃语文英语</div><div class="truth">信奥 ≠ 升学保底 · <b>主科基本盘不能丢</b><br>主科崩了 · 信奥拿奖也没用</div></div>
    <div class="myth"><div class="x">×</div><div class="lie">每天必须学 2 小时编程</div><div class="truth">小学每天 <b>30 分钟 + 周末 1 小时</b>就够<br>初中再视情况加量 · 不是越多越好</div></div>
    <div class="pull">
      <h2>大连家长真心话<br><b>"主科是 1 · 编程是 0 · 没 1 不行"</b></h2>
    </div>
  </div>
</body>
</html>
