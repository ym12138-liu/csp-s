<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>奥赛分得清吗 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg, #6A1B9A 0%, #BA68C8 50%, #FFEB3B 100%); color:#FFF; position:relative; }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,235,59,0.6) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:14px 32px; border-radius:100px; font-size:32px; font-weight:900; letter-spacing:2px; margin-bottom: 50px; box-shadow: 6px 6px 0 #4A148C; }
  .pre { font-size: 42px; font-weight: 800; color: #FFEB3B; margin-bottom: 18px; }
  .title { font-size: 132px; font-weight:900; line-height:0.95; color:#FFFFFF; text-shadow: 6px 6px 0 #4A148C; letter-spacing: -4px; }
  .title em { font-style:normal; background: #FFEB3B; color:#4A148C; padding: 0 16px; display: inline-block; box-shadow: 8px 8px 0 #1A1A1A; }
  .race-row { margin-top: 30px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .race-card { background:#FFF; border: 4px solid #1A1A1A; border-radius: 14px; padding: 14px 6px; text-align: center; box-shadow: 4px 4px 0 #4A148C; }
  .race-card .v { font-size: 26px; font-weight: 900; color: #4A148C; line-height: 1.1; }
  .race-card .l { font-size: 16px; font-weight: 700; color: #1A1A1A; margin-top: 4px; }
  .sub { margin-top: 36px; background:#FFFFFF; color:#4A148C; padding: 18px 26px; border-radius: 14px; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #FFEB3B; font-size: 36px; font-weight: 800; line-height: 1.4; display: inline-block; }
  .sub b { color: #B71C1C; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#FFEB3B; font-weight:900; }
  .stamp { background:#FFEB3B; color:#4A148C; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长不焦虑系列 · 启蒙第 4 篇</div>
    <div class="pre">"GESP？CSP-J？NOIP？傻傻分不清"</div>
    <div class="title">
      4 个赛事<br>
      <em>一图说清</em>
    </div>
    <div class="race-row">
      <div class="race-card"><div class="v">GESP</div><div class="l">能力认证</div></div>
      <div class="race-card"><div class="v">CSP-J</div><div class="l">普及组</div></div>
      <div class="race-card"><div class="v">CSP-S</div><div class="l">提高组</div></div>
      <div class="race-card"><div class="v">NOIP</div><div class="l">联赛</div></div>
    </div>
    <div class="sub">不是同一个赛<br><b>定位完全不同</b></div>
  </div>
  <div class="footer">
    <span>#信奥赛事 #零基础 #大连娃</span>
    <span class="stamp">收藏不亏</span>
  </div>
</body>
</html>
