<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>奥赛分得清吗 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#F8BBD0 0%, #FFF59D 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#4A148C; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#4A148C; }
  h1 em { font-style:normal; background:#FFEB3B; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #BA68C8; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#B71C1C; color:#FFEB3B; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 28px; color: #B71C1C; font-weight: 900; text-decoration: line-through; padding-left: 50px; }
  .myth .truth { font-size: 26px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #4A148C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #BA68C8; }
  .pull h2 { font-size: 36px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">误区扫荡 · 别走弯路</span>
    <h1>关于赛事<br>这 3 件事 <em>家长常错</em></h1>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">必须先考 GESP 才能报 CSP</div>
      <div class="truth">CSP 报名<b>不要求 GESP 任何级别</b><br>娃水平到了 → 直接报 CSP-J 即可</div>
    </div>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">CSP-J 拿奖 = 升学保送</div>
      <div class="truth">CSP-J 省一/二/三<b>本身不直接保送</b><br>只有 NOIP / NOI 顶级奖项才有强基资格</div>
    </div>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">GESP 八级 = 信奥顶级</div>
      <div class="truth">八级只对应 <b>CSP-S 初赛 70 左右</b><br>真正"顶级" = NOIP 拿省奖以上 · 还差 1-2 年</div>
    </div>

    <div class="pull">
      <h2>大连家长真心话<br><b>"先看娃水平 · 再选赛事 · 别本末倒置"</b></h2>
    </div>
  </div>
</body>
</html>
