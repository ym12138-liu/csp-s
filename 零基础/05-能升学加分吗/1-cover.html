<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>能升学加分吗 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg, #B71C1C 0%, #FF7043 50%, #FFD700 100%); color:#FFF; position:relative; }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,215,0,0.6) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFD700; padding:14px 32px; border-radius:100px; font-size:32px; font-weight:900; letter-spacing:2px; margin-bottom: 50px; box-shadow: 6px 6px 0 #B71C1C; }
  .pre { font-size: 42px; font-weight: 800; color: #FFD700; margin-bottom: 18px; }
  .title { font-size: 156px; font-weight:900; line-height:0.95; color:#FFFFFF; text-shadow: 6px 6px 0 #B71C1C; letter-spacing: -4px; }
  .title em { font-style:normal; background: #FFD700; color:#B71C1C; padding: 0 16px; display: inline-block; box-shadow: 8px 8px 0 #1A1A1A; }
  .qmark { font-size: 220px; font-weight:900; color: #FFD700; text-shadow: 8px 8px 0 #1A1A1A; line-height: 1; }
  .sub { margin-top: 36px; background:#1A1A1A; color:#FFD700; padding: 18px 26px; border-radius: 14px; box-shadow: 6px 6px 0 #FFD700; font-size: 36px; font-weight: 800; line-height: 1.4; display: inline-block; border: 4px solid #FFD700; }
  .sub b { color: #FFFFFF; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#FFD700; font-weight:900; }
  .stamp { background:#FFD700; color:#B71C1C; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长不焦虑系列 · 启蒙第 5 篇</div>
    <div class="pre">"信奥能加分？保送？真的吗"</div>
    <div class="title">
      升学 <span class="qmark">?</span><br>
      <em>实话</em>
    </div>
    <div class="sub">不画饼 · 不忽悠<br><b>3 种情况说清楚</b></div>
  </div>
  <div class="footer">
    <span>#信奥升学 #实话实说 #大连娃</span>
    <span class="stamp">收藏不亏</span>
  </div>
</body>
</html>
