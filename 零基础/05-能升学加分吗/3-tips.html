<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>能升学加分吗 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#FFCDD2 0%, #FFE082 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#B71C1C; color:#FFD700; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#B71C1C; }
  h1 em { font-style:normal; background:#FFD700; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #FF7043; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#B71C1C; color:#FFD700; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 28px; color: #B71C1C; font-weight: 900; text-decoration: line-through; padding-left: 50px; }
  .myth .truth { font-size: 26px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFD700; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFD700; border-radius: 16px; box-shadow: 8px 8px 0 #FF7043; }
  .pull h2 { font-size: 36px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFD700; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">误区扫荡 · 别被忽悠</span>
    <h1>关于升学<br>这 3 件事 <em>是套路</em></h1>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">学信奥 = 上清北捷径</div>
      <div class="truth">能上清北的信奥娃 = <b>NOI 银牌以上</b><br>全国每年不到 100 人 · 跟"捷径"两个字无关</div>
    </div>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">机构说"省一保送" 都信</div>
      <div class="truth">教育部早把"奥赛保送高考加分"<b>取消了</b><br>现在叫强基计划 · <b>仍然要高考分够 + 校测过关</b></div>
    </div>

    <div class="myth">
      <div class="x">×</div>
      <div class="lie">娃没拿奖 = 白学</div>
      <div class="truth">逻辑思维 / 抽象建模能力 = <b>一辈子受用</b><br>很多娃信奥没拿奖 · 但<b>数理化竞赛</b>反而拿了</div>
    </div>

    <div class="pull">
      <h2>大连家长真心话<br><b>"信奥 ≠ 升学保险 · 能拿奖是惊喜不是底气"</b></h2>
    </div>
  </div>
</body>
</html>
