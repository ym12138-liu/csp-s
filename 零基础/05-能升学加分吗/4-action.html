<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>能升学加分吗 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#B71C1C; color:#FFF; position:relative; }
  body::before { content:""; position:absolute; inset:0; background: radial-gradient(circle at 20% 80%, rgba(255,112,67,0.5) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,215,0,0.4) 0%, transparent 50%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFD700; color:#B71C1C; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#FFD700; }
  .step { background:#2C2C2C; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 10px solid #FF7043; position: relative; }
  .step::before { content: attr(data-n); position:absolute; left: -28px; top: -16px; width: 60px; height: 60px; border-radius: 50%; background:#FFD700; color:#B71C1C; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .step h3 { font-size: 32px; color:#FFD700; font-weight:900; padding-left: 40px; }
  .step p { font-size: 24px; color:#E0E0E0; margin-top: 6px; line-height: 1.5; }
  .step p b { background:#FFD700; padding: 0 6px; border-radius: 4px; color: #B71C1C; }
  .pull { margin-top: 26px; padding: 24px 28px; background: linear-gradient(135deg, #FF7043, #FFD700); color:#1A1A1A; border-radius: 18px; box-shadow: 8px 8px 0 #FFFFFF; }
  .pull h2 { font-size: 38px; font-weight:900; line-height: 1.35; }
  .pull h2 b { color: #B71C1C; }
  .pull p { font-size: 22px; font-weight:700; margin-top: 8px; }
  .cta { position:absolute; bottom:0; left:60px; right:60px; display:flex; justify-content:space-between; align-items:center; font-size:24px; color:#FFD700; font-weight:700; }
  .pill { background:#FFD700; color:#B71C1C; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">家长 3 步看清升学</span>
    <h1>3 步规划<br><em>不画饼</em></h1>

    <div class="step" data-n="1">
      <h3>第 1 步 · 看娃的天赋</h3>
      <p>能稳过 GESP 6 级的娃 = <b>万里挑十</b><br>能拿 NOIP 省一以上 = 万里挑一 · 别用万分之一概率赌</p>
    </div>

    <div class="step" data-n="2">
      <h3>第 2 步 · 看家庭定位</h3>
      <p>目标省级一本 = 信奥<b>不是必须</b>选项<br>目标清北 + 强基 = 多少要打到 CSP-S 级别</p>
    </div>

    <div class="step" data-n="3">
      <h3>第 3 步 · 看其他赛道</h3>
      <p>娃数学好 → 数学竞赛<br>娃物理好 → 物理竞赛<br>信奥<b>不是唯一选择</b> · 选最有天赋那条</p>
    </div>

    <div class="pull">
      <h2>大连家长真心话<br><b>"先培养兴趣 · 升学顺其自然"</b></h2>
      <p>信奥拿奖是惊喜 · 没拿奖思维已练就 · 双赢</p>
    </div>
  </div>
  <div class="cta">
    <span>#信奥升学 #实事求是 #大连娃</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
