<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>ACTION · 3 步规划</title>
<style>

.h1 h1 { font-size: 60px; font-weight: 900; color: #0D47A1; line-height: 1.1; }
.h1 h1 b { background: #2196F3; color: #FFFFFF; padding: 0 12px; border-radius: 6px; }

.pull h2 b { background: #2196F3; padding: 0 8px; border-radius: 4px; }

<div class="h1"><div class="pre">// 不画饼 · 实事求是</div><h1>3 步<br>看清<b>升学路</b></h1></div>
<div class="stages"><div class="stage" style="background:#FCE4EC"><div class="lvl">第 1 步</div><div class="body"><h3>看娃天赋</h3><p>能稳定通过 GESP 6 级 = 万里挑十 · 能拿 NOIP 省一 = 万里挑一 · 别用万分之一概率赌</p></div></div><div class="stage" style="background:#FFF8E1"><div class="lvl">第 2 步</div><div class="body"><h3>看家庭定位</h3><p>目标省级一本 = 信奥不是必须 · 目标清北 + 强基 = 多少要打到 CSP-S</p></div></div><div class="stage" style="background:#E8F5E9"><div class="lvl">第 3 步</div><div class="body"><h3>看其他赛道</h3><p>娃数学好 → 数学竞赛 · 物理好 → 物理竞赛 · 信奥不是唯一选择</p></div></div></div>
<div class="pull"><h2>信奥拿奖是惊喜 · <b>没拿奖思维也练就了</b> · 双赢</h2></div>
