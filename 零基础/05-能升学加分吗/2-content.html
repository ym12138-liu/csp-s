<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>能升学加分吗 · 路径</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#FFEBEE; color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #B71C1C, #FFD700); }
  body::after  { content:""; position:absolute; bottom:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #FFD700, #B71C1C); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#B71C1C; color:#FFD700; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 70px; font-weight:900; margin-top:18px; line-height:1.1; color:#B71C1C; }
  h1 em { font-style:normal; background: linear-gradient(transparent 60%, #FFD700 60%); padding: 0 6px; }

  .case { background:#FFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #B71C1C; position: relative; }
  .case .level { display:inline-block; background:#B71C1C; color:#FFD700; padding:6px 16px; border-radius: 8px; font-weight:900; font-size: 24px; }
  .case h3 { font-size: 30px; font-weight: 900; color: #1A1A1A; margin-top: 8px; }
  .case .can { background:#E8F5E9; padding: 10px 16px; border-radius: 10px; border-left: 6px solid #4CAF50; font-size: 22px; font-weight: 800; color: #2E7D32; margin-top: 10px; }
  .case .can b { color: #B71C1C; }
  .case .cannot { background:#FFEBEE; padding: 10px 16px; border-radius: 10px; border-left: 6px solid #B71C1C; font-size: 22px; font-weight: 800; color: #B71C1C; margin-top: 8px; }

  .key { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFD700; border-radius: 16px; box-shadow: 8px 8px 0 #FF7043; }
  .key h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .key h2 b { color: #FFD700; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">3 种情况 · 实事求是</span>
    <h1>升学加分<em>分情况</em></h1>

    <div class="case">
      <span class="level">情况 1 · GESP / CSP-J 拿奖</span>
      <h3>能加分吗？</h3>
      <div class="can">✓ 部分省份小升初 / 中考<b>综合素质</b>加分</div>
      <div class="cannot">✗ 直接保送 / 大学加分 = 不能</div>
    </div>

    <div class="case">
      <span class="level">情况 2 · CSP-S / NOIP 省一</span>
      <h3>能加分吗？</h3>
      <div class="can">✓ 强基计划报名<b>条件之一</b>（要高考分够）</div>
      <div class="can">✓ 部分高中<b>自主招生</b>认可</div>
      <div class="cannot">✗ 高考直接加分 = 早就取消了</div>
    </div>

    <div class="case">
      <span class="level">情况 3 · NOI 银牌以上</span>
      <h3>能加分吗？</h3>
      <div class="can">✓ <b>清华北大签约</b>降一本线录取</div>
      <div class="can">✓ <b>国家集训队</b>直接保送</div>
      <div class="can">✓ 全国不到 100 人 · 真正"金字塔顶"</div>
    </div>

    <div class="key">
      <h2>核心 ·<br><b>普通省一 ≠ 升学硬通货</b><br>NOI 银牌以上才是真"通行证"</h2>
    </div>
  </div>
</body>
</html>
