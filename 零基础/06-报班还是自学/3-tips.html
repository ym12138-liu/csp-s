<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>报班还是自学 · 提示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(180deg,#B2EBF2 0%, #FFF59D 100%); color:#1A1A1A; position:relative; }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#006064; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 76px; font-weight:900; margin-top:18px; line-height:1.05; color:#006064; }
  h1 em { font-style:normal; background:#FFEB3B; padding: 0 8px; box-shadow: 4px 4px 0 #1A1A1A; display:inline-block; }
  .myth { background:#FFFFFF; border-radius: 18px; padding: 22px 26px; margin-top: 18px; border-left: 12px solid #FF9800; position: relative; }
  .myth .x { position: absolute; top: -16px; left: -16px; width: 56px; height: 56px; border-radius:50%; background:#B71C1C; color:#FFEB3B; font-weight:900; font-size:32px; display:flex; align-items:center; justify-content:center; box-shadow: 4px 4px 0 #1A1A1A; }
  .myth .lie { font-size: 28px; color: #B71C1C; font-weight: 900; padding-left: 50px; }
  .myth .lie .quote { background: #FFEBEE; padding: 0 6px; border-radius: 4px; }
  .myth .truth { font-size: 24px; color: #1A1A1A; font-weight: 700; line-height: 1.5; margin-top: 8px; }
  .myth .truth b { background:#FFEB3B; padding: 0 6px; border-radius: 4px; color: #006064; }
  .pull { margin-top: 22px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #FF9800; }
  .pull h2 { font-size: 32px; color: #FFFFFF; font-weight: 900; line-height: 1.4; }
  .pull h2 b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">警惕 · 机构常用话术</span>
    <h1>这 4 句话<br><em>听到要警惕</em></h1>

    <div class="myth">
      <div class="x">!</div>
      <div class="lie"><span class="quote">"现在不报班 · 以后追不上"</span></div>
      <div class="truth">编程不是奥数 · <b>不存在"窗口期"</b><br>初一开始的娃也能拿 NOIP 奖</div>
    </div>

    <div class="myth">
      <div class="x">!</div>
      <div class="lie"><span class="quote">"我们是 NOI 教练带 · 直通省队"</span></div>
      <div class="truth">省队是<b>顶级娃自带光环</b> · 教练只是辅助<br>同样老师 · 90% 娃也进不了省队</div>
    </div>

    <div class="myth">
      <div class="x">!</div>
      <div class="lie"><span class="quote">"GESP 八级保过 · 不过退费"</span></div>
      <div class="truth">"包过"班通常 = <b>大量刷题 + 走捷径</b><br>过了八级 ≠ 真有能力 · CSP-S 直接破防</div>
    </div>

    <div class="myth">
      <div class="x">!</div>
      <div class="lie"><span class="quote">"报全年课 · 一站到底"</span></div>
      <div class="truth">先<b>试听 + 报短期</b> · 看效果再续<br>大连家长教训 · 一报全年容易后悔</div>
    </div>

    <div class="pull">
      <h2>大连家长真心话<br><b>"试听 + 短期 + 看娃反应 = 不踩坑"</b></h2>
    </div>
  </div>
</body>
</html>
