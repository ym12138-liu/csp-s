<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>报班还是自学 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg, #006064 0%, #4DB6AC 50%, #FFEB3B 100%); color:#FFF; position:relative; }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,235,59,0.6) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:14px 32px; border-radius:100px; font-size:32px; font-weight:900; letter-spacing:2px; margin-bottom: 50px; box-shadow: 6px 6px 0 #006064; }
  .pre { font-size: 42px; font-weight: 800; color: #FFEB3B; margin-bottom: 18px; }
  .vs { display: flex; align-items: center; gap: 30px; }
  .opt { background:#FFFFFF; color:#006064; padding: 22px 30px; border-radius: 18px; font-size: 56px; font-weight: 900; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #1A1A1A; flex: 1; text-align: center; }
  .opt.b { background: #FFEB3B; color: #B71C1C; }
  .vs-mark { font-size: 60px; font-weight:900; color:#FFFFFF; text-shadow: 4px 4px 0 #1A1A1A; }
  .question { font-size: 100px; font-weight: 900; color: #FFFFFF; line-height: 1; margin-top: 30px; text-shadow: 6px 6px 0 #006064; }
  .question em { font-style:normal; background:#FFEB3B; color:#006064; padding: 0 12px; box-shadow: 6px 6px 0 #1A1A1A; display: inline-block; }
  .sub { margin-top: 36px; background:#1A1A1A; color:#FFEB3B; padding: 18px 26px; border-radius: 14px; box-shadow: 6px 6px 0 #FFEB3B; font-size: 36px; font-weight: 800; line-height: 1.4; display: inline-block; border: 4px solid #FFEB3B; }
  .sub b { color: #FFFFFF; }
  .footer { position:absolute; bottom:0; left:70px; right:70px; display:flex; justify-content:space-between; align-items:center; font-size:28px; color:#FFEB3B; font-weight:900; }
  .stamp { background:#FFEB3B; color:#006064; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长不焦虑系列 · 启蒙第 6 篇</div>
    <div class="pre">"机构课好贵 · 自学行不行"</div>
    <div class="vs">
      <div class="opt">报班</div>
      <div class="vs-mark">VS</div>
      <div class="opt b">自学</div>
    </div>
    <div class="question">怎么 <em>选</em></div>
    <div class="sub">不一刀切<br><b>3 种娃 3 种选法</b></div>
  </div>
  <div class="footer">
    <span>#编程报班 #自学 #大连娃</span>
    <span class="stamp">收藏不亏</span>
  </div>
</body>
</html>
