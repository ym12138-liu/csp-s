<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 启蒙避坑</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .top-band { position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: #FFD93D; display: flex; align-items: center; padding: 0 60px;
    border-bottom: 4px solid #1A1A1A; }
  .h-tag { background: #1A1A1A; color: #FFD93D; padding: 12px 24px; border-radius: 8px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px; }
  .right { margin-left: auto; color: #1A1A1A; font-size: 24px; font-weight: 900; letter-spacing: 2px; }

  .title-area { position: absolute; top: 180px; left: 60px; right: 60px; }
  .title-area h1 { font-size: 60px; font-weight: 900; color: #FFFFFF; line-height: 1.1; }
  .title-area h1 em {
    font-style: normal; background: #FFD93D; color: #1A1A1A;
    padding: 0 12px; box-shadow: 6px 6px 0 #FFFFFF;
    display: inline-block;
  }

  .photo {
    position: absolute; top: 360px; left: 60px; right: 60px; height: 280px;
    border-radius: 14px; overflow: hidden;
    background: url("../../因诺信奥图片/DSC_2898.JPG") center/cover no-repeat;
    border: 4px solid #FFD93D;
  }

  .myths { position: absolute; top: 680px; left: 60px; right: 60px; }
  .myth {
    background: #FFFFFF; border-radius: 14px;
    padding: 16px 20px; margin-bottom: 12px;
    border-left: 12px solid #B71C1C;
    position: relative;
  }
  .myth .x {
    position: absolute; top: -14px; left: -14px;
    width: 50px; height: 50px; border-radius: 50%;
    background: #B71C1C; color: #FFD93D;
    font-size: 28px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 4px 4px 0 #1A1A1A;
  }
  .myth .lie {
    font-size: 22px; color: #B71C1C; font-weight: 900;
    padding-left: 44px;
    text-decoration: line-through;
  }
  .myth .truth {
    font-size: 18px; color: #1A1A1A; font-weight: 700;
    line-height: 1.4; margin-top: 6px;
  }
  .myth .truth b { background: #FFD93D; padding: 0 4px; border-radius: 3px; color: #B71C1C; }

  .pull {
    position: absolute; bottom: 100px; left: 60px; right: 60px;
    background: #FFD93D; color: #1A1A1A;
    padding: 22px 28px; border-radius: 16px;
    border: 4px solid #FFFFFF;
    box-shadow: 8px 8px 0 #FFFFFF;
    text-align: center;
  }
  .pull h2 { font-size: 30px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background: #1A1A1A; color: #FFD93D; padding: 0 8px; border-radius: 4px; }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background: #FFD93D; border-top: 4px solid #FFFFFF;
    display: flex; align-items: center; justify-content: center; }
  .footer-band .txt { color: #1A1A1A; font-size: 26px; font-weight: 900; letter-spacing: 3px; }
</style>
</head>
<body>
  <div class="top-band">
    <span class="h-tag">MYTH · 启蒙避坑</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="title-area">
    <h1>启蒙 4 个<em>误区</em><br>大连家长易踩</h1>
  </div>

  <div class="photo"></div>

  <div class="myths">
    <div class="myth">
      <div class="x">!</div>
      <div class="lie">"3 岁就要开始 · 越早越好"</div>
      <div class="truth">3 岁手指还不灵 · <b>7 岁起步刚好</b>，太早只会让娃排斥</div>
    </div>
    <div class="myth">
      <div class="x">!</div>
      <div class="lie">"Scratch 太简单 · 跳过直学 C++"</div>
      <div class="truth">Scratch 练的是 <b>逻辑思维</b>，不是语法 · 跳过它直接写代码 = 没地基</div>
    </div>
    <div class="myth">
      <div class="x">!</div>
      <div class="lie">"启蒙也要每天 2 小时"</div>
      <div class="truth">每周 <b>1-2 小时</b> 就够 · 多了娃疲劳 · 启蒙是兴趣不是冲刺</div>
    </div>
    <div class="myth">
      <div class="x">!</div>
      <div class="lie">"必须报全年班才系统"</div>
      <div class="truth">先报 <b>1 学期</b> 看效果 · 不喜欢及时换 · 别绑死</div>
    </div>
  </div>

  <div class="pull">
    <h2>启蒙阶段·<br><b>"娃喜欢 + 家长不焦虑"</b> 才是对路</h2>
  </div>

  <div class="footer-band">
    <span class="txt">不超前·不堆课·稳稳启蒙</span>
  </div>
</body>
</html>
