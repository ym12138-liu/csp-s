<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 启蒙 Scratch</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .photo {
    position: absolute; top: 0; left: 0; right: 0; height: 760px;
    background: url("../../因诺信奥图片/DSC_2898.JPG") center/cover no-repeat;
  }
  .photo::after {
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.45) 50%, rgba(26,26,26,0.95) 95%, #1A1A1A 100%);
  }

  .badge {
    position: absolute; top: 60px; left: 60px; z-index: 5;
    background: #FFD93D; color: #1A1A1A;
    padding: 14px 28px; border-radius: 100px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    box-shadow: 6px 6px 0 #000;
  }
  .right-tag {
    position: absolute; top: 60px; right: 60px; z-index: 5;
    background: rgba(255,217,61,0.95); color: #1A1A1A;
    padding: 14px 24px; border-radius: 100px;
    font-size: 24px; font-weight: 900;
    border: 3px solid #1A1A1A;
  }

  .title-block {
    position: absolute; top: 290px; left: 60px; right: 60px; z-index: 5;
  }
  .pre { color: #FFD93D; font-size: 32px; font-weight: 800;
    letter-spacing: 3px; margin-bottom: 14px; text-shadow: 3px 3px 0 #000; }
  .row1 {
    display: flex; align-items: center; gap: 16px; margin-bottom: 16px;
  }
  .age-pill {
    background: #FFD93D; color: #1A1A1A;
    font-size: 60px; font-weight: 900;
    padding: 4px 22px;
    box-shadow: 8px 8px 0 #000;
  }
  .arrow { color: #FFD93D; font-size: 50px; font-weight: 900; text-shadow: 3px 3px 0 #000; }
  .lang-pill {
    background: #1A1A1A; color: #FFD93D;
    font-size: 50px; font-weight: 900;
    padding: 8px 22px;
    border: 4px solid #FFD93D;
  }
  .t-bottom {
    color: #FFFFFF; font-size: 60px; font-weight: 900;
    line-height: 1.1; letter-spacing: 1px;
    text-shadow: 4px 4px 0 #000;
  }
  .t-bottom em {
    font-style: normal; background: #FFD93D; color: #1A1A1A;
    padding: 0 12px; box-shadow: 6px 6px 0 #FFFFFF;
    -webkit-text-fill-color: #1A1A1A;
  }

  .stats { position: absolute; top: 820px; left: 60px; right: 60px; z-index: 5;
    display: flex; gap: 14px; }
  .s {
    flex: 1; background: rgba(255,255,255,0.95);
    padding: 16px 12px; border-radius: 14px;
    text-align: center;
    border: 4px solid #1A1A1A;
    box-shadow: 5px 5px 0 #FFD93D;
  }
  .s .v { font-size: 32px; font-weight: 900; color: #B71C1C; line-height: 1; }
  .s .l { font-size: 16px; font-weight: 800; color: #1A1A1A; margin-top: 6px; }

  .pull {
    position: absolute; top: 1050px; left: 60px; right: 60px; z-index: 5;
    background: #FFD93D; color: #1A1A1A;
    padding: 22px 28px; border-radius: 16px;
    border: 4px solid #FFFFFF;
    box-shadow: 8px 8px 0 #FFFFFF;
  }
  .pull h2 { font-size: 32px; font-weight: 900; line-height: 1.3; text-align: center; }
  .pull h2 b { background: #1A1A1A; color: #FFD93D; padding: 0 8px; border-radius: 4px; }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
    background: #1A1A1A; z-index: 6;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    border-top: 4px solid #FFD93D; }
  .brand { color: #FFFFFF; font-size: 30px; font-weight: 900; letter-spacing: 4px; }
  .brand b { color: #FFD93D; }
  .hash { color: #FFD93D; font-size: 18px; font-weight: 800; letter-spacing: 3px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="photo"></div>

  <div class="badge">大连 · 因诺信奥</div>
  <div class="right-tag">7-12 岁启蒙</div>

  <div class="title-block">
    <div class="pre">// 编程启蒙 · 不打字也能学</div>
    <div class="row1">
      <span class="age-pill">Scratch</span>
      <span class="arrow">→</span>
      <span class="lang-pill">Python</span>
    </div>
    <div class="t-bottom">从拖积木<em>到真代码</em></div>
  </div>

  <div class="stats">
    <div class="s"><div class="v">10 分钟</div><div class="l">出第一个动画</div></div>
    <div class="s"><div class="v">6 个项目</div><div class="l">期末作品集</div></div>
    <div class="s"><div class="v">3 个学期</div><div class="l">过渡到 Python</div></div>
    <div class="s"><div class="v">12 人</div><div class="l">小班上限</div></div>
  </div>

  <div class="pull">
    <h2>不报全年班<br><b>玩起来 · 再决定</b>要不要冲信奥</h2>
  </div>

  <div class="footer-band">
    <div class="brand">因诺<b>信奥</b> · 大连</div>
    <div class="hash"># 少儿编程 # Scratch # Python # 启蒙</div>
  </div>
</body>
</html>
