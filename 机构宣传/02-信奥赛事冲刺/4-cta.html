<!DOCTYPE html>

  .countdown {

  .who {

    flex: 1; background: #FFFFFF;

  .w p b { background: #FFD93D; padding: 0 4px; border-radius: 3px; color: #B71C1C; }

  .pull {

    padding: 22px 28px; border-radius: 16px;
    border: 4px solid #FFFFFF;
