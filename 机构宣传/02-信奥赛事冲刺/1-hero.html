<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · CSP 冲刺</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .photo {
    position: absolute; top: 0; left: 0; right: 0; height: 900px;
    background: url("../../因诺信奥图片/DSC_6665.JPG") center/cover no-repeat;
  }
  .photo::after {
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.25) 40%, rgba(0,0,0,0.85) 90%, #1A1A1A 100%);
  }

  .badge {
    position: absolute; top: 60px; left: 60px;
    background: #FFD93D; color: #1A1A1A;
    padding: 14px 28px; border-radius: 100px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    box-shadow: 6px 6px 0 #000;
    z-index: 5;
  }
  .right-tag {
    position: absolute; top: 60px; right: 60px; z-index: 5;
    background: rgba(255,217,61,0.95); color: #1A1A1A;
    padding: 14px 24px; border-radius: 100px;
    font-size: 24px; font-weight: 900; letter-spacing: 2px;
    border: 3px solid #1A1A1A;
  }

  .title-block {
    position: absolute; top: 320px; left: 60px; right: 60px; z-index: 5;
  }
  .pre {
    color: #FFD93D; font-size: 36px; font-weight: 800;
    letter-spacing: 3px; margin-bottom: 14px;
    text-shadow: 3px 3px 0 #000;
  }
  .row1 {
    display: flex; align-items: center; gap: 18px; margin-bottom: 14px;
  }
  .row1 .csp {
    background: #FFD93D; color: #1A1A1A;
    font-size: 84px; font-weight: 900;
    padding: 4px 22px; line-height: 1.1;
    box-shadow: 8px 8px 0 #000;
    letter-spacing: 1px;
  }
  .row1 .arrow {
    color: #FFD93D; font-size: 60px; font-weight: 900;
    text-shadow: 3px 3px 0 #000;
  }
  .row1 .noip {
    background: #1A1A1A; color: #FFD93D;
    font-size: 60px; font-weight: 900;
    padding: 8px 22px; line-height: 1.1;
    border: 4px solid #FFD93D;
  }
  .t-bottom {
    color: #FFFFFF; font-size: 64px; font-weight: 900;
    line-height: 1.1; letter-spacing: 1px;
    text-shadow: 4px 4px 0 #000;
  }
  .t-bottom em {
    font-style: normal; background: #FFD93D; color: #1A1A1A;
    padding: 0 12px; box-shadow: 6px 6px 0 #FFFFFF;
    -webkit-text-fill-color: #1A1A1A;
  }

  .stats-strip {
    position: absolute; top: 860px; left: 60px; right: 60px; z-index: 5;
    display: flex; gap: 14px;
  }
  .s {
    flex: 1; background: rgba(255,255,255,0.95);
    padding: 18px 12px; border-radius: 14px;
    text-align: center;
    border: 4px solid #1A1A1A;
    box-shadow: 5px 5px 0 #FFD93D;
  }
  .s .v { font-size: 38px; font-weight: 900; color: #B71C1C; line-height: 1; }
  .s .l { font-size: 18px; font-weight: 800; color: #1A1A1A; margin-top: 6px; }

  .pull {
    position: absolute; top: 1080px; left: 60px; right: 60px; z-index: 5;
    background: #FFD93D; color: #1A1A1A;
    padding: 22px 28px; border-radius: 16px;
    border: 4px solid #FFFFFF;
    box-shadow: 8px 8px 0 #FFFFFF;
  }
  .pull h2 {
    font-size: 36px; font-weight: 900; line-height: 1.3;
    text-align: center;
  }
  .pull h2 b { background: #1A1A1A; color: #FFD93D; padding: 0 8px; border-radius: 4px; }

  .footer-band {
    position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
    background: #1A1A1A; z-index: 6;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    border-top: 4px solid #FFD93D;
  }
  .brand { color: #FFFFFF; font-size: 30px; font-weight: 900; letter-spacing: 4px; }
  .brand b { color: #FFD93D; }
  .hash { color: #FFD93D; font-size: 18px; font-weight: 800; letter-spacing: 3px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="photo"></div>

  <div class="badge">大连 · 因诺信奥</div>
  <div class="right-tag">CSP-J / S 直通车</div>

  <div class="title-block">
    <div class="pre">// 信奥赛事 · 一站到底</div>
    <div class="row1">
      <span class="csp">CSP-J</span>
      <span class="arrow">→</span>
      <span class="noip">CSP-S</span>
    </div>
    <div class="t-bottom">从过线<em>到省一</em></div>
  </div>

  <div class="stats-strip">
    <div class="s"><div class="v">7 年</div><div class="l">真题打标</div></div>
    <div class="s"><div class="v">21 块</div><div class="l">CSP-J 模块</div></div>
    <div class="s"><div class="v">5 块</div><div class="l">CSP-S 进阶</div></div>
    <div class="s"><div class="v">12 人</div><div class="l">小班上限</div></div>
  </div>

  <div class="pull">
    <h2>不刷题海·不报全年<br>按<b>真题模块</b>逐个补</h2>
  </div>

  <div class="footer-band">
    <div class="brand">因诺<b>信奥</b> · 大连</div>
    <div class="hash"># CSP-J # CSP-S # 信奥备考 # 大连</div>
  </div>
</body>
</html>
