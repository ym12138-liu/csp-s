<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>GESP · 8 级阶梯</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; overflow: hidden;
font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
background: #FFFFFF; color: #1A1A1A; }
.top { position: absolute; top: 0; left: 0; right: 0; height: 150px;
background: #0D47A1; display: flex; align-items: center; padding: 0 60px; }
.top .badge { background: #FFFFFF; color: #0D47A1; padding: 12px 24px;
border-radius: 8px; font-size: 28px; font-weight: 900; }
.top .right { margin-left: auto; color: #FFFFFF; font-size: 22px; font-weight: 800; }
.h1 { position: absolute; top: 200px; left: 60px; right: 60px; }
.h1 .pre { color: #2196F3; font-size: 26px; font-weight: 800; letter-spacing: 3px; margin-bottom: 10px; }
.h1 h1 { font-size: 60px; font-weight: 900; color: #0D47A1; line-height: 1.1; }
.h1 h1 b { background: #2196F3; color: #FFFFFF; padding: 0 12px; border-radius: 6px; }
.pull { position: absolute; bottom: 200px; left: 60px; right: 60px;
background: #0D47A1; color: #FFFFFF; padding: 22px 28px; border-radius: 16px; }
.pull h2 { font-size: 26px; font-weight: 900; line-height: 1.4; }
.pull h2 b { background: #2196F3; padding: 0 8px; border-radius: 4px; }
.footer { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
background: #0D47A1; display: flex; align-items: center; justify-content: center; }
.footer .txt { color: #FFFFFF; font-size: 22px; font-weight: 900; letter-spacing: 4px; }

.stages { position: absolute; top: 400px; left: 60px; right: 60px; }
.stage { display: flex; padding: 14px 22px; margin-bottom: 12px; border-radius: 12px; }
.stage .lvl { flex: 0 0 100px; font-size: 26px; font-weight: 900; color: #0D47A1; padding-top: 4px; }
.stage .body h3 { font-size: 22px; font-weight: 900; color: #0D47A1; line-height: 1.2; }
.stage .body p { font-size: 16px; color: #424242; margin-top: 4px; font-weight: 700; line-height: 1.4; }
.stage .body p b { background: #FFF59D; padding: 0 4px; color: #B71C1C; border-radius: 3px; }
</style></head><body><div class="top"><span class="badge">GESP · 8 级阶梯</span><span class="right">因诺信奥 · 大连</span></div>
<div class="h1"><div class="pre">// 一级一级 · 按等级走</div><h1>8 级<br><b>阶梯</b></h1></div>
<div class="stages"><div class="stage" style="background:#FCE4EC"><div class="lvl">1 级</div><div class="body"><h3>入门</h3><p>表达式 + 流程控制 · 4 周通关</p></div></div><div class="stage" style="background:#FFF8E1"><div class="lvl">2 级</div><div class="body"><h3>数组</h3><p>一维数组 + 嵌套循环 · 6 周</p></div></div><div class="stage" style="background:#E8F5E9"><div class="lvl">3 级</div><div class="body"><h3>进制</h3><p>位运算 + 进制 · 8 周</p></div></div><div class="stage" style="background:#E3F2FD"><div class="lvl">4-5 级</div><div class="body"><h3>排序+链表</h3><p>指针 / 排序 / 链表 / 数论 · 12-16 周</p></div></div><div class="stage" style="background:#F3E5F5"><div class="lvl">6-7 级</div><div class="body"><h3>树+图</h3><p>二叉树 + DP + 图论 · 16-20 周</p></div></div><div class="stage" style="background:#FFCCBC"><div class="lvl">8 级</div><div class="body"><h3>顶级</h3><p>四大图算法 + 高级 DP · 24 周</p></div></div></div>
<div class="pull"><h2>不跳级 · <b>娃自己看得到进步</b></h2></div>
<div class="footer"><span class="txt">稳过 1 级 → 再下一级</span></div>
</body></html>
