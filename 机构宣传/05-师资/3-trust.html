<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 老师阵容</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .top-band { position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: #FFD93D; display: flex; align-items: center; padding: 0 60px;
    border-bottom: 4px solid #1A1A1A; }
  .h-tag { background: #1A1A1A; color: #FFD93D; padding: 12px 24px; border-radius: 8px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px; }
  .right { margin-left: auto; color: #1A1A1A; font-size: 24px; font-weight: 900; letter-spacing: 2px; }

  .title-area { position: absolute; top: 180px; left: 60px; right: 60px; }
  .title-area h1 { font-size: 60px; font-weight: 900; color: #FFFFFF; line-height: 1.1; }
  .title-area h1 em {
    font-style: normal; background: #FFD93D; color: #1A1A1A;
    padding: 0 12px; box-shadow: 6px 6px 0 #FFFFFF;
    display: inline-block;
  }

  .teachers { position: absolute; top: 360px; left: 60px; right: 60px; }
  .t-card {
    display: flex; align-items: stretch;
    background: #FFFFFF;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 14px;
    border: 4px solid #FFD93D;
    box-shadow: 5px 5px 0 #FFD93D;
  }
  .t-card .avatar {
    flex: 0 0 200px;
    background: #1A1A1A;
    position: relative;
  }
  .t-card .avatar.a1 { background: url("../../因诺信奥图片/DSC_6068.JPG") center/cover no-repeat; }
  .t-card .avatar.a2 { background: url("../../因诺信奥图片/DSC_2843.JPG") center/cover no-repeat; }
  .t-card .avatar.a3 { background: url("../../因诺信奥图片/DSC_2898.JPG") center/cover no-repeat; }
  .t-card .body {
    flex: 1; padding: 14px 20px;
  }
  .t-card .body .role {
    background: #FFD93D; color: #1A1A1A;
    padding: 4px 12px; border-radius: 6px;
    font-size: 16px; font-weight: 900;
    display: inline-block; margin-bottom: 6px;
  }
  .t-card .body h3 { font-size: 24px; font-weight: 900; color: #1A1A1A; line-height: 1.2; }
  .t-card .body .meta {
    font-size: 16px; font-weight: 700; color: #424242;
    margin-top: 4px; line-height: 1.3;
  }
  .t-card .body .meta b { background: #FFD93D; color: #B71C1C; padding: 0 4px; border-radius: 3px; }
  .t-card .body .skills {
    margin-top: 8px;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .t-card .body .skill {
    background: #FFFBE5; color: #1A1A1A;
    padding: 3px 10px; border-radius: 6px;
    font-size: 14px; font-weight: 800;
    border: 2px solid #FFD93D;
  }

  .pull {
    position: absolute; bottom: 100px; left: 60px; right: 60px;
    background: #FFD93D; color: #1A1A1A;
    padding: 22px 28px; border-radius: 16px;
    border: 4px solid #FFFFFF;
    box-shadow: 8px 8px 0 #FFFFFF;
    text-align: center;
  }
  .pull h2 { font-size: 28px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background: #1A1A1A; color: #FFD93D; padding: 0 8px; border-radius: 4px; }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background: #FFD93D; border-top: 4px solid #FFFFFF;
    display: flex; align-items: center; justify-content: center; }
  .footer-band .txt { color: #1A1A1A; font-size: 26px; font-weight: 900; letter-spacing: 3px; }
</style>
</head>
<body>
  <div class="top-band">
    <span class="h-tag">TEACHERS · 教师阵容</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="title-area">
    <h1>3 类<em>老师</em><br>分工明确</h1>
  </div>

  <div class="teachers">
    <div class="t-card">
      <div class="avatar a1"></div>
      <div class="body">
        <span class="role">主讲 · 信奥</span>
        <h3>赛事主讲 · 带 CSP-J / S 备考</h3>
        <div class="meta">教学经验 <b>5 年+</b> · 带过完整赛季</div>
        <div class="skills">
          <span class="skill">C++</span>
          <span class="skill">DP</span>
          <span class="skill">图论</span>
          <span class="skill">真题打标</span>
        </div>
      </div>
    </div>
    <div class="t-card">
      <div class="avatar a2"></div>
      <div class="body">
        <span class="role">主讲 · 启蒙</span>
        <h3>启蒙主讲 · Scratch / Python</h3>
        <div class="meta">擅长 <b>把抽象讲具体</b> · 课堂互动好</div>
        <div class="skills">
          <span class="skill">Scratch</span>
          <span class="skill">Python</span>
          <span class="skill">逻辑思维</span>
        </div>
      </div>
    </div>
    <div class="t-card">
      <div class="avatar a3"></div>
      <div class="body">
        <span class="role">助教 · 答疑</span>
        <h3>课后答疑 · 改代码 / 找 bug</h3>
        <div class="meta">每位学员配 <b>1 对 1 答疑</b> 通道</div>
        <div class="skills">
          <span class="skill">代码 review</span>
          <span class="skill">错题归类</span>
        </div>
      </div>
    </div>
  </div>

  <div class="pull">
    <h2>主讲 + 助教 + 班主任<br><b>一个娃·三个人盯</b></h2>
  </div>

  <div class="footer-band">
    <span class="txt">不当甩手老师·真负责</span>
  </div>
</body>
</html>
