<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 课堂证据</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .top-band { position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: #FFD93D; display: flex; align-items: center; padding: 0 60px;
    border-bottom: 4px solid #1A1A1A; }
  .h-tag { background: #1A1A1A; color: #FFD93D; padding: 12px 24px; border-radius: 8px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px; }
  .right { margin-left: auto; color: #1A1A1A; font-size: 24px; font-weight: 900; letter-spacing: 2px; }

  .title-area { position: absolute; top: 180px; left: 60px; right: 60px; }
  .title-area h1 { font-size: 60px; font-weight: 900; color: #FFFFFF; line-height: 1.1; }
  .title-area h1 em {
    font-style: normal; background: #FFD93D; color: #1A1A1A;
    padding: 0 12px; box-shadow: 6px 6px 0 #FFFFFF;
    display: inline-block;
  }

  .photo-grid {
    position: absolute; top: 360px; left: 60px; right: 60px;
    display: flex; flex-wrap: wrap; gap: 12px;
  }
  .photo-grid .ph {
    width: calc(50% - 6px); height: 220px;
    border-radius: 12px; overflow: hidden;
    border: 4px solid #FFD93D;
    background-size: cover; background-position: center;
    position: relative;
  }
  .photo-grid .ph .lab {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(255,217,61,0.95); color: #1A1A1A;
    padding: 4px 10px; border-radius: 6px;
    font-size: 16px; font-weight: 900;
    border: 2px solid #1A1A1A;
  }
  .ph1 { background-image: url("../../因诺信奥图片/DSC_2843.JPG"); }
  .ph2 { background-image: url("../../因诺信奥图片/DSC_6079.JPG"); background-position: center 30%; }
  .ph3 { background-image: url("../../因诺信奥图片/DSC_6665.JPG"); }
  .ph4 { background-image: url("../../因诺信奥图片/DSC_2898.JPG"); }

  .reasons { position: absolute; top: 870px; left: 60px; right: 60px; }
  .reasons .lbl {
    background: #FFD93D; color: #1A1A1A;
    padding: 8px 22px; border-radius: 8px;
    font-size: 22px; font-weight: 900; letter-spacing: 2px;
    display: inline-block; margin-bottom: 14px;
  }
  .row { display: flex; gap: 14px; margin-bottom: 12px; }
  .item {
    flex: 1; background: #FFFFFF;
    border-radius: 12px; padding: 14px 16px;
    border: 3px solid #FFD93D;
    box-shadow: 4px 4px 0 #FFD93D;
  }
  .item h3 { font-size: 22px; font-weight: 900; color: #1A1A1A; line-height: 1.2; }
  .item p { font-size: 16px; font-weight: 700; color: #424242; margin-top: 4px; line-height: 1.3; }
  .item p b { background: #FFD93D; color: #B71C1C; padding: 0 4px; border-radius: 3px; }

  .pull {
    position: absolute; bottom: 100px; left: 60px; right: 60px;
    background: #FFD93D; color: #1A1A1A;
    padding: 20px 26px; border-radius: 16px;
    border: 4px solid #FFFFFF;
    box-shadow: 8px 8px 0 #FFFFFF;
    text-align: center;
  }
  .pull h2 { font-size: 28px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background: #1A1A1A; color: #FFD93D; padding: 0 8px; border-radius: 4px; }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background: #FFD93D; border-top: 4px solid #FFFFFF;
    display: flex; align-items: center; justify-content: center; }
  .footer-band .txt { color: #1A1A1A; font-size: 26px; font-weight: 900; letter-spacing: 3px; }
</style>
</head>
<body>
  <div class="top-band">
    <span class="h-tag">REAL · 课堂实景</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="title-area">
    <h1>课堂<em>是什么样</em><br>4 张图 1 眼看清</h1>
  </div>

  <div class="photo-grid">
    <div class="ph ph1"><span class="lab">讲解 · 白板</span></div>
    <div class="ph ph2"><span class="lab">讲解 · 黑板</span></div>
    <div class="ph ph3"><span class="lab">练习 · 上机</span></div>
    <div class="ph ph4"><span class="lab">点评 · 老师改</span></div>
  </div>

  <div class="reasons">
    <span class="lbl">小细节·决定成色</span>
    <div class="row">
      <div class="item">
        <h3>白板手写推导</h3>
        <p>不放投影 · <b>看老师怎么想</b></p>
      </div>
      <div class="item">
        <h3>每人 1 台笔电</h3>
        <p>不共享设备 · <b>真敲代码</b></p>
      </div>
    </div>
    <div class="row">
      <div class="item">
        <h3>老师走动巡场</h3>
        <p>不站讲台 · <b>每位都盯到</b></p>
      </div>
      <div class="item">
        <h3>课堂代码留档</h3>
        <p>家长可查 · <b>透明可问</b></p>
      </div>
    </div>
  </div>

  <div class="pull">
    <h2>不晒口号·晒课堂<br><b>欢迎家长随时旁听</b></h2>
  </div>

  <div class="footer-band">
    <span class="txt">真实景 · 真课程 · 真透明</span>
  </div>
</body>
</html>
