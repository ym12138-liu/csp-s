<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 我们的回答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .top-band { position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: #FFD93D; display: flex; align-items: center; padding: 0 60px;
    border-bottom: 4px solid #1A1A1A; }
  .h-tag { background: #1A1A1A; color: #FFD93D; padding: 12px 24px; border-radius: 8px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px; }
  .right { margin-left: auto; color: #1A1A1A; font-size: 24px; font-weight: 900; letter-spacing: 2px; }

  .title-area { position: absolute; top: 180px; left: 60px; right: 60px; }
  .title-area h1 { font-size: 60px; font-weight: 900; color: #FFFFFF; line-height: 1.1; }
  .title-area h1 em {
    font-style: normal; background: #FFD93D; color: #1A1A1A;
    padding: 0 12px; box-shadow: 6px 6px 0 #FFFFFF;
    display: inline-block;
  }

  .matrix { position: absolute; top: 360px; left: 60px; right: 60px; }
  .row {
    display: flex; align-items: center;
    background: #FFFFFF; border-radius: 12px;
    padding: 14px 20px; margin-bottom: 12px;
    border: 3px solid #FFD93D;
    box-shadow: 4px 4px 0 #FFD93D;
  }
  .row .num {
    flex: 0 0 50px; height: 50px; border-radius: 50%;
    background: #FFD93D; color: #1A1A1A;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900;
    border: 3px solid #1A1A1A;
    margin-right: 16px;
  }
  .row .body { flex: 1; }
  .row .body h3 { font-size: 22px; font-weight: 900; color: #1A1A1A; line-height: 1.2; }
  .row .body p { font-size: 16px; font-weight: 700; color: #424242; margin-top: 4px; line-height: 1.3; }
  .row .body p b { background: #FFD93D; color: #B71C1C; padding: 0 4px; border-radius: 3px; }
  .row .ck {
    flex: 0 0 56px; height: 56px; border-radius: 12px;
    background: #2E7D32; color: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900;
    border: 3px solid #FFFFFF;
  }

  .pull {
    position: absolute; bottom: 100px; left: 60px; right: 60px;
    background: #FFD93D; color: #1A1A1A;
    padding: 22px 28px; border-radius: 16px;
    border: 4px solid #FFFFFF;
    box-shadow: 8px 8px 0 #FFFFFF;
    text-align: center;
  }
  .pull h2 { font-size: 28px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background: #1A1A1A; color: #FFD93D; padding: 0 8px; border-radius: 4px; }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background: #FFD93D; border-top: 4px solid #FFFFFF;
    display: flex; align-items: center; justify-content: center; }
  .footer-band .txt { color: #1A1A1A; font-size: 26px; font-weight: 900; letter-spacing: 3px; }
</style>
</head>
<body>
  <div class="top-band">
    <span class="h-tag">ANSWER · 因诺的回答</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="title-area">
    <h1>5 问<em>对照表</em><br>因诺自答</h1>
  </div>

  <div class="matrix">
    <div class="row">
      <div class="num">1</div>
      <div class="body"><h3>老师能现场写真题</h3><p>主讲均能<b>当场写完整 CSP-J 真题</b>·欢迎旁听</p></div>
      <div class="ck">✓</div>
    </div>
    <div class="row">
      <div class="num">2</div>
      <div class="body"><h3>课程基于 7 年真题</h3><p>2019-2025 真题<b>逐题打标</b>·按模块讲</p></div>
      <div class="ck">✓</div>
    </div>
    <div class="row">
      <div class="num">3</div>
      <div class="body"><h3>按 GESP / CSP 级别分班</h3><p>不按年龄·<b>看真水平</b>分</p></div>
      <div class="ck">✓</div>
    </div>
    <div class="row">
      <div class="num">4</div>
      <div class="body"><h3>每节课家长群同步</h3><p>当堂代码 + <b>课堂表现</b>·课后立即推送</p></div>
      <div class="ck">✓</div>
    </div>
    <div class="row">
      <div class="num">5</div>
      <div class="body"><h3>按未上课时退费</h3><p>合同写明·<b>不绑年课</b>·想停就停</p></div>
      <div class="ck">✓</div>
    </div>
  </div>

  <div class="pull">
    <h2>5 问全过 · 不是说说<br><b>合同条款都写清</b></h2>
  </div>

  <div class="footer-band">
    <span class="txt">敢被问·敢被对照</span>
  </div>
</body>
</html>
