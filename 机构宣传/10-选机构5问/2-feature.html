<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 5 问详解</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #FFFBE5; position: relative; }

  .top-band { position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: #1A1A1A; display: flex; align-items: center; padding: 0 60px; }
  .h-tag { background: #FFD93D; color: #1A1A1A; padding: 12px 24px; border-radius: 8px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px; }
  .right { margin-left: auto; color: #FFD93D; font-size: 24px; font-weight: 800; letter-spacing: 2px; }

  .title-area { position: absolute; top: 180px; left: 60px; right: 60px; }
  .title-area h1 { font-size: 60px; font-weight: 900; color: #1A1A1A; line-height: 1.1; }
  .title-area h1 em {
    font-style: normal; background: #FFD93D; padding: 0 12px;
    box-shadow: 6px 6px 0 #1A1A1A; display: inline-block;
  }

  .qs { position: absolute; top: 360px; left: 60px; right: 60px; }
  .qa {
    background: #FFFFFF; border-radius: 14px;
    padding: 14px 20px; margin-bottom: 12px;
    border: 3px solid #1A1A1A;
    box-shadow: 4px 4px 0 #FFD93D;
  }
  .qa .q-line {
    display: flex; align-items: center; margin-bottom: 6px;
  }
  .qa .num {
    background: #1A1A1A; color: #FFD93D;
    width: 40px; height: 40px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900;
    margin-right: 12px;
  }
  .qa .q-line h3 { font-size: 22px; font-weight: 900; color: #1A1A1A; }
  .qa .ans-bad {
    font-size: 16px; color: #B71C1C; font-weight: 700;
    background: #FFEBEE; padding: 6px 12px; border-radius: 6px;
    border-left: 4px solid #B71C1C;
    margin-left: 52px;
    margin-bottom: 4px;
  }
  .qa .ans-bad b { font-weight: 900; }
  .qa .ans-good {
    font-size: 16px; color: #2E7D32; font-weight: 700;
    background: #E8F5E9; padding: 6px 12px; border-radius: 6px;
    border-left: 4px solid #2E7D32;
    margin-left: 52px;
  }
  .qa .ans-good b { font-weight: 900; background: #FFD93D; padding: 0 4px; border-radius: 3px; color: #B71C1C; }

  .pull {
    position: absolute; bottom: 100px; left: 60px; right: 60px;
    background: #1A1A1A; color: #FFFFFF;
    padding: 20px 26px; border-radius: 16px;
    border: 4px solid #FFD93D;
    box-shadow: 8px 8px 0 #FFD93D;
    text-align: center;
  }
  .pull h2 { font-size: 26px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background: #FFD93D; color: #1A1A1A; padding: 0 8px; border-radius: 4px; }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background: #FFD93D; border-top: 4px solid #1A1A1A;
    display: flex; align-items: center; justify-content: center; }
  .footer-band .txt { color: #1A1A1A; font-size: 26px; font-weight: 900; letter-spacing: 3px; }
</style>
</head>
<body>
  <div class="top-band">
    <span class="h-tag">DETAIL · 5 问详解</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="title-area">
    <h1>5 个问题<em>对照</em><br>报班不踩坑</h1>
  </div>

  <div class="qs">
    <div class="qa">
      <div class="q-line"><div class="num">1</div><h3>老师能现场写真题吗?</h3></div>
      <div class="ans-bad">坑·"我们老师来自 985"</div>
      <div class="ans-good"><b>对·让老师当场写一道</b></div>
    </div>
    <div class="qa">
      <div class="q-line"><div class="num">2</div><h3>课程跟历年真题对得上吗?</h3></div>
      <div class="ans-bad">坑·"独家自研课程"</div>
      <div class="ans-good"><b>对·要看真题打标本</b></div>
    </div>
    <div class="qa">
      <div class="q-line"><div class="num">3</div><h3>班型怎么分?分级标准?</h3></div>
      <div class="ans-bad">坑·"按年龄分"</div>
      <div class="ans-good"><b>对·按 GESP / CSP 级别分</b></div>
    </div>
    <div class="qa">
      <div class="q-line"><div class="num">4</div><h3>每周反馈给家长吗?</h3></div>
      <div class="ans-bad">坑·"每月统一发"</div>
      <div class="ans-good"><b>对·每节课家长群同步</b></div>
    </div>
    <div class="qa">
      <div class="q-line"><div class="num">5</div><h3>不喜欢能退多少?</h3></div>
      <div class="ans-bad">坑·"特价不退"</div>
      <div class="ans-good"><b>对·按未上课时退</b></div>
    </div>
  </div>

  <div class="pull">
    <h2>5 问对照·<br><b>合规机构都该满分</b></h2>
  </div>

  <div class="footer-band">
    <span class="txt">大连家长别冲动·先问清</span>
  </div>
</body>
</html>
