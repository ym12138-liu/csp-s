<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 选机构 5 问</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .photo {
    position: absolute; top: 0; left: 0; right: 0; height: 720px;
    background: url("../../因诺信奥图片/DSC_2885.JPG") center/cover no-repeat;
  }
  .photo::after {
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.55) 60%, rgba(26,26,26,0.95) 95%, #1A1A1A 100%);
  }

  .badge { position: absolute; top: 60px; left: 60px; z-index: 5;
    background: #FFD93D; color: #1A1A1A;
    padding: 14px 28px; border-radius: 100px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    box-shadow: 6px 6px 0 #000; }
  .right-tag { position: absolute; top: 60px; right: 60px; z-index: 5;
    background: rgba(255,217,61,0.95); color: #1A1A1A;
    padding: 14px 24px; border-radius: 100px;
    font-size: 24px; font-weight: 900;
    border: 3px solid #1A1A1A; }

  .title-block { position: absolute; top: 270px; left: 60px; right: 60px; z-index: 5; }
  .pre { color: #FFD93D; font-size: 32px; font-weight: 800;
    letter-spacing: 3px; margin-bottom: 14px; text-shadow: 3px 3px 0 #000; }
  .big-num {
    background: #FFD93D; color: #1A1A1A;
    font-size: 160px; font-weight: 900;
    padding: 0 26px; line-height: 1;
    box-shadow: 10px 10px 0 #000;
    display: inline-block;
    letter-spacing: -4px;
  }
  .big-text {
    color: #FFFFFF; font-size: 80px; font-weight: 900;
    line-height: 1.05; margin-top: 22px;
    text-shadow: 4px 4px 0 #000;
  }
  .big-text em {
    font-style: normal; background: #1A1A1A; color: #FFD93D;
    padding: 0 12px; box-shadow: 6px 6px 0 #FFD93D;
    -webkit-text-fill-color: #FFD93D;
  }

  .qs-row { position: absolute; top: 770px; left: 60px; right: 60px; z-index: 5;
    display: flex; gap: 10px; }
  .q {
    flex: 1; background: rgba(255,255,255,0.95);
    padding: 16px 8px; border-radius: 12px;
    text-align: center;
    border: 3px solid #1A1A1A;
    box-shadow: 4px 4px 0 #FFD93D;
  }
  .q .n { font-size: 36px; font-weight: 900; color: #B71C1C; line-height: 1; }
  .q .l { font-size: 14px; font-weight: 800; color: #1A1A1A; margin-top: 6px; line-height: 1.2; }

  .pull {
    position: absolute; top: 1010px; left: 60px; right: 60px; z-index: 5;
    background: #FFD93D; color: #1A1A1A;
    padding: 22px 28px; border-radius: 16px;
    border: 4px solid #FFFFFF;
    box-shadow: 8px 8px 0 #FFFFFF;
  }
  .pull h2 { font-size: 30px; font-weight: 900; line-height: 1.4; text-align: center; }
  .pull h2 b { background: #1A1A1A; color: #FFD93D; padding: 0 8px; border-radius: 4px; }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
    background: #1A1A1A; z-index: 6;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    border-top: 4px solid #FFD93D; }
  .brand { color: #FFFFFF; font-size: 30px; font-weight: 900; letter-spacing: 4px; }
  .brand b { color: #FFD93D; }
  .hash { color: #FFD93D; font-size: 18px; font-weight: 800; letter-spacing: 3px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="photo"></div>

  <div class="badge">大连 · 因诺信奥</div>
  <div class="right-tag">家长必看</div>

  <div class="title-block">
    <div class="pre">// 选错机构 = 浪费 1 年</div>
    <span class="big-num">5</span>
    <div class="big-text">个问题<em>问清楚</em></div>
  </div>

  <div class="qs-row">
    <div class="q"><div class="n">①</div><div class="l">老师<br>专不专</div></div>
    <div class="q"><div class="n">②</div><div class="l">课程<br>是不是真题</div></div>
    <div class="q"><div class="n">③</div><div class="l">班型<br>分级清不清</div></div>
    <div class="q"><div class="n">④</div><div class="l">反馈<br>能不能查</div></div>
    <div class="q"><div class="n">⑤</div><div class="l">退费<br>合不合理</div></div>
  </div>

  <div class="pull">
    <h2>报班前<br><b>5 个问题问到底</b>·避坑必看</h2>
  </div>

  <div class="footer-band">
    <div class="brand">因诺<b>信奥</b> · 大连</div>
    <div class="hash"># 选机构 # 避坑 # 大连家长</div>
  </div>
</body>
</html>
