<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 0 元试听</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #FFD93D; position: relative; }
  body::before {
    content:""; position:absolute; top:0; left:0; right:0; height: 720px;
    background: url("../../因诺信奥图片/DSC_2812.JPG") center/cover no-repeat;
  }
  body::after {
    content:""; position:absolute; top:0; left:0; right:0; height: 720px;
    background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.55) 60%, rgba(255,217,61,0.95) 100%);
  }

  .top-band {
    position: absolute; top: 60px; left: 60px; right: 60px;
    display: flex; align-items: center; z-index: 5;
  }
  .h-tag {
    background: #FFD93D; color: #1A1A1A;
    padding: 12px 24px; border-radius: 8px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    box-shadow: 4px 4px 0 #1A1A1A;
  }
  .right {
    margin-left: auto; color: #FFFFFF;
    font-size: 24px; font-weight: 800;
    background: rgba(0,0,0,0.6); padding: 10px 18px; border-radius: 8px;
  }

  .hero-title {
    position: absolute; top: 220px; left: 60px; right: 60px; z-index: 5;
  }
  .hero-title .pre {
    font-size: 30px; color: #FFD93D; font-weight: 800;
    letter-spacing: 4px; margin-bottom: 12px;
    text-shadow: 3px 3px 0 #000;
  }
  .hero-title .big {
    font-size: 140px; font-weight: 900; color: #FFFFFF;
    line-height: 1; letter-spacing: -2px;
    text-shadow: 6px 6px 0 #000;
  }
  .hero-title .big em {
    font-style: normal; color: #FFD93D;
    background: #1A1A1A; padding: 0 16px;
    display: inline-block; box-shadow: 8px 8px 0 #FFFFFF;
    -webkit-text-fill-color: #FFD93D;
  }
  .hero-title .sub {
    font-size: 36px; font-weight: 800; color: #FFFFFF;
    margin-top: 30px;
    text-shadow: 3px 3px 0 #000;
  }

  .steps {
    position: absolute; top: 760px; left: 60px; right: 60px; z-index: 5;
  }
  .steps .lbl {
    background: #1A1A1A; color: #FFD93D;
    padding: 8px 22px; border-radius: 8px;
    font-size: 26px; font-weight: 900; letter-spacing: 2px;
    display: inline-block; margin-bottom: 18px;
  }
  .step-row {
    display: flex; gap: 14px;
  }
  .step {
    flex: 1; background: #FFFFFF;
    border: 4px solid #1A1A1A; border-radius: 14px;
    padding: 18px 14px; text-align: center;
    box-shadow: 6px 6px 0 #1A1A1A;
    position: relative;
  }
  .step .n {
    position: absolute; top: -16px; left: -10px;
    width: 50px; height: 50px; border-radius: 50%;
    background: #1A1A1A; color: #FFD93D;
    font-size: 26px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    border: 3px solid #FFD93D;
  }
  .step h3 {
    font-size: 26px; font-weight: 900; color: #1A1A1A;
    line-height: 1.1; margin-top: 8px;
  }
  .step p {
    font-size: 18px; font-weight: 700; color: #424242;
    margin-top: 6px; line-height: 1.3;
  }

  .arrow-row {
    position: absolute; top: 1020px; left: 0; right: 0; z-index: 5;
    text-align: center;
  }
  .arrow-row .down {
    color: #1A1A1A; font-size: 50px; font-weight: 900;
  }

  .pull {
    position: absolute; top: 1090px; left: 60px; right: 60px; z-index: 5;
    background: #1A1A1A; color: #FFFFFF;
    padding: 24px 28px; border-radius: 18px;
    text-align: center;
    box-shadow: 8px 8px 0 #FFFFFF;
    border: 4px solid #FFFFFF;
  }
  .pull h2 {
    font-size: 38px; font-weight: 900;
    line-height: 1.3;
  }
  .pull h2 b { color: #FFD93D; }
  .pull p {
    font-size: 22px; font-weight: 700;
    margin-top: 8px; color: #FFD93D;
    letter-spacing: 1px;
  }

  .footer-band {
    position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
    background: #1A1A1A;
    display: flex; align-items: center; justify-content: center;
    z-index: 6;
  }
  .footer-band .txt {
    color: #FFD93D; font-size: 30px; font-weight: 900;
    letter-spacing: 4px;
  }
</style>
</head>
<body>
  <div class="top-band">
    <span class="h-tag">CTA · 这周开始</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="hero-title">
    <div class="pre">// 不报全年 · 先来体验</div>
    <div class="big"><em>0 元</em></div>
    <div class="sub">先听一节 · 不合适不续</div>
  </div>

  <div class="steps">
    <span class="lbl">3 步搞定</span>
    <div class="step-row">
      <div class="step">
        <div class="n">1</div>
        <h3>主页私信</h3>
        <p>留下娃年龄 + 基础</p>
      </div>
      <div class="step">
        <div class="n">2</div>
        <h3>预约时间</h3>
        <p>到校区试听 1 节</p>
      </div>
      <div class="step">
        <div class="n">3</div>
        <h3>3 天观察</h3>
        <p>看娃反应 + 决定</p>
      </div>
    </div>
  </div>

  <div class="pull">
    <h2>不冲动报班<br>娃喜欢 → 再聊<b>课程</b></h2>
    <p>因诺信奥 · 真实景 · 真课程</p>
  </div>

  <div class="footer-band">
    <span class="txt"># 大连信奥 # 0 元试听 # 因诺信奥</span>
  </div>
</body>
</html>
