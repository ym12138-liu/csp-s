<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 看得见的实力</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .top-band {
    position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: #FFD93D;
    display: flex; align-items: center; padding: 0 60px;
    border-bottom: 4px solid #1A1A1A;
  }
  .top-band .h-tag {
    background: #1A1A1A; color: #FFD93D;
    padding: 12px 24px; border-radius: 8px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
  }
  .top-band .right {
    margin-left: auto; color: #1A1A1A;
    font-size: 24px; font-weight: 900; letter-spacing: 2px;
  }

  .title-area {
    position: absolute; top: 180px; left: 60px; right: 60px;
  }
  .title-area h1 {
    font-size: 64px; font-weight: 900; color: #FFFFFF;
    line-height: 1.1; letter-spacing: 1px;
  }
  .title-area h1 em {
    font-style: normal; background: #FFD93D; color: #1A1A1A;
    padding: 0 12px; box-shadow: 6px 6px 0 #FFFFFF;
    display: inline-block;
  }

  .photo-l {
    position: absolute; top: 360px; left: 60px; width: 480px; height: 320px;
    border-radius: 14px; overflow: hidden;
    background: url("../../因诺信奥图片/DSC_6044.JPG") center/cover no-repeat;
    border: 4px solid #FFD93D;
    box-shadow: 6px 6px 0 #FFD93D;
  }
  .photo-r {
    position: absolute; top: 360px; right: 60px; width: 480px; height: 320px;
    border-radius: 14px; overflow: hidden;
    background: url("../../因诺信奥图片/DSC_2902.JPG") center/cover no-repeat;
    border: 4px solid #FFD93D;
    box-shadow: 6px 6px 0 #FFD93D;
  }

  .stats {
    position: absolute; top: 720px; left: 60px; right: 60px;
    display: flex; gap: 16px;
  }
  .stat {
    flex: 1; background: #FFFFFF; border-radius: 14px;
    padding: 22px 16px; text-align: center;
    border: 4px solid #FFD93D;
    box-shadow: 5px 5px 0 #FFD93D;
  }
  .stat .v { font-size: 56px; font-weight: 900; color: #1A1A1A; line-height: 1; }
  .stat .v sup { font-size: 28px; vertical-align: super; }
  .stat .l { font-size: 18px; font-weight: 800; color: #424242; margin-top: 8px; letter-spacing: 1px; }

  .quote {
    position: absolute; top: 920px; left: 60px; right: 60px;
    background: #FFD93D; color: #1A1A1A;
    padding: 24px 28px; border-radius: 16px;
    border: 4px solid #FFFFFF;
    box-shadow: 8px 8px 0 #FFFFFF;
  }
  .quote .lbl {
    background: #1A1A1A; color: #FFD93D;
    padding: 4px 14px; border-radius: 6px;
    font-size: 20px; font-weight: 900; letter-spacing: 1px;
    display: inline-block;
  }
  .quote h2 {
    font-size: 30px; font-weight: 900; line-height: 1.4;
    margin-top: 10px;
  }
  .quote h2 b {
    background: #1A1A1A; color: #FFD93D;
    padding: 0 8px; border-radius: 4px;
  }

  .sign-row {
    position: absolute; top: 1130px; left: 60px; right: 60px;
    display: flex; gap: 12px;
  }
  .sign {
    flex: 1; background: #FFFFFF;
    padding: 14px 18px; border-radius: 10px;
    font-size: 20px; font-weight: 800; color: #1A1A1A;
    text-align: center;
    border: 3px solid #FFD93D;
  }
  .sign b { color: #B71C1C; }

  .footer-band {
    position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
    background: #FFD93D;
    display: flex; align-items: center; justify-content: center;
    border-top: 4px solid #FFFFFF;
  }
  .footer-band .txt {
    color: #1A1A1A; font-size: 28px; font-weight: 900;
    letter-spacing: 3px;
  }
</style>
</head>
<body>
  <div class="top-band">
    <span class="h-tag">TRUST · 看得见的实力</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="title-area">
    <h1>不画饼 · <em>看实景</em><br>校区 + 学员都在这</h1>
  </div>

  <div class="photo-l"></div>
  <div class="photo-r"></div>

  <div class="stats">
    <div class="stat"><div class="v">7<sup>年+</sup></div><div class="l">本地深耕</div></div>
    <div class="stat"><div class="v">12<sup>人</sup></div><div class="l">小班上限</div></div>
    <div class="stat"><div class="v">8<sup>级</sup></div><div class="l">GESP 全覆盖</div></div>
    <div class="stat"><div class="v">3<sup>线</sup></div><div class="l">启蒙→GESP→CSP</div></div>
  </div>

  <div class="quote">
    <span class="lbl">家长真心话</span>
    <h2>"<b>能看到孩子真在写代码</b>·<br>不是只刷题、也不是只玩 Scratch"</h2>
  </div>

  <div class="sign-row">
    <div class="sign">证书墙 · <b>真实可查</b></div>
    <div class="sign">课堂 · <b>家长可随访</b></div>
    <div class="sign">作品 · <b>每月归档</b></div>
  </div>

  <div class="footer-band">
    <span class="txt">真实景 · 真课程 · 真进步</span>
  </div>
</body>
</html>
