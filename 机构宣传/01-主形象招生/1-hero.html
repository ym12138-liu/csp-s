<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 主形象招生</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .photo-top {
    position: absolute; top: 0; left: 0; right: 0; height: 720px;
    background: url("../../因诺信奥图片/DSC_2825.JPG") center/cover no-repeat;
  }
  .photo-top::after {
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 75%, #1A1A1A 100%);
  }
  .photo-bot-l {
    position: absolute; bottom: 150px; left: 0; width: 540px; height: 380px;
    background: url("../../因诺信奥图片/DSC_2898.JPG") center/cover no-repeat;
  }
  .photo-bot-r {
    position: absolute; bottom: 150px; right: 0; width: 540px; height: 380px;
    background: url("../../因诺信奥图片/DSC_6665.JPG") center/cover no-repeat;
  }
  .photo-bot-l::after, .photo-bot-r::after {
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.45) 100%);
  }

  .badge {
    position: absolute; top: 60px; left: 60px;
    background: #FFD93D; color: #1A1A1A;
    padding: 14px 28px; border-radius: 100px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    box-shadow: 6px 6px 0 #000;
  }
  .city {
    position: absolute; top: 60px; right: 60px;
    background: rgba(26,26,26,0.85); color: #FFD93D;
    padding: 14px 24px; border-radius: 100px;
    font-size: 24px; font-weight: 800; letter-spacing: 1px;
    border: 3px solid #FFD93D;
  }

  .title-block {
    position: absolute; top: 510px; left: 60px; right: 60px;
    z-index: 5;
  }
  .pre {
    color: #FFD93D; font-size: 36px; font-weight: 800;
    letter-spacing: 3px; margin-bottom: 14px;
    text-shadow: 3px 3px 0 #000;
  }
  .t1 {
    background: #FFD93D; color: #1A1A1A;
    display: inline-block;
    font-size: 88px; font-weight: 900;
    padding: 8px 24px; line-height: 1.1;
    box-shadow: 8px 8px 0 #000;
    letter-spacing: 2px;
  }
  .t2 {
    background: #1A1A1A; color: #FFD93D;
    display: inline-block;
    font-size: 88px; font-weight: 900;
    padding: 8px 24px; line-height: 1.1;
    margin-top: 16px;
    border: 4px solid #FFD93D;
    letter-spacing: 2px;
  }

  .chips {
    position: absolute; bottom: 170px; left: 60px; right: 60px;
    display: flex; gap: 14px; z-index: 5;
    justify-content: center;
  }
  .chip {
    background: #FFFFFF; color: #1A1A1A;
    padding: 16px 22px; border-radius: 12px;
    font-size: 28px; font-weight: 900;
    border: 3px solid #1A1A1A;
    box-shadow: 4px 4px 0 #FFD93D;
  }
  .chip b { color: #B71C1C; }

  .footer-band {
    position: absolute; bottom: 0; left: 0; right: 0; height: 150px;
    background: #1A1A1A; z-index: 6;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    border-top: 4px solid #FFD93D;
  }
  .brand {
    color: #FFFFFF; font-size: 40px; font-weight: 900;
    letter-spacing: 6px;
  }
  .brand b { color: #FFD93D; }
  .footer-tags {
    color: #FFD93D; font-size: 22px; font-weight: 800;
    letter-spacing: 4px; margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="photo-top"></div>
  <div class="photo-bot-l"></div>
  <div class="photo-bot-r"></div>

  <div class="badge">大连 · 因诺信奥</div>
  <div class="city">辐射辽宁</div>

  <div class="title-block">
    <div class="pre">// 6-16 岁 · 信奥 · 编程</div>
    <div class="t1">不刷题量</div>
    <br>
    <div class="t2">练真本事</div>
  </div>

  <div class="chips">
    <div class="chip">小班教学</div>
    <div class="chip">真题驱动</div>
    <div class="chip"><b>0 元</b>试听</div>
  </div>

  <div class="footer-band">
    <div class="brand">因诺<b>信奥</b></div>
    <div class="footer-tags"># 大连信奥 # CSP-J/S # GESP # 启蒙</div>
  </div>
</body>
</html>
