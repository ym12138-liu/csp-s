<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 学员成长</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .photo {
    position: absolute; top: 0; left: 0; right: 0; height: 720px;
    background: url("../../因诺信奥图片/DSC_6045.JPG") center/cover no-repeat;
  }
  .photo::after {
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.20) 0%, rgba(0,0,0,0.50) 60%, rgba(26,26,26,0.95) 95%, #1A1A1A 100%);
  }

  .badge { position: absolute; top: 60px; left: 60px; z-index: 5;
    background: #FFD93D; color: #1A1A1A;
    padding: 14px 28px; border-radius: 100px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    box-shadow: 6px 6px 0 #000; }
  .right-tag { position: absolute; top: 60px; right: 60px; z-index: 5;
    background: rgba(255,217,61,0.95); color: #1A1A1A;
    padding: 14px 24px; border-radius: 100px;
    font-size: 24px; font-weight: 900;
    border: 3px solid #1A1A1A; }

  .title-block { position: absolute; top: 290px; left: 60px; right: 60px; z-index: 5; }
  .pre { color: #FFD93D; font-size: 32px; font-weight: 800;
    letter-spacing: 3px; margin-bottom: 14px; text-shadow: 3px 3px 0 #000; }
  .big-text {
    color: #FFFFFF; font-size: 84px; font-weight: 900;
    line-height: 1.1; letter-spacing: 1px;
    text-shadow: 5px 5px 0 #000;
  }
  .big-text em {
    font-style: normal; background: #FFD93D; color: #1A1A1A;
    padding: 0 14px; box-shadow: 6px 6px 0 #FFFFFF;
    -webkit-text-fill-color: #1A1A1A;
  }

  .stats {
    position: absolute; top: 770px; left: 60px; right: 60px; z-index: 5;
    display: flex; gap: 14px;
  }
  .s {
    flex: 1; background: rgba(255,255,255,0.95);
    padding: 18px 12px; border-radius: 14px;
    text-align: center;
    border: 4px solid #1A1A1A;
    box-shadow: 5px 5px 0 #FFD93D;
  }
  .s .v { font-size: 38px; font-weight: 900; color: #B71C1C; line-height: 1; }
  .s .l { font-size: 16px; font-weight: 800; color: #1A1A1A; margin-top: 6px; }

  .pull {
    position: absolute; top: 1000px; left: 60px; right: 60px; z-index: 5;
    background: #FFD93D; color: #1A1A1A;
    padding: 22px 28px; border-radius: 16px;
    border: 4px solid #FFFFFF;
    box-shadow: 8px 8px 0 #FFFFFF;
    text-align: center;
  }
  .pull h2 { font-size: 30px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background: #1A1A1A; color: #FFD93D; padding: 0 8px; border-radius: 4px; }
  .pull p { font-size: 18px; font-weight: 700; margin-top: 8px; }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
    background: #1A1A1A; z-index: 6;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    border-top: 4px solid #FFD93D; }
  .brand { color: #FFFFFF; font-size: 30px; font-weight: 900; letter-spacing: 4px; }
  .brand b { color: #FFD93D; }
  .hash { color: #FFD93D; font-size: 18px; font-weight: 800; letter-spacing: 3px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="photo"></div>

  <div class="badge">大连 · 因诺信奥</div>
  <div class="right-tag">真实可查</div>

  <div class="title-block">
    <div class="pre">// 看证书墙 · 看学员名单</div>
    <div class="big-text">不画饼</div>
    <div class="big-text" style="margin-top:10px"><em>看真证书</em></div>
  </div>

  <div class="stats">
    <div class="s"><div class="v">200+</div><div class="l">在册学员</div></div>
    <div class="s"><div class="v">7 年</div><div class="l">本地深耕</div></div>
    <div class="s"><div class="v">30+</div><div class="l">大连初中升学</div></div>
    <div class="s"><div class="v">8 级</div><div class="l">GESP 全覆盖</div></div>
  </div>

  <div class="pull">
    <h2>不晒虚的<br><b>晒学员真实证书墙</b></h2>
    <p>每张证书可查 · 每个学校录取均有据</p>
  </div>

  <div class="footer-band">
    <div class="brand">因诺<b>信奥</b> · 大连</div>
    <div class="hash"># 学员战绩 # 升学 # 因诺信奥</div>
  </div>
</body>
</html>
