<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 录取真相</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .top-band { position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: #FFD93D; display: flex; align-items: center; padding: 0 60px;
    border-bottom: 4px solid #1A1A1A; }
  .h-tag { background: #1A1A1A; color: #FFD93D; padding: 12px 24px; border-radius: 8px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px; }
  .right { margin-left: auto; color: #1A1A1A; font-size: 24px; font-weight: 900; letter-spacing: 2px; }

  .title-area { position: absolute; top: 180px; left: 60px; right: 60px; }
  .title-area h1 { font-size: 60px; font-weight: 900; color: #FFFFFF; line-height: 1.1; }
  .title-area h1 em {
    font-style: normal; background: #FFD93D; color: #1A1A1A;
    padding: 0 12px; box-shadow: 6px 6px 0 #FFFFFF;
    display: inline-block;
  }

  .photo {
    position: absolute; top: 360px; left: 60px; right: 60px; height: 320px;
    border-radius: 14px; overflow: hidden;
    background: url("../../因诺信奥图片/DSC_6045.JPG") center/cover no-repeat;
    border: 4px solid #FFD93D;
    box-shadow: 6px 6px 0 #FFD93D;
  }

  .schools { position: absolute; top: 720px; left: 60px; right: 60px; }
  .schools .lbl {
    background: #FFD93D; color: #1A1A1A;
    padding: 8px 22px; border-radius: 8px;
    font-size: 22px; font-weight: 900; letter-spacing: 2px;
    display: inline-block; margin-bottom: 14px;
  }
  .schools-grid {
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .sch {
    background: #FFFFFF;
    padding: 12px 16px; border-radius: 10px;
    border: 3px solid #FFD93D;
    box-shadow: 3px 3px 0 #FFD93D;
  }
  .sch h4 { font-size: 20px; font-weight: 900; color: #1A1A1A; }
  .sch p { font-size: 14px; font-weight: 700; color: #424242; margin-top: 2px; }
  .sch p b { color: #B71C1C; }

  .pull {
    position: absolute; bottom: 100px; left: 60px; right: 60px;
    background: #FFD93D; color: #1A1A1A;
    padding: 22px 28px; border-radius: 16px;
    border: 4px solid #FFFFFF;
    box-shadow: 8px 8px 0 #FFFFFF;
    text-align: center;
  }
  .pull h2 { font-size: 28px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background: #1A1A1A; color: #FFD93D; padding: 0 8px; border-radius: 4px; }
  .pull p { font-size: 16px; font-weight: 700; margin-top: 6px; }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background: #FFD93D; border-top: 4px solid #FFFFFF;
    display: flex; align-items: center; justify-content: center; }
  .footer-band .txt { color: #1A1A1A; font-size: 26px; font-weight: 900; letter-spacing: 3px; }
</style>
</head>
<body>
  <div class="top-band">
    <span class="h-tag">REAL · 升学真相</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="title-area">
    <h1>科技特长生<em>录取学校</em><br>都在这了</h1>
  </div>

  <div class="photo"></div>

  <div class="schools">
    <span class="lbl">学员录取 · 大连本地名单</span>
    <div class="schools-grid">
      <div class="sch"><h4>大连育明高中</h4><p><b>科特生</b>录取</p></div>
      <div class="sch"><h4>大连 24 中</h4><p><b>科特生</b>录取</p></div>
      <div class="sch"><h4>大连 12 中</h4><p><b>科特生</b>录取</p></div>
      <div class="sch"><h4>大连 8 中</h4><p>初中升学</p></div>
      <div class="sch"><h4>大连 9 中</h4><p>初中升学</p></div>
      <div class="sch"><h4>大连 23 中</h4><p>初中升学</p></div>
      <div class="sch"><h4>大连 36 中</h4><p>初中升学</p></div>
      <div class="sch"><h4>大连 44 中</h4><p>初中升学</p></div>
      <div class="sch"><h4>大连嘉汇中学</h4><p>初中升学</p></div>
      <div class="sch"><h4>大连理工附中</h4><p>初中升学</p></div>
    </div>
  </div>

  <div class="pull">
    <h2>30+ 大连初中 / 高中<br><b>有学员升学路径可参考</b></h2>
    <p>具体姓名已脱敏 · 名单墙在校区可查</p>
  </div>

  <div class="footer-band">
    <span class="txt">真名单·真录取·真可问</span>
  </div>
</body>
</html>
