<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 0 元试听</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #FFD93D; position: relative; }
  body::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 80%, rgba(26,26,26,0.10) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.30) 0%, transparent 50%);
  }

  .badge { position: absolute; top: 60px; left: 60px;
    background: #1A1A1A; color: #FFD93D;
    padding: 14px 28px; border-radius: 100px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px;
    box-shadow: 6px 6px 0 #FFFFFF; }
  .right-tag { position: absolute; top: 60px; right: 60px;
    background: #1A1A1A; color: #FFD93D;
    padding: 14px 24px; border-radius: 100px;
    font-size: 24px; font-weight: 900;
    border: 3px solid #FFFFFF; }

  .hero {
    position: absolute; top: 220px; left: 60px; right: 60px;
    text-align: center;
  }
  .hero .pre {
    background: #1A1A1A; color: #FFD93D;
    display: inline-block;
    padding: 10px 22px; border-radius: 8px;
    font-size: 30px; font-weight: 900; letter-spacing: 4px;
    box-shadow: 4px 4px 0 #FFFFFF;
  }
  .zero {
    font-size: 380px; font-weight: 900; color: #1A1A1A;
    line-height: 0.95; letter-spacing: -10px;
    text-shadow: 12px 12px 0 #FFFFFF;
    margin-top: 30px;
  }
  .yuan {
    font-size: 80px; font-weight: 900; color: #1A1A1A;
    background: #FFFFFF;
    display: inline-block;
    padding: 6px 28px;
    border: 6px solid #1A1A1A;
    box-shadow: 8px 8px 0 #1A1A1A;
    margin-top: 10px;
    letter-spacing: 8px;
  }
  .sub {
    font-size: 32px; font-weight: 900; color: #1A1A1A;
    margin-top: 36px;
  }
  .sub b { background: #1A1A1A; color: #FFD93D; padding: 0 8px; border-radius: 4px; }

  .photo-strip {
    position: absolute; bottom: 240px; left: 60px; right: 60px;
    display: flex; gap: 14px;
  }
  .photo-strip .p {
    flex: 1; height: 160px; border-radius: 12px; overflow: hidden;
    background-size: cover; background-position: center;
    border: 4px solid #1A1A1A;
    box-shadow: 5px 5px 0 #1A1A1A;
  }
  .p1 { background-image: url("../../因诺信奥图片/DSC_2843.JPG"); }
  .p2 { background-image: url("../../因诺信奥图片/DSC_2898.JPG"); }
  .p3 { background-image: url("../../因诺信奥图片/DSC_6665.JPG"); }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
    background: #1A1A1A;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    border-top: 4px solid #FFFFFF; }
  .footer-band .pull {
    color: #FFFFFF; font-size: 36px; font-weight: 900;
    text-align: center; line-height: 1.3;
  }
  .footer-band .pull b { color: #FFD93D; }
  .footer-band .brand { color: #FFD93D; font-size: 22px; font-weight: 800;
    letter-spacing: 4px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="badge">大连 · 因诺信奥</div>
  <div class="right-tag">体验课</div>

  <div class="hero">
    <div class="pre">$ TRIAL · 试听课</div>
    <div class="zero">0</div>
    <div class="yuan">元 体 验</div>
    <div class="sub">先听 1 节·<b>不合适不报班</b></div>
  </div>

  <div class="photo-strip">
    <div class="p p1"></div>
    <div class="p p2"></div>
    <div class="p p3"></div>
  </div>

  <div class="footer-band">
    <div class="pull">不画饼·不绑年课<br><b>娃喜欢再聊</b></div>
    <div class="brand">因诺信奥 · 大连 · 适合再聊后续</div>
  </div>
</body>
</html>
