<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 试听都给啥</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #FFFBE5; position: relative; }

  .top-band { position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: #1A1A1A; display: flex; align-items: center; padding: 0 60px; }
  .h-tag { background: #FFD93D; color: #1A1A1A; padding: 12px 24px; border-radius: 8px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px; }
  .right { margin-left: auto; color: #FFD93D; font-size: 24px; font-weight: 800; letter-spacing: 2px; }

  .title-area { position: absolute; top: 180px; left: 60px; right: 60px; }
  .title-area h1 { font-size: 60px; font-weight: 900; color: #1A1A1A; line-height: 1.1; }
  .title-area h1 em {
    font-style: normal; background: #FFD93D; padding: 0 12px;
    box-shadow: 6px 6px 0 #1A1A1A; display: inline-block;
  }

  .gifts { position: absolute; top: 360px; left: 60px; right: 60px; }
  .gift {
    background: #FFFFFF; border-radius: 14px;
    padding: 16px 20px; margin-bottom: 14px;
    border: 3px solid #1A1A1A;
    box-shadow: 5px 5px 0 #FFD93D;
    display: flex; align-items: center;
  }
  .gift .icon {
    flex: 0 0 70px; height: 70px; border-radius: 14px;
    background: #FFD93D; color: #1A1A1A;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 900;
    border: 3px solid #1A1A1A;
    margin-right: 16px;
  }
  .gift .body { flex: 1; }
  .gift .body h3 { font-size: 24px; font-weight: 900; color: #1A1A1A; line-height: 1.2; }
  .gift .body p { font-size: 16px; font-weight: 700; color: #424242; margin-top: 4px; line-height: 1.3; }
  .gift .body p b { background: #FFD93D; color: #B71C1C; padding: 0 4px; border-radius: 3px; }
  .gift .price {
    flex: 0 0 100px; text-align: right;
    color: #B71C1C; font-size: 20px; font-weight: 900;
    text-decoration: line-through;
  }

  .total {
    position: absolute; top: 1070px; left: 60px; right: 60px;
    background: #1A1A1A; color: #FFFFFF;
    padding: 22px 28px; border-radius: 16px;
    border: 4px solid #FFD93D;
    box-shadow: 8px 8px 0 #FFD93D;
    display: flex; align-items: center; justify-content: space-between;
  }
  .total .lbl { font-size: 22px; font-weight: 800; color: #FFD93D; }
  .total .v {
    font-size: 60px; font-weight: 900; color: #FFFFFF;
  }
  .total .v b { color: #FFD93D; }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
    background: #FFD93D; border-top: 4px solid #1A1A1A;
    display: flex; align-items: center; justify-content: center; }
  .footer-band .txt { color: #1A1A1A; font-size: 28px; font-weight: 900; letter-spacing: 3px; }
</style>
</head>
<body>
  <div class="top-band">
    <span class="h-tag">GIFT · 试听都给啥</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="title-area">
    <h1>不只是<em>1 节课</em><br>还有 4 份诊断材料</h1>
  </div>

  <div class="gifts">
    <div class="gift">
      <div class="icon">①</div>
      <div class="body">
        <h3>1 节真实正课</h3>
        <p>跟学员一起上 90 分钟·<b>不演课</b></p>
      </div>
      <div class="price">¥299</div>
    </div>
    <div class="gift">
      <div class="icon">②</div>
      <div class="body">
        <h3>5 题水平诊断</h3>
        <p>测娃从几级开始 · <b>分级建议</b></p>
      </div>
      <div class="price">¥99</div>
    </div>
    <div class="gift">
      <div class="icon">③</div>
      <div class="body">
        <h3>课后 1 对 1 沟通</h3>
        <p>老师讲娃情况 · <b>30 分钟</b></p>
      </div>
      <div class="price">¥199</div>
    </div>
    <div class="gift">
      <div class="icon">④</div>
      <div class="body">
        <h3>路径图 + 教材清单</h3>
        <p>娃下一年要练啥 · <b>给清单</b></p>
      </div>
      <div class="price">¥99</div>
    </div>
    <div class="gift">
      <div class="icon">⑤</div>
      <div class="body">
        <h3>真题打标 PDF</h3>
        <p>CSP-J 7 年 / GESP 历年 · <b>带模块标签</b></p>
      </div>
      <div class="price">¥199</div>
    </div>
  </div>

  <div class="total">
    <div class="lbl">原价合计</div>
    <div class="v">¥895 → <b>0 元</b></div>
  </div>

  <div class="footer-band">
    <span class="txt">不绑续费·只想让你看见效果</span>
  </div>
</body>
</html>
