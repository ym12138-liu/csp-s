<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>因诺信奥 · 试听不踩坑</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; position: relative; }

  .top-band { position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: #FFD93D; display: flex; align-items: center; padding: 0 60px;
    border-bottom: 4px solid #1A1A1A; }
  .h-tag { background: #1A1A1A; color: #FFD93D; padding: 12px 24px; border-radius: 8px;
    font-size: 28px; font-weight: 900; letter-spacing: 2px; }
  .right { margin-left: auto; color: #1A1A1A; font-size: 24px; font-weight: 900; letter-spacing: 2px; }

  .title-area { position: absolute; top: 180px; left: 60px; right: 60px; }
  .title-area h1 { font-size: 60px; font-weight: 900; color: #FFFFFF; line-height: 1.1; }
  .title-area h1 em {
    font-style: normal; background: #FFD93D; color: #1A1A1A;
    padding: 0 12px; box-shadow: 6px 6px 0 #FFFFFF;
    display: inline-block;
  }

  .promises { position: absolute; top: 360px; left: 60px; right: 60px; }
  .row { display: flex; gap: 14px; margin-bottom: 14px; }
  .pr {
    flex: 1; background: #FFFFFF;
    border-radius: 14px; padding: 18px 20px;
    border: 4px solid #FFD93D;
    box-shadow: 5px 5px 0 #FFD93D;
  }
  .pr .ck {
    background: #FFD93D; color: #1A1A1A;
    width: 50px; height: 50px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900;
    border: 3px solid #1A1A1A;
    margin-bottom: 10px;
  }
  .pr h3 { font-size: 22px; font-weight: 900; color: #1A1A1A; line-height: 1.2; }
  .pr p { font-size: 15px; font-weight: 700; color: #424242; margin-top: 4px; line-height: 1.3; }
  .pr p b { background: #FFD93D; color: #B71C1C; padding: 0 4px; border-radius: 3px; }

  .photo-strip {
    position: absolute; top: 880px; left: 60px; right: 60px;
    display: flex; gap: 12px;
  }
  .photo-strip .ph {
    flex: 1; height: 180px; border-radius: 12px; overflow: hidden;
    background-size: cover; background-position: center;
    border: 4px solid #FFD93D;
  }
  .ph1 { background-image: url("../../因诺信奥图片/DSC_2812.JPG"); }
  .ph2 { background-image: url("../../因诺信奥图片/DSC_6044.JPG"); }
  .ph3 { background-image: url("../../因诺信奥图片/DSC_2898.JPG"); }

  .pull {
    position: absolute; bottom: 100px; left: 60px; right: 60px;
    background: #FFD93D; color: #1A1A1A;
    padding: 22px 28px; border-radius: 16px;
    border: 4px solid #FFFFFF;
    box-shadow: 8px 8px 0 #FFFFFF;
    text-align: center;
  }
  .pull h2 { font-size: 28px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background: #1A1A1A; color: #FFD93D; padding: 0 8px; border-radius: 4px; }

  .footer-band { position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background: #FFD93D; border-top: 4px solid #FFFFFF;
    display: flex; align-items: center; justify-content: center; }
  .footer-band .txt { color: #1A1A1A; font-size: 26px; font-weight: 900; letter-spacing: 3px; }
</style>
</head>
<body>
  <div class="top-band">
    <span class="h-tag">PROMISE · 4 条不</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="title-area">
    <h1>试听课<em>4 条不</em><br>家长安心来</h1>
  </div>

  <div class="promises">
    <div class="row">
      <div class="pr">
        <div class="ck">不</div>
        <h3>不绑销售</h3>
        <p>试听完<b>不打卖卡电话</b>·想报班自己来</p>
      </div>
      <div class="pr">
        <div class="ck">不</div>
        <h3>不演课</h3>
        <p>就是真实班·<b>不抽出来给你看</b></p>
      </div>
    </div>
    <div class="row">
      <div class="pr">
        <div class="ck">不</div>
        <h3>不催报</h3>
        <p>给你 <b>3 天观察期</b> · 不催决定</p>
      </div>
      <div class="pr">
        <div class="ck">不</div>
        <h3>不绑年课</h3>
        <p>报班可选 <b>3 个月起步</b> · 不强推全年</p>
      </div>
    </div>
  </div>

  <div class="photo-strip">
    <div class="ph ph1"></div>
    <div class="ph ph2"></div>
    <div class="ph ph3"></div>
  </div>

  <div class="pull">
    <h2>不焦虑·不被推·不冲动<br><b>试听完·想清楚再说</b></h2>
  </div>

  <div class="footer-band">
    <span class="txt">真试听·真透明·真给你想清楚的时间</span>
  </div>
</body>
</html>
