<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GESP 七级核心考点 · 数据</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#FFE0B2; color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #BF360C, #FFEB3B); }
  body::after  { content:""; position:absolute; bottom:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #FFEB3B, #BF360C); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#BF360C; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 70px; font-weight:900; margin-top:18px; line-height:1.1; color:#BF360C; }
  h1 em { font-style:normal; background: linear-gradient(transparent 60%, #FFEB3B 60%); padding: 0 6px; }
  .row { display:flex; align-items:center; padding: 18px 22px; background:#FFF; border-radius: 16px; margin-top: 16px; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #BF360C; }
  .row .icon { flex: 0 0 76px; height:76px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:36px; color:#FFF; margin-right: 20px; box-shadow: 3px 3px 0 #1A1A1A; }
  .ic1 { background:#E91E63;}
  .ic2 { background:#FF5722;}
  .ic3 { background:#4CAF50;}
  .ic4 { background:#2196F3;}
  .ic5 { background:#9C27B0;}
  .row .body { flex: 1; }
  .row .body h3 { font-size:30px; font-weight:900; color:#1A1A1A; line-height:1.2;}
  .row .body p { font-size:22px; color:#666; margin-top:4px;}
  .row .body p code { background:#FFEB3B; color:#BF360C; padding: 2px 8px; border-radius:4px; font-weight:700; }
  .row .score { text-align: center; flex: 0 0 100px; background:#FFEB3B; color:#BF360C; padding: 8px 12px; border-radius: 12px; font-weight: 900; line-height: 1.1; border: 3px solid #1A1A1A; }
  .row .score .v { font-size: 32px; }
  .row .score .l { font-size: 18px; opacity: 0.8; }
  .key { margin-top: 24px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #BF360C; }
  .key .lbl { font-size:22px; opacity:.85; letter-spacing:2px; font-weight:700; }
  .key h2 { font-size:34px; color:#FFFFFF; font-weight:900; line-height:1.4; margin-top:6px; }
  .key h2 b { color:#FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">TOP 5 · 必拿分模块</span>
    <h1>这 5 块<em>占 80% 分</em></h1>
    <div class="row"><div class="icon ic1">1</div><div class="body"><h3>图论基础（必考）</h3><p>度数 / 邻接 / BFS / DFS · <b>必拿</b></p></div><div class="score"><div class="v">≈120</div><div class="l">分</div></div></div>
    <div class="row"><div class="icon ic2">2</div><div class="body"><h3>二叉树深化</h3><p>完全 / 满 / 叶子 / 三遍历推导</p></div><div class="score"><div class="v">≈80</div><div class="l">分</div></div></div>
    <div class="row"><div class="icon ic3">3</div><div class="body"><h3>哈希表</h3><p>哈希函数 + 链地址 / 线性探测</p></div><div class="score"><div class="v">≈60</div><div class="l">分</div></div></div>
    <div class="row"><div class="icon ic4">4</div><div class="body"><h3>高级 DP</h3><p>LCS + 滚动数组 + 复杂背包</p></div><div class="score"><div class="v">≈70</div><div class="l">分</div></div></div>
    <div class="row"><div class="icon ic5">5</div><div class="body"><h3>复杂度递推 / 强连通</h3><p>主定理 · 生成树 · n-1 条边</p></div><div class="score"><div class="v">≈50</div><div class="l">分</div></div></div>
    <div class="key">
      <div class="lbl">DATA · 10 套真题统计</div>
      <h2>掌握这 5 块 · <b>冲到 80 分</b><br>图论是七级的命门</h2>
    </div>
  </div>
</body>
</html>
