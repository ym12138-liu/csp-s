<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GESP 一级核心考点 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: #1A1A1A; color: #FFF; position: relative;
  }
  body::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 80%, rgba(255,87,34,0.5) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(255,235,59,0.4) 0%, transparent 50%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#B71C1C; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 84px; font-weight: 900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#FFEB3B; }

  .check {
    background: #2C2C2C; border-radius: 18px;
    padding: 22px 26px; margin-top: 18px;
    display: flex; align-items: center;
    border-left: 10px solid #FF5722;
  }
  .check .box {
    flex: 0 0 60px; height: 60px; border-radius:12px;
    background:#FFF; border: 4px solid #1A1A1A;
    margin-right: 22px; position: relative;
  }
  .check .box::after {
    content:""; position:absolute; top:8px; left:14px;
    width: 14px; height: 30px; border:solid #B71C1C;
    border-width: 0 6px 6px 0; transform: rotate(45deg);
  }
  .check h3 { font-size:32px; color:#FFEB3B; font-weight:900; }
  .check p { font-size:24px; color:#E0E0E0; margin-top: 4px; line-height: 1.45; }
  .check p code { background:#FFEB3B; color:#B71C1C; padding:2px 10px; border-radius:4px; font-weight:700; }
  .check p b { color:#FFCC80; }

  .pull {
    margin-top: 26px; padding: 24px 28px;
    background: linear-gradient(135deg, #FF5722, #FFEB3B);
    color:#1A1A1A; border-radius: 18px;
    box-shadow: 8px 8px 0 #FFFFFF;
  }
  .pull h2 { font-size: 38px; font-weight:900; line-height:1.4; }
  .pull h2 b { color: #B71C1C; }
  .pull p { font-size: 24px; font-weight: 700; margin-top: 8px; }
  .cta {
    position:absolute; bottom:0; left:60px; right:60px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:24px; color:#FFEB3B; font-weight:700;
  }
  .pill { background:#FFEB3B; color:#B71C1C; padding:10px 22px; border-radius:100px; font-weight:900; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">ACTION · 4 周冲过线</span>
    <h1>4 周计划<br><em>冲 60 分</em></h1>

    <div class="check">
      <div class="box"></div>
      <div>
        <h3>W1 · 表达式 + 流程</h3>
        <p>背运算优先级 + 写 30 道 <code>%</code> 取模题 · <b>目标 30+ 分</b></p>
      </div>
    </div>
    <div class="check">
      <div class="box"></div>
      <div>
        <h3>W2 · 编程题模板</h3>
        <p>抄"输入 N 数 + 计数"模板 <code>3 遍</code> · 编程题保底 25 分</p>
      </div>
    </div>
    <div class="check">
      <div class="box"></div>
      <div>
        <h3>W3 · 限时刷 2025 真题</h3>
        <p>3 套真题 90 分钟 / 套 · <b>找出最弱模块</b></p>
      </div>
    </div>
    <div class="check">
      <div class="box"></div>
      <div>
        <h3>W4 · 时事 + 模考</h3>
        <p>背鸿蒙 / DeepSeek / 王选奖 + 限时 2025 / 2026 真题</p>
      </div>
    </div>

    <div class="pull">
      <h2>记一句话<br><b>表达式 + 1 个循环 = GESP 一级</b></h2>
      <p>大连娃普遍 4 周冲过线 · 不报班也行</p>
    </div>
  </div>
  <div class="cta">
    <span>#GESP一级 #信奥启蒙 #大连</span>
    <span class="pill">收藏</span>
  </div>
</body>
</html>
