<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GESP 六级核心考点 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(135deg, #4527A0 0%, #7E57C2 50%, #FFEB3B 100%); color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:-100px; right:-100px; width:460px; height:460px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:-80px; left:-80px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,235,59,0.55) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:14px 32px; border-radius:100px; font-size:32px; font-weight:900; letter-spacing:3px; margin-bottom: 50px; box-shadow: 6px 6px 0 #311B92; }
  .level-tag { display:inline-block; background:#FFFFFF; color:#311B92; padding: 8px 20px; border-radius:8px; font-size: 36px; font-weight: 900; border: 4px solid #1A1A1A; box-shadow: 4px 4px 0 #1A1A1A; margin-bottom: 24px; }
  .title { font-size: 132px; font-weight:900; line-height:1; color:#FFFFFF; text-shadow: 6px 6px 0 #311B92; letter-spacing: -4px; }
  .title .red { color: #B71C1C; background: #FFEB3B; padding: 0 14px; box-shadow: 8px 8px 0 #1A1A1A; display: inline-block; }
  .sub { margin-top: 36px; font-size: 44px; font-weight: 800; color: #1A1A1A; line-height: 1.4; }
  .sub b { background: #FFFFFF; padding: 4px 16px; border-radius: 8px; color: #311B92; border: 3px solid #1A1A1A; }
  .num-card { margin-top: 50px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
  .card-mini { background: #FFF; border: 4px solid #1A1A1A; border-radius: 16px; padding: 16px; text-align: center; box-shadow: 4px 4px 0 #311B92; }
  .card-mini .v { font-size: 56px; font-weight: 900; color: #311B92; line-height: 1; }
  .card-mini .l { font-size: 22px; font-weight: 800; color: #1A1A1A; margin-top: 6px; }
  .footer { position: absolute; bottom: 0; left: 70px; right: 70px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: #1A1A1A; font-weight: 900; }
  .stamp { background: #1A1A1A; color: #FFEB3B; padding: 14px 24px; border-radius: 8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长收藏 · CSP-J 复赛核心</div>
    <div class="level-tag">LEVEL 6 · 六级</div>
    <div class="title">
      二叉树<br>
      <span class="red">+ DP</span>
    </div>
    <div class="sub">
      10 套真题逐题打标<br>
      <b>5 个模块拿 80 分</b>
    </div>
    <div class="num-card">
      <div class="card-mini"><div class="v">100</div><div class="l">满分</div></div>
      <div class="card-mini"><div class="v">60</div><div class="l">过关</div></div>
      <div class="card-mini"><div class="v">90</div><div class="l">分钟</div></div>
    </div>
  </div>
  <div class="footer">
    <span>#GESP六级 #二叉树 #大连娃</span>
    <span class="stamp">收藏照刷</span>
  </div>
</body>
</html>
