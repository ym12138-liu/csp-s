<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GESP 三级核心考点 · 数据</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#E0F7FA; color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #006064, #FFEB3B); }
  body::after  { content:""; position:absolute; bottom:0; left:0; right:0; height: 80px; background: linear-gradient(90deg, #FFEB3B, #006064); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#006064; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 70px; font-weight:900; margin-top:18px; line-height:1.1; color:#006064; }
  h1 em { font-style:normal; background: linear-gradient(transparent 60%, #FFEB3B 60%); padding: 0 6px; }

  .row { display:flex; align-items:center; padding: 18px 22px; background:#FFF; border-radius: 16px; margin-top: 16px; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #006064; }
  .row .icon { flex: 0 0 76px; height:76px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:36px; color:#FFF; margin-right: 20px; box-shadow: 3px 3px 0 #1A1A1A; }
  .ic1 { background:#E91E63;}
  .ic2 { background:#FF5722;}
  .ic3 { background:#4CAF50;}
  .ic4 { background:#2196F3;}
  .ic5 { background:#9C27B0;}
  .row .body { flex: 1; }
  .row .body h3 { font-size:30px; font-weight:900; color:#1A1A1A; line-height:1.2;}
  .row .body p { font-size:22px; color:#666; margin-top:4px;}
  .row .body p code { background:#FFEB3B; color:#006064; padding: 2px 8px; border-radius:4px; font-weight:700; }
  .row .score { text-align: center; flex: 0 0 100px; background:#FFEB3B; color:#006064; padding: 8px 12px; border-radius: 12px; font-weight: 900; line-height: 1.1; border: 3px solid #1A1A1A; }
  .row .score .v { font-size: 32px; }
  .row .score .l { font-size: 18px; opacity: 0.8; }

  .key { margin-top: 24px; padding: 22px 26px; background: #1A1A1A; color: #FFEB3B; border-radius: 16px; box-shadow: 8px 8px 0 #006064; }
  .key .lbl { font-size:22px; opacity:.85; letter-spacing:2px; font-weight:700; }
  .key h2 { font-size:34px; color:#FFFFFF; font-weight:900; line-height:1.4; margin-top:6px; }
  .key h2 b { color:#FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">TOP 5 · 必拿分模块</span>
    <h1>这 5 块<em>占 75% 分</em></h1>

    <div class="row"><div class="icon ic1">1</div><div class="body"><h3>位运算（6 神器）</h3><p><code>& | ^ ~ &lt;&lt; &gt;&gt;</code> · 必考多题</p></div><div class="score"><div class="v">≈60</div><div class="l">分</div></div></div>
    <div class="row"><div class="icon ic2">2</div><div class="body"><h3>进制转换</h3><p>2/8/10/16 互转 · 浮点二进制</p></div><div class="score"><div class="v">≈30</div><div class="l">分</div></div></div>
    <div class="row"><div class="icon ic3">3</div><div class="body"><h3>字符串处理</h3><p>string 类 · <code>strcmp</code> · 字符遍历</p></div><div class="score"><div class="v">≈30</div><div class="l">分</div></div></div>
    <div class="row"><div class="icon ic4">4</div><div class="body"><h3>C++ 内置函数</h3><p><code>min/max/abs/pow/sqrt</code></p></div><div class="score"><div class="v">≈30</div><div class="l">分</div></div></div>
    <div class="row"><div class="icon ic5">5</div><div class="body"><h3>三目 + 流程图</h3><p><code>a?b:c</code> · 流程图阅读 · 逻辑推理</p></div><div class="score"><div class="v">≈22</div><div class="l">分</div></div></div>

    <div class="key">
      <div class="lbl">DATA · 10 套真题统计</div>
      <h2>掌握这 5 块 · <b>必到 75 分</b><br>位运算丢了基本就挂</h2>
    </div>
  </div>
</body>
</html>
