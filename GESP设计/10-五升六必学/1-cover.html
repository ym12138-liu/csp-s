<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GESP 五升六 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(160deg, #880E4F 0%, #C2185B 50%, #FFEB3B 100%); color:#FFF; position:relative; }
  body::before { content:""; position:absolute; top:80px; left:-100px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,235,59,0.4) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:60px; right:-100px; width:400px; height:400px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:14px 32px; border-radius:100px; font-size:32px; font-weight:900; letter-spacing:3px; margin-bottom: 36px; box-shadow: 6px 6px 0 #880E4F; }
  .arrow-row { display: flex; align-items: center; gap: 18px; margin-bottom: 32px; }
  .lvl { display:inline-block; background:#FFFFFF; padding: 10px 22px; border-radius: 14px; font-size: 44px; font-weight: 900; color: #880E4F; border: 4px solid #1A1A1A; box-shadow: 4px 4px 0 #1A1A1A; }
  .lvl.b { background:#FFEB3B; color: #B71C1C;}
  .arrow { font-size: 60px; font-weight: 900; color: #FFEB3B; text-shadow: 4px 4px 0 #1A1A1A; }
  .title { font-size: 144px; font-weight:900; line-height:0.95; color:#FFFFFF; text-shadow: 6px 6px 0 #880E4F; letter-spacing: -4px; }
  .title em { font-style:normal; color:#FFEB3B; background:#1A1A1A; padding: 0 14px; box-shadow: 8px 8px 0 #FFEB3B; display: inline-block; }
  .sub { margin-top: 36px; background: #FFFFFF; color: #880E4F; padding: 18px 24px; border-radius: 14px; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #FFEB3B; font-size: 36px; font-weight: 800; display: inline-block; line-height: 1.4; }
  .sub b { color: #B71C1C; }
  .footer { position: absolute; bottom: 0; left: 70px; right: 70px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: #FFEB3B; font-weight: 900; }
  .stamp { background:#FFEB3B; color:#880E4F; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长接力 · CSP-J 复赛核心</div>
    <div class="arrow-row">
      <span class="lvl">五级</span>
      <span class="arrow">▶</span>
      <span class="lvl b">六级</span>
    </div>
    <div class="title">
      升级<br>
      必学 <em>4 块</em>
    </div>
    <div class="sub">
      二叉树 + BST + OOP + DP<br>
      <b>CSP-J 复赛核心</b>
    </div>
  </div>
  <div class="footer">
    <span>#五升六 #二叉树 #大连娃</span>
    <span class="stamp">收藏照练</span>
  </div>
</body>
</html>
