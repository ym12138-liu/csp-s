<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>七级升八级 · 班型与节奏</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; overflow: hidden;
font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
background: #FFFFFF; color: #1A1A1A; }
.top { position: absolute; top: 0; left: 0; right: 0; height: 150px;
background: #0D47A1; display: flex; align-items: center; padding: 0 60px; }
.top .badge { background: #FFFFFF; color: #0D47A1; padding: 12px 24px;
border-radius: 8px; font-size: 28px; font-weight: 900; }
.top .right { margin-left: auto; color: #FFFFFF; font-size: 22px; font-weight: 800; }
.h1 { position: absolute; top: 200px; left: 60px; right: 60px; }
.h1 .pre { color: #2196F3; font-size: 26px; font-weight: 800; letter-spacing: 3px; margin-bottom: 10px; }
.h1 h1 { font-size: 60px; font-weight: 900; color: #0D47A1; line-height: 1.1; }
.h1 h1 b { background: #2196F3; color: #FFFFFF; padding: 0 12px; border-radius: 6px; }
.cards { position: absolute; top: 400px; left: 60px; right: 60px;
display: flex; flex-direction: column; gap: 14px; }
.card { display: flex; padding: 14px 20px; border-radius: 12px; }
.card.c1 { background: #E3F2FD; border-left: 6px solid #0D47A1; }
.card.c2 { background: #FFF8E1; border-left: 6px solid #F57F17; }
.card.c3 { background: #E8F5E9; border-left: 6px solid #2E7D32; }
.card .icon { flex: 0 0 80px; font-size: 36px; font-weight: 900;
color: #0D47A1; text-align: center; padding-top: 4px; }
.card.c2 .icon { color: #F57F17; }
.card.c3 .icon { color: #2E7D32; }
.card .body h3 { font-size: 22px; font-weight: 900; color: #0D47A1; line-height: 1.2; }
.card .body p { font-size: 16px; color: #424242; margin-top: 4px; font-weight: 700; line-height: 1.4; }
.card .body p b { background: #FFF59D; color: #B71C1C; padding: 0 4px; border-radius: 3px; }
.pull { position: absolute; bottom: 200px; left: 60px; right: 60px;
background: #0D47A1; color: #FFFFFF; padding: 22px 28px; border-radius: 16px; }
.pull h2 { font-size: 26px; font-weight: 900; line-height: 1.4; }
.pull h2 b { background: #2196F3; padding: 0 8px; border-radius: 4px; }
.footer { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
background: #0D47A1; display: flex; align-items: center; justify-content: center; }
.footer .txt { color: #FFFFFF; font-size: 22px; font-weight: 900; letter-spacing: 4px; }
</style></head><body>
<div class="top"><span class="badge">PATH · 班型对应</span><span class="right">因诺信奥 · 大连</span></div>
<div class="h1"><div class="pre">// 班型 · 节奏 · 推进</div><h1>七级到八级<br><b>怎么补</b></h1></div>
<div class="cards">
<div class="card c1"><div class="icon">①</div><div class="body"><h3>小班 3 人 · 真题驱动</h3><p>因诺标准班型 · 老师 1 对 3 盯 · 错题逐题<b>当面改</b></p></div></div>
<div class="card c2"><div class="icon">②</div><div class="body"><h3>每周 1 块 · 月底自测</h3><p>不堆量 · 一周一块 · <b>24 周</b>把新增 5 项过完</p></div></div>
<div class="card c3"><div class="icon">③</div><div class="body"><h3>真题打标 + 错题归类</h3><p>本号 GESP 历年真题逐题打标 · 哪块弱补哪</p></div></div>
</div>
<div class="pull"><h2>四大图算法 + 组合数学 = GESP 顶级</h2></div>
<div class="footer"><span class="txt">班型 · 节奏 · 真题</span></div>
</body></html>
