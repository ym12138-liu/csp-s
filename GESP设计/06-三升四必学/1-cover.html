<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GESP 三升四 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(160deg, #B71C1C 0%, #FF5722 50%, #FFC107 100%); color:#FFF; position:relative; }
  body::before { content:""; position:absolute; top:80px; left:-100px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,235,59,0.4) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:60px; right:-100px; width:400px; height:400px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFEB3B; padding:14px 32px; border-radius:100px; font-size:32px; font-weight:900; letter-spacing:3px; margin-bottom: 36px; box-shadow: 6px 6px 0 #FFEB3B; }
  .arrow-row { display: flex; align-items: center; gap: 18px; margin-bottom: 32px; }
  .lvl { display:inline-block; background:#FFFFFF; padding: 10px 22px; border-radius: 14px; font-size: 44px; font-weight: 900; color: #B71C1C; border: 4px solid #1A1A1A; box-shadow: 4px 4px 0 #1A1A1A; }
  .lvl.b { background:#FFEB3B; color: #1A1A1A; }
  .arrow { font-size: 60px; font-weight: 900; color: #FFEB3B; text-shadow: 4px 4px 0 #1A1A1A; }
  .title { font-size: 144px; font-weight:900; line-height:0.95; color:#FFFFFF; text-shadow: 6px 6px 0 #B71C1C; letter-spacing: -4px; }
  .title em { font-style:normal; color:#FFEB3B; background:#1A1A1A; padding: 0 14px; box-shadow: 8px 8px 0 #FFEB3B; display: inline-block; }
  .sub { margin-top: 36px; background: #1A1A1A; color: #FFEB3B; padding: 18px 24px; border-radius: 14px; box-shadow: 6px 6px 0 #FFEB3B; font-size: 36px; font-weight: 800; display: inline-block; line-height: 1.4; border: 4px solid #FFEB3B; }
  .sub b { color: #FF5722; }
  .footer { position: absolute; bottom: 0; left: 70px; right: 70px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: #FFEB3B; font-weight: 900; }
  .stamp { background:#FFEB3B; color:#B71C1C; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长接力 · 第一道大关</div>
    <div class="arrow-row">
      <span class="lvl">三级</span>
      <span class="arrow">▶</span>
      <span class="lvl b">四级</span>
    </div>
    <div class="title">
      第一道<br>
      <em>大关</em>
    </div>
    <div class="sub">
      指针 + 函数 + 三种排序<br>
      <b>四级最大跨越</b>
    </div>
  </div>
  <div class="footer">
    <span>#三升四 #指针 #大连娃</span>
    <span class="stamp">收藏照练</span>
  </div>
</body>
</html>
