<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>GESP 八级升CSP-S</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; overflow: hidden;
font-family: "PingFang SC", "Microsoft YaHei", sans-serif;

.top { position: absolute; top: 0; left: 0; right: 0; height: 150px;

.h1 h1 { font-size: 60px; font-weight: 900; color: #0D47A1; line-height: 1.1; }
.h1 h1 b { background: #2196F3; color: #FFFFFF; padding: 0 12px; border-radius: 6px; }
.vs { position: absolute; top: 460px; left: 60px; right: 60px;

.col { flex: 1; padding: 18px 20px; border-radius: 14px; }
.col.l { background: #E3F2FD; border: 3px solid #0D47A1; }
.col.r { background: #FFEBEE; border: 3px solid #B71C1C; }
.col h3 { font-size: 22px; font-weight: 900; text-align: center;

.col.l h3 { background: #0D47A1; }
.col.r h3 { background: #B71C1C; }

.col p:last-child { border-bottom: none; }

<div class="top"><span class="badge">COMPARE · 八级 vs CSP-S</span><span class="right">因诺信奥 · 大连</span></div>
<div class="h1"><div class="pre">// 6 个月补差 · 跨度 信奥真正赛道</div><h1>八级到CSP-S<br>差距是<b>信奥真正赛道</b></h1></div>
<div class="vs">
<div class="col l"><h3>GESP 八级</h3><p>四大图算法基础</p><p>组合数学入门</p><p>简单 OOP</p><p>树形 DP</p><p>题型 = 单选+判断+编程</p><p>过关线 60 分</p></div>
<div class="col r"><h3>CSP-S 初赛</h3><p>位运算等价化简</p><p>状压 / 区间 / 计数 DP</p><p>Trie / 线段树 / 并查集</p><p>题型 = 单选+阅读+完善</p><p>奖牌线因省份 60-90 不等</p></div>
</div>
<div class="pull"><h2>新增项就是 <b>差距来源</b> · 一项不能少</h2></div>
