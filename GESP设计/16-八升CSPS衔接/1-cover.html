<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GESP 八升 CSP-S · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: linear-gradient(160deg, #B71C1C 0%, #FF6F00 50%, #FFD700 100%); color:#FFF; position:relative; }
  body::before { content:""; position:absolute; top:80px; left:-100px; width:380px; height:380px; border-radius:50%; background: radial-gradient(circle, rgba(255,215,0,0.5) 0%, transparent 70%); }
  body::after { content:""; position:absolute; bottom:60px; right:-100px; width:400px; height:400px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .badge { display:inline-block; background:#1A1A1A; color:#FFD700; padding:14px 32px; border-radius:100px; font-size:32px; font-weight:900; letter-spacing:3px; margin-bottom: 36px; box-shadow: 6px 6px 0 #FFD700; }
  .arrow-row { display: flex; align-items: center; gap: 18px; margin-bottom: 32px; flex-wrap: wrap; }
  .lvl { display:inline-block; background:#FFFFFF; padding: 10px 22px; border-radius: 14px; font-size: 38px; font-weight: 900; color: #B71C1C; border: 4px solid #1A1A1A; box-shadow: 4px 4px 0 #1A1A1A; }
  .lvl.b { background:#FFD700; color: #1A1A1A; }
  .arrow { font-size: 50px; font-weight: 900; color: #FFD700; text-shadow: 4px 4px 0 #1A1A1A; }
  .title { font-size: 132px; font-weight:900; line-height:0.95; color:#FFFFFF; text-shadow: 6px 6px 0 #B71C1C; letter-spacing: -4px; }
  .title em { font-style:normal; color:#1A1A1A; background:#FFD700; padding: 0 14px; box-shadow: 8px 8px 0 #1A1A1A; display: inline-block; }
  .sub { margin-top: 36px; background: #FFFFFF; color: #B71C1C; padding: 18px 24px; border-radius: 14px; border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #FFD700; font-size: 32px; font-weight: 800; display: inline-block; line-height: 1.4; }
  .sub b { color: #1A1A1A; }
  .footer { position: absolute; bottom: 0; left: 70px; right: 70px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: #FFD700; font-weight: 900; }
  .stamp { background:#FFD700; color:#B71C1C; padding:14px 24px; border-radius:8px; transform: rotate(-5deg); }
</style>
</head>
<body>
  <div class="safe">
    <div class="badge">大连家长收藏 · 信奥登顶</div>
    <div class="arrow-row">
      <span class="lvl">八级</span>
      <span class="arrow">▶</span>
      <span class="lvl b">CSP-S</span>
      <span class="arrow">▶</span>
      <span class="lvl">NOIP</span>
    </div>
    <div class="title">
      最后<br>
      一公里 <em>5 块</em>
    </div>
    <div class="sub">
      过完八级 → CSP-S 必补<br>
      <b>信奥真正赛道开始</b>
    </div>
  </div>
  <div class="footer">
    <span>#八升CSPS #信奥 #大连娃</span>
    <span class="stamp">收藏照练</span>
  </div>
</body>
</html>
