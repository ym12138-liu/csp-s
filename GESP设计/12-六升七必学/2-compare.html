<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GESP 六升七 · 对比</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #E0F7FA; color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:0; left:0; right:0; height:80px; background: linear-gradient(90deg, #006064, #FFEB3B); }
  body::after  { content:""; position:absolute; bottom:0; left:0; right:0; height:80px; background: linear-gradient(90deg, #FFEB3B, #006064); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#006064; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:900; font-size:28px; }
  h1 { font-size: 68px; font-weight:900; margin-top:18px; line-height:1.1; color:#006064; }
  h1 em { font-style:normal; background: linear-gradient(transparent 60%, #FFEB3B 60%); padding:0 6px; }
  .compare { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .col { background:#FFF; border-radius:18px; padding: 20px 22px; border: 4px solid #1A1A1A; }
  .col.j { box-shadow: 6px 6px 0 #00ACC1; }
  .col.s { box-shadow: 6px 6px 0 #B71C1C; }
  .col h3 { text-align: center; padding: 8px 0; border-radius: 8px; margin-bottom: 12px; color:#FFFFFF; font-size: 32px; font-weight: 900; }
  .col.j h3 { background: #00ACC1; }
  .col.s h3 { background: #B71C1C; }
  .col p { font-size: 22px; line-height: 1.55; padding: 8px 0; border-bottom: 1px dashed #B2EBF2; color: #1A1A1A; font-weight: 700; }
  .col p:last-child { border-bottom: none; }
  .col p code { background:#FFEB3B; color:#B71C1C; padding: 2px 8px; border-radius:4px; font-weight: 700; }
  .gap-list { margin-top: 22px; background: #1A1A1A; color: #FFF; border-radius: 18px; padding: 22px 26px; box-shadow: 8px 8px 0 #FFEB3B; }
  .gap-list h2 { font-size:34px; font-weight:900; color:#FFEB3B; margin-bottom: 14px; }
  .gap-row { display:flex; align-items:center; padding: 10px 0; border-bottom: 1px solid #424242; }
  .gap-row:last-child { border-bottom: none; }
  .gap-row .n { flex:0 0 48px; height:48px; border-radius:50%; background:#00ACC1; color:#FFEB3B; font-weight:900; font-size:22px; display:flex; align-items:center; justify-content:center; margin-right: 16px; box-shadow: 2px 2px 0 #FFEB3B; }
  .gap-row .nm { flex:1; font-size:26px; font-weight:800; }
  .gap-row .sc { font-size: 24px; font-weight:900; color:#FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">COMPARE · 七级 vs 六级</span>
    <h1>新增<em>图论 + 哈希</em><br>对接 CSP-S 主战场</h1>
    <div class="compare">
      <div class="col j">
        <h3>六级</h3>
        <p>仅树和栈队列</p>
        <p>不考图论</p>
        <p>不考哈希表</p>
        <p>仅 0-1 背包入门</p>
        <p>仅简单复杂度</p>
      </div>
      <div class="col s">
        <h3>七级</h3>
        <p><b>新增图论（必考）</b></p>
        <p><b>BFS / DFS 图遍历</b></p>
        <p><b>哈希表 + 冲突</b></p>
        <p><b>LCS + 滚动数组</b></p>
        <p><b>主定理递推式</b></p>
      </div>
    </div>
    <div class="gap-list">
      <h2>六升七 · 必补 5 项</h2>
      <div class="gap-row"><div class="n">1</div><div class="nm">图论基础（度数 / 邻接 / BFS-DFS）</div><span class="sc">≈120 分</span></div>
      <div class="gap-row"><div class="n">2</div><div class="nm">哈希表（链地址 / 线性探测）</div><span class="sc">≈60 分</span></div>
      <div class="gap-row"><div class="n">3</div><div class="nm">高级 DP（LCS + 滚动数组）</div><span class="sc">≈70 分</span></div>
      <div class="gap-row"><div class="n">4</div><div class="nm">复杂度递推式（主定理）</div><span class="sc">≈50 分</span></div>
      <div class="gap-row"><div class="n">5</div><div class="nm">强连通 / 生成树概念</div><span class="sc">≈30 分</span></div>
    </div>
  </div>
</body>
</html>
