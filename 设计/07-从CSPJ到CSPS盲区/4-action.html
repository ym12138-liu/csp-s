<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>从 CSP-J 到 CSP-S 盲区 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#1A1A1A; color:#FFF; position:relative;}
  body::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 25% 25%, rgba(183,28,28,0.6) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255,235,59,0.3) 0%, transparent 50%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#B71C1C; padding:10px 26px; border-radius:8px; font-weight:800; font-size:28px;}
  h1 { font-size: 84px; font-weight: 900; margin-top:18px; line-height:1.05;}
  h1 em { font-style:normal; color:#FFEB3B;}

  .check {
    background:#2C2C2C; border-radius: 16px; padding: 22px 26px;
    margin-top: 16px; display: flex; align-items: center;
    border-left: 8px solid #FF5722;
  }
  .check .box {
    flex: 0 0 56px; height: 56px; border-radius: 10px;
    background:#FFF; border: 4px solid #1A1A1A;
    margin-right: 22px; position: relative;
  }
  .check .box::after {
    content:""; position:absolute; top:6px; left:14px;
    width:14px; height:30px; border:solid #B71C1C;
    border-width: 0 6px 6px 0; transform:rotate(45deg);
  }
  .check h3 { font-size:30px; color:#FFEB3B; font-weight:900;}
  .check p { font-size: 22px; color:#E0E0E0; margin-top: 4px;}
  .check p code { background:#FFEB3B; color:#B71C1C; padding:2px 10px; border-radius:4px; font-weight:700;}

  .pull {
    margin-top: 24px; padding: 24px 28px;
    background: linear-gradient(135deg, #FF5722, #FFEB3B);
    color: #1A1A1A; border-radius: 18px;
    box-shadow: 8px 8px 0 #FFFFFF;
  }
  .pull h2 { font-size: 38px; font-weight: 900; line-height: 1.35; }
  .pull h2 b { color:#B71C1C;}
  .pull p { font-size: 22px; font-weight: 700; margin-top: 8px; }
  .cta {
    position:absolute; bottom:0; left:60px; right:60px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:24px; color:#FFEB3B; font-weight:700;
  }
  .pill { background:#FFEB3B; color:#B71C1C; padding:10px 22px; border-radius:100px; font-weight:800;}
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">CHECKLIST · 这周必做</span>
    <h1>立刻能做的<br><em>5 件事</em></h1>

    <div class="check"><div class="box"></div><div><h3>背 Dijkstra 堆优化模板</h3><p>对照本号 <code>普及组转提高组</code> 文档的最短路代码段</p></div></div>
    <div class="check"><div class="box"></div><div><h3>洛谷 P4779 / P3371 各 1 道</h3><p>最短路标准板子题 · <b>必拿满分</b></p></div></div>
    <div class="check"><div class="box"></div><div><h3>状压 DP 入门</h3><p>洛谷 <code>P1896</code> 互不侵犯 / <code>P3622</code> 动物园</p></div></div>
    <div class="check"><div class="box"></div><div><h3>并查集模板默写</h3><p>路径压缩 + 按秩合并 · <b>10 行内默熟</b></p></div></div>
    <div class="check"><div class="box"></div><div><h3>限时刷 CSP-S 2020 真题</h3><p>120 分钟模考 · 找出最弱模块下个月补</p></div></div>

    <div class="pull">
      <h2>从 J 到 S<br><b>本质是认知升级</b></h2>
      <p>3 个月补完 5 块盲区 · 初赛 70+ 是底线</p>
    </div>
  </div>
  <div class="cta">
    <span>#CSPS #提高组 #大连</span>
    <span class="pill">收藏开练</span>
  </div>
</body>
</html>
