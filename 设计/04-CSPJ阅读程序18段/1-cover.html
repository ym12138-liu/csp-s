<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSP-J 阅读程序 18 段 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(180deg, #1976D2 0%, #42A5F5 50%, #80DEEA 100%);
    color:#FFF; position:relative;
  }
  body::before {
    content:""; position:absolute; top:120px; right:-100px;
    width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, #FFEB3B 0%, rgba(255,235,59,0.2) 60%, transparent 80%);
  }
  body::after {
    content:""; position:absolute; bottom:200px; left:-80px;
    width: 320px; height: 320px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .tag {
    display:inline-block; background:#FFEB3B; color:#0D47A1; padding:14px 32px;
    border-radius:100px; font-size:30px; font-weight:900; letter-spacing:2px; margin-bottom: 50px;
    box-shadow: 6px 6px 0 #1A1A1A;
  }
  .num18 {
    font-size: 320px; font-weight: 900; line-height: 0.85;
    color: #FFEB3B;
    text-shadow: 12px 12px 0 #0D47A1;
    letter-spacing: -10px;
  }
  .title {
    font-size: 80px; font-weight: 900;
    color: #FFF; line-height: 1.05; margin-top: 24px;
    text-shadow: 5px 5px 0 #0D47A1;
  }
  .title em {
    font-style: normal;
    background: #FF5E62; padding: 0 14px; display: inline-block;
    box-shadow: 6px 6px 0 #1A1A1A;
  }
  .sub {
    margin-top: 30px;
    background: #FFF; color: #0D47A1; font-weight: 800;
    padding: 18px 24px; border-radius: 14px;
    border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #FFEB3B;
    font-size: 36px; display:inline-block; line-height: 1.4;
  }
  .sub b { color: #B71C1C; }
  .footer {
    position:absolute; bottom:0; left:70px; right:70px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:28px; color:#FFF; font-weight:800;
  }
  .stamp { background:#FFEB3B; color:#0D47A1; padding:14px 24px; border-radius:8px; transform:rotate(-5deg); font-weight:900;}
</style>
</head>
<body>
  <div class="safe">
    <div class="tag">阅读程序 · 算法清单</div>
    <div class="num18">18</div>
    <div class="title">
      段算法<br>
      背完<em>吊打 90%</em>
    </div>
    <div class="sub">
      6 年真题逐段标注<br>
      <b>每段对应一个经典模型</b>
    </div>
  </div>
  <div class="footer">
    <span>#CSP-J #阅读程序 #大连娃</span>
    <span class="stamp">收藏不亏</span>
  </div>
</body>
</html>
