<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>每日节奏 · 一周 5 件事</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #FFFFFF; color: #1A1A1A; }
  .top { position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: #0D47A1; display: flex; align-items: center; padding: 0 60px; }
  .top .badge { background: #FFFFFF; color: #0D47A1; padding: 12px 24px;
    border-radius: 8px; font-size: 28px; font-weight: 900; letter-spacing: 2px; }
  .top .right { margin-left: auto; color: #FFFFFF; font-size: 22px; font-weight: 800; }

  .h1-area { position: absolute; top: 200px; left: 60px; right: 60px; }
  .h1-area .pre { color: #2196F3; font-size: 26px; font-weight: 800; letter-spacing: 3px; margin-bottom: 10px; }
  .h1-area h1 { font-size: 64px; font-weight: 900; color: #0D47A1; line-height: 1.1; }
  .h1-area h1 b { background: #2196F3; color: #FFFFFF; padding: 0 12px; border-radius: 6px; }

  .timeline {
    position: absolute; top: 460px; left: 60px; right: 60px;
    padding-left: 130px;
  }
  .timeline::before {
    content: ""; position: absolute; left: 60px; top: 30px; bottom: 30px; width: 4px;
    background: #2196F3;
  }
  .day { background: #E3F2FD; border-radius: 14px; padding: 14px 20px; margin-bottom: 14px; position: relative; }
  .day::before {
    content: attr(data-d);
    position: absolute; left: -100px; top: 14px;
    width: 86px; height: 36px; border-radius: 8px;
    background: #0D47A1; color: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900;
  }
  .day h3 { font-size: 22px; font-weight: 900; color: #0D47A1; line-height: 1.2; }
  .day p { font-size: 16px; font-weight: 700; color: #424242; margin-top: 4px; line-height: 1.4; }
  .day p b { background: #FFFFFF; color: #0D47A1; padding: 0 6px; border-radius: 4px; }

  .pull { position: absolute; bottom: 200px; left: 60px; right: 60px;
    background: #0D47A1; color: #FFFFFF; padding: 22px 28px; border-radius: 16px; }
  .pull .lbl { font-size: 22px; font-weight: 900; color: #2196F3; letter-spacing: 2px; margin-bottom: 6px; }
  .pull h2 { font-size: 28px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background: #2196F3; padding: 0 8px; border-radius: 4px; }

  .footer { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
    background: #0D47A1; display: flex; align-items: center; justify-content: center; }
  .footer .txt { color: #FFFFFF; font-size: 22px; font-weight: 900; letter-spacing: 4px; }
</style>
</head>
<body>
  <div class="top">
    <span class="badge">DAILY · 一周节奏</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="h1-area">
    <div class="pre">// 平日 1 题 · 周末 1 套 · 月度 1 模考</div>
    <h1>每周 <b>5 件事</b><br>不堆不缺</h1>
  </div>

  <div class="timeline">
    <div class="day" data-d="周一-周四"><h3>每日 1 题</h3><p>30 分钟 1 题 + <b>15 分钟订正</b> · 主刷 OI Wiki 推荐题</p></div>
    <div class="day" data-d="周五"><h3>错题复盘</h3><p>把本周错的<b>整理成卡片</b> · 分类到 21 模块</p></div>
    <div class="day" data-d="周六"><h3>限时真题</h3><p>90 分钟 1 套 <b>历年真题</b> · 不查任何资料</p></div>
    <div class="day" data-d="周日"><h3>订正 + 模板</h3><p>每段阅读<b>识别算法</b> · 完善程序的空全部讲清</p></div>
    <div class="day" data-d="月底"><h3>1 次模考</h3><p>限时 + 不查资料 · <b>对照打标</b>看哪块还在丢分</p></div>
  </div>

  <div class="pull">
    <div class="lbl">CORE</div>
    <h2>不上课外班也行 · <b>真题 + 文档</b>自学就够</h2>
  </div>

  <div class="footer">
    <span class="txt">节奏稳 · 不焦虑</span>
  </div>
</body>
</html>
