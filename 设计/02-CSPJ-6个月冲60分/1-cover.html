<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>6 个月冲 CSP-J 60+ · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(160deg, #00BFA5 0%, #1DE9B6 50%, #FFF59D 100%);
    color: #1A1A1A; position:relative;
  }
  body::before {
    content:""; position:absolute; top:80px; left:80px;
    width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.3);
    filter: blur(2px);
  }
  body::after {
    content:""; position:absolute; bottom:200px; right:100px;
    width: 280px; height: 280px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, transparent 70%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .tag {
    display:inline-block; background:#1A1A1A; color:#1DE9B6; padding:14px 32px;
    border-radius:100px; font-size:30px; font-weight:800; letter-spacing:2px; margin-bottom:50px;
    box-shadow: 6px 6px 0 #00897B;
  }
  .pre { font-size:44px; font-weight:800; color:#004D40; margin-bottom: 18px; }
  .title {
    font-size: 168px; font-weight: 900; line-height: 0.95;
    color: #1A1A1A; letter-spacing: -4px;
    margin-bottom: 24px;
  }
  .title .month { color: #B71C1C; }
  .title .score {
    background:#FFEB3B; padding: 0 12px;
    box-shadow: 8px 8px 0 #1A1A1A;
    display: inline-block;
  }
  .sub {
    font-size: 40px; font-weight: 700; color: #1A1A1A;
    line-height: 1.4; margin-top: 30px;
    background: rgba(255,255,255,0.8); padding: 16px 24px;
    border-radius: 12px; display: inline-block;
    border: 4px solid #1A1A1A;
  }
  .sub b { color:#B71C1C; }
  .stamp-box {
    position:absolute; bottom:40px; right:0;
    background:#FF5E62; color:#FFF; padding: 22px 28px;
    border-radius: 18px; transform: rotate(-6deg);
    box-shadow: 6px 6px 0 #1A1A1A;
    font-weight:900; line-height:1.2;
  }
  .stamp-box .v { font-size: 44px; }
  .stamp-box .l { font-size: 22px; opacity: 0.95; }
  .footer {
    position:absolute; bottom:0; left:70px; right:70px;
    font-size:28px; color:#004D40; font-weight:800;
  }
</style>
</head>
<body>
  <div class="safe">
    <div class="tag">大连家长亲测 · 备考路线</div>
    <div class="pre">普娃 · 三年级起步</div>
    <div class="title">
      <span class="month">6</span> 个月<br>
      冲 <span class="score">60+</span>
    </div>
    <div class="sub">
      不报班 · <b>跟着这条线走</b><br>
      初赛过关无压力
    </div>
    <div class="stamp-box">
      <div class="l">实测覆盖</div>
      <div class="v">21 个模块</div>
    </div>
  </div>
  <div class="footer">#CSP-J #信奥启蒙 #大连娃</div>
</body>
</html>
