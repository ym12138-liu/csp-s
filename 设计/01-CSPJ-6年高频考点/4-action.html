<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSP-J 6年高频考点 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #1A1A1A; color:#FFF; position:relative; }
  body::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,94,98,0.4) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,235,59,0.3) 0%, transparent 40%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FFEB3B; color:#1A1A1A; padding:10px 26px; border-radius:8px; font-weight:800; font-size:28px;}
  h1 { font-size: 88px; font-weight: 900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#FF5E62; }
  .step {
    background:#2C2C2C; border-radius:18px; padding:24px 28px; margin-top:22px;
    border-left: 8px solid #FFEB3B;
    position:relative;
  }
  .step .n {
    position:absolute; top:-20px; left:-20px;
    width:64px; height:64px; border-radius:50%;
    background:#FF5E62; color:#FFF; font-weight:900; font-size:34px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 4px 4px 0 #FFEB3B;
  }
  .step h3 { font-size:38px; color:#FFEB3B; margin-bottom:10px; padding-left:50px; font-weight:900; }
  .step p { font-size:26px; line-height:1.5; color:#E0E0E0; }
  .step p code { background:#FFEB3B; color:#1A1A1A; padding:2px 10px; border-radius:6px; font-weight:700; }
  .quote {
    margin-top: 28px;
    padding: 20px 24px;
    background: linear-gradient(135deg, #FF5E62, #FF9966);
    border-radius:14px;
    box-shadow: 6px 6px 0 #FFEB3B;
  }
  .quote .lbl { font-size:22px; color:#FFF; opacity:0.85; letter-spacing:2px; font-weight:700; }
  .quote .txt { font-size:34px; color:#FFF; font-weight:900; line-height:1.4; margin-top:6px; text-shadow:2px 2px 0 #B71C1C; }
  .cta {
    position:absolute; bottom:0; left:60px; right:60px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:24px; color:#FFEB3B; font-weight:700;
  }
  .pill { background:#FFEB3B; color:#1A1A1A; padding:10px 20px; border-radius:100px; font-weight:800;}
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">ACTION · 这周开始</span>
    <h1>立刻能做的 <em>3 件事</em></h1>
    <div class="step">
      <div class="n">1</div>
      <h3>建错题本</h3>
      <p>按 TOP 10 考点编号建立 <code>+</code> 计数本，每错一题打一个加号。一个月后看哪个数最大。</p>
    </div>
    <div class="step">
      <div class="n">2</div>
      <h3>本周 3 道模板题</h3>
      <p>洛谷 <code>P2249</code> 二分查找｜<code>P1030</code> 二叉树遍历转换｜<code>P1048</code> 0-1 背包。</p>
    </div>
    <div class="step">
      <div class="n">3</div>
      <h3>限时 90 分钟</h3>
      <p>用 CSP-J 2024 真题做模考，对照本号汇总文档逐题打标，**找出 5 个最弱考点**。</p>
    </div>
    <div class="quote">
      <div class="lbl">大连家长一句话</div>
      <div class="txt">把这 10 个考点各练 30 题<br>初赛 60+ 就稳了</div>
    </div>
  </div>
  <div class="cta">
    <span>#信奥 #编程启蒙 #大连娃</span>
    <span class="pill">点赞收藏</span>
  </div>
</body>
</html>
