<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大类占比 · 算法 1 个人占了一大半</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #FFFFFF; color: #1A1A1A; }

  .top { position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: #0D47A1; display: flex; align-items: center; padding: 0 60px; }
  .top .badge { background: #FFFFFF; color: #0D47A1; padding: 12px 24px;
    border-radius: 8px; font-size: 28px; font-weight: 900; letter-spacing: 2px; }
  .top .right { margin-left: auto; color: #FFFFFF; font-size: 22px; font-weight: 800; }

  .h1-area { position: absolute; top: 180px; left: 60px; right: 60px; }
  .h1-area .pre { color: #2196F3; font-size: 24px; font-weight: 800; letter-spacing: 2px; }
  .h1-area h1 { font-size: 56px; font-weight: 900; color: #0D47A1;
    line-height: 1.1; margin-top: 6px; }
  .h1-area h1 b { background: #2196F3; color: #FFFFFF; padding: 0 10px; border-radius: 6px; }

  .bars {
    position: absolute; top: 380px; left: 60px;
    width: 360px;
  }
  .bar-row { margin-bottom: 18px; }
  .bar-row .lab {
    display: flex; justify-content: space-between;
    font-size: 22px; font-weight: 900; margin-bottom: 6px;
  }
  .bar-row .lab .name { color: #1A1A1A; }
  .bar-row .lab .pct { color: #0D47A1; }
  .bar-row .track {
    height: 24px; background: #E3F2FD; border-radius: 12px; overflow: hidden;
  }
  .bar-row .track > span { display: block; height: 100%; }
  .bar-row.b1 .track > span { background: #0D47A1; }
  .bar-row.b2 .track > span { background: #2196F3; }
  .bar-row.b3 .track > span { background: #64B5F6; }
  .bar-row.b4 .track > span { background: #90CAF9; }
  .bar-row.b5 .track > span { background: #BBDEFB; }

  .big-pct {
    position: absolute; top: 380px; right: 60px;
    width: 480px; height: 380px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0D47A1; color: #FFFFFF;
    border-radius: 24px;
  }
  .big-pct .num { font-size: 200px; font-weight: 900; line-height: 1; letter-spacing: -6px; }
  .big-pct .num sup { font-size: 80px; vertical-align: middle; margin-left: 10px; font-weight: 900; }
  .big-pct .ttl { font-size: 28px; font-weight: 900; margin-top: 12px; letter-spacing: 2px; }
  .legend .item {
    display: flex; align-items: center; padding: 14px 0;
    border-bottom: 2px solid #E3F2FD;
  }
  .legend .item:last-child { border-bottom: none; }
  .legend .swatch {
    flex: 0 0 28px; height: 28px; border-radius: 6px; margin-right: 16px;
  }
  .legend .label {
    flex: 1; font-size: 22px; font-weight: 900; color: #1A1A1A;
  }
  .legend .pct {
    font-size: 22px; font-weight: 900; color: #0D47A1;
  }
  .s1 { background: #0D47A1; }
  .s2 { background: #2196F3; }
  .s3 { background: #64B5F6; }
  .s4 { background: #90CAF9; }
  .s5 { background: #BBDEFB; }

  .trend {
    position: absolute; top: 850px; left: 60px; right: 60px;
    background: #E3F2FD; border-radius: 16px; padding: 22px 28px;
  }
  .trend .lbl { font-size: 22px; font-weight: 900; color: #2196F3;
    letter-spacing: 2px; margin-bottom: 8px; }
  .trend h3 { font-size: 26px; font-weight: 900; color: #0D47A1; line-height: 1.4; }
  .trend p { font-size: 20px; font-weight: 700; color: #424242; margin-top: 8px; line-height: 1.5; }
  .trend p b { background: #0D47A1; color: #FFFFFF; padding: 0 6px; border-radius: 4px; }

  .pull {
    position: absolute; bottom: 200px; left: 60px; right: 60px;
    background: #0D47A1; color: #FFFFFF;
    padding: 22px 28px; border-radius: 16px;
  }
  .pull .lbl { font-size: 22px; font-weight: 900; color: #2196F3;
    letter-spacing: 2px; margin-bottom: 6px; }
  .pull h2 { font-size: 28px; font-weight: 900; line-height: 1.4; }
  .pull h2 b { background: #2196F3; padding: 0 8px; border-radius: 4px; }

  .footer { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
    background: #0D47A1; display: flex; align-items: center; justify-content: center; }
  .footer .txt { color: #FFFFFF; font-size: 22px; font-weight: 900; letter-spacing: 4px; }
</style>
</head>
<body>
  <div class="top">
    <span class="badge">PROPORTION · 大类占比</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="h1-area">
    <div class="pre">// 7 套真题 · 模块归类后</div>
    <h1>算法这 1 类<br>占了 <b>大半张卷</b></h1>
  </div>

  <div class="bars">
    <div class="bar-row b1"><div class="lab"><span class="name">算法</span><span class="pct">63%</span></div><div class="track"><span style="width:100%"></span></div></div>
    <div class="bar-row b2"><div class="lab"><span class="name">数据结构</span><span class="pct">13%</span></div><div class="track"><span style="width:21%"></span></div></div>
    <div class="bar-row b3"><div class="lab"><span class="name">数学</span><span class="pct">11%</span></div><div class="track"><span style="width:17%"></span></div></div>
    <div class="bar-row b4"><div class="lab"><span class="name">计算机基础</span><span class="pct">8%</span></div><div class="track"><span style="width:13%"></span></div></div>
    <div class="bar-row b5"><div class="lab"><span class="name">程序语言</span><span class="pct">6%</span></div><div class="track"><span style="width:10%"></span></div></div>
  </div>

  <div class="big-pct">
    <div class="num">63<sup>%</sup></div>
    <div class="ttl">算法类占比</div>
  </div>

  <div class="trend">
    <div class="lbl">2024-2025 新趋势</div>
    <h3>DP 这一块·近年权重明显加重</h3>
    <p>一卷出 <b>2 段 DP</b> 已经成常态 · C++ 语法考查也在变深 · 2025 单选 3-4 题查语法细节</p>
  </div>

  <div class="pull">
    <div class="lbl">CORE</div>
    <h2>会算法 · 才能拿 <b>大半张卷</b> 的分</h2>
  </div>

  <div class="footer">
    <span class="txt">大类占比 · 一目了然</span>
  </div>
</body>
</html>
