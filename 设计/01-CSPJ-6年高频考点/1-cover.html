<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSP-J 6年高频考点 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(135deg, #FF5E62 0%, #FF9966 60%, #FFC371 100%);
    position: relative;
    color: #1A1A1A;
  }
  body::before {
    content: ""; position: absolute; top: -120px; right: -120px;
    width: 480px; height: 480px; border-radius: 50%;
    background: radial-gradient(circle, #FFF59D 0%, rgba(255,235,59,0) 70%);
  }
  body::after {
    content: ""; position: absolute; bottom: -100px; left: -100px;
    width: 380px; height: 380px; border-radius: 50%;
    background: radial-gradient(circle, #FFCDD2 0%, rgba(255,205,210,0) 70%);
  }
  .safe { position: absolute; top: 150px; bottom: 150px; left: 0; right: 0; padding: 0 70px; }
  .tag {
    display: inline-block; background: #1A1A1A; color: #FFEB3B;
    padding: 14px 32px; border-radius: 100px; font-size: 32px; font-weight: 800;
    letter-spacing: 2px; margin-bottom: 60px;
    box-shadow: 8px 8px 0 #B71C1C;
  }
  .title {
    font-size: 124px; font-weight: 900; line-height: 1.05;
    color: #1A1A1A; letter-spacing: -2px;
    text-shadow: 6px 6px 0 #FFFFFF;
    margin-bottom: 40px;
  }
  .title .hl {
    background: linear-gradient(transparent 60%, #FFEB3B 60%);
    padding: 0 8px;
  }
  .num {
    display: inline-block;
    color: #B71C1C; font-size: 200px; font-weight: 900;
    line-height: 1; vertical-align: middle;
  }
  .sub {
    font-size: 44px; font-weight: 700; color: #4A148C;
    line-height: 1.4; margin-top: 30px;
  }
  .footer {
    position: absolute; bottom: 0; left: 70px; right: 70px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 28px; color: #1A1A1A; font-weight: 700;
  }
  .stamp {
    background: #1A1A1A; color: #FFF; padding: 12px 24px; border-radius: 8px;
    font-size: 26px; transform: rotate(-4deg);
  }
  .badge-box {
    display: inline-block; background: #FFFFFF; padding: 18px 32px;
    border-radius: 16px; box-shadow: 6px 6px 0 #1A1A1A;
    border: 4px solid #1A1A1A; margin-top: 40px;
  }
  .badge-box .t { font-size: 30px; font-weight: 700; color: #B71C1C; }
  .badge-box .v { font-size: 56px; font-weight: 900; color: #1A1A1A; line-height: 1; }
</style>
</head>
<body>
  <div class="safe">
    <div class="tag">大连家长亲测 · 备考干货</div>
    <div class="title">
      原来 <span class="hl">60%</span> 的题<br>
      都在考<br>
      这 <span class="num">10</span> 个考点
    </div>
    <div class="sub">CSP-J 6 年真题逐题打标 · 看完不再瞎刷</div>
    <div class="badge-box">
      <div class="t">数据范围</div>
      <div class="v">2019 — 2024 / 600 分</div>
    </div>
  </div>
  <div class="footer">
    <span>#信奥备考 #CSP-J #大连</span>
    <span class="stamp">收藏防丢</span>
  </div>
</body>
</html>
