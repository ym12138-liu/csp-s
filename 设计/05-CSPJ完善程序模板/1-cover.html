<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSP-J 完善程序模板 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(160deg, #2E7D32 0%, #66BB6A 50%, #FFD54F 100%);
    color:#1A1A1A; position:relative;
  }
  body::before {
    content:""; position:absolute; top:100px; right:-80px;
    width: 360px; height: 360px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .tag {
    display:inline-block; background:#1A1A1A; color:#FFD54F; padding:14px 32px;
    border-radius:100px; font-size:30px; font-weight:900; letter-spacing:2px; margin-bottom:50px;
    box-shadow: 6px 6px 0 #2E7D32;
  }
  .pre { font-size:42px; font-weight:800; color:#1B5E20; margin-bottom:14px; }
  .num {
    font-size: 280px; font-weight: 900; line-height: 0.85;
    color: #FFFFFF;
    text-shadow: 12px 12px 0 #1B5E20;
  }
  .title {
    font-size: 96px; font-weight: 900;
    color: #1A1A1A; line-height: 1.05; margin-top: 28px;
  }
  .title em {
    font-style: normal;
    background: #FF5E62; color:#FFF;
    padding: 0 14px; display: inline-block;
    box-shadow: 6px 6px 0 #1A1A1A;
  }
  .sub {
    margin-top: 40px;
    background: #1A1A1A; color: #FFD54F;
    padding: 18px 24px; border-radius: 14px;
    box-shadow: 6px 6px 0 #FF5E62;
    font-size: 36px; font-weight: 800;
    display:inline-block; line-height: 1.4;
  }
  .sub b { color:#FFFFFF; }
  .footer {
    position:absolute; bottom:0; left:70px; right:70px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:28px; color:#1B5E20; font-weight:800;
  }
  .stamp { background:#1A1A1A; color:#FFD54F; padding:14px 24px; border-radius:8px; transform:rotate(-5deg); font-weight:900;}
</style>
</head>
<body>
  <div class="safe">
    <div class="tag">完善程序 · 模板就够</div>
    <div class="pre">不靠刷题量 · 靠肌肉记忆</div>
    <div class="num">8</div>
    <div class="title">
      个必背<br>
      <em>核心模板</em>
    </div>
    <div class="sub">
      抄一遍能写 · 抄三遍能默<br>
      <b>30 分稳拿 20+</b>
    </div>
  </div>
  <div class="footer">
    <span>#完善程序 #模板 #CSP-J</span>
    <span class="stamp">收藏抄写</span>
  </div>
</body>
</html>
