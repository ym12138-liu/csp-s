<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>信奥黑话词典 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: #0A0A0A;
    color: #FFEB3B;
    position:relative;
  }
  body::before {
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,235,59,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,235,59,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  body::after {
    content:""; position:absolute; bottom:0; left:0; right:0; height:50%;
    background: radial-gradient(ellipse at center bottom, rgba(255,235,59,0.18) 0%, transparent 70%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .tag {
    display:inline-block; background:#FFEB3B; color:#0A0A0A; padding:14px 32px;
    border-radius:6px; font-size:30px; font-weight:900; letter-spacing:3px; margin-bottom: 50px;
    font-family: "SF Mono", "Consolas", monospace;
    box-shadow: 0 0 30px rgba(255,235,59,0.6);
  }
  .pre {
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 36px; color: #00E5FF; font-weight: 900;
    margin-bottom: 18px;
  }
  .title {
    font-size: 168px; font-weight: 900; line-height: 0.95;
    color: #FFEB3B;
    text-shadow:
      0 0 20px rgba(255,235,59,0.5),
      6px 6px 0 #FF1744;
    letter-spacing: -4px;
  }
  .title em {
    font-style:normal; color:#FF1744;
    text-shadow: 6px 6px 0 #FFEB3B;
  }
  .sub {
    margin-top: 36px;
    font-family: "SF Mono", "Consolas", monospace;
    background:#FFEB3B; color:#0A0A0A;
    padding: 18px 24px; border-radius: 6px;
    font-size: 32px; font-weight: 900; display:inline-block;
    line-height: 1.4;
    box-shadow: 6px 6px 0 #FF1744;
  }
  .sub b { background:#0A0A0A; color:#FFEB3B; padding: 0 8px; }
  .footer {
    position:absolute; bottom:0; left:70px; right:70px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:28px; color:#FFEB3B; font-weight:800; font-family: "SF Mono", monospace;
  }
  .stamp {
    background:#FF1744; color:#FFEB3B;
    padding:14px 24px; border-radius:6px;
    transform:rotate(-5deg); font-weight:900;
    font-family: "SF Mono", monospace;
  }
  .num {
    position:absolute; top: 60px; right: 0;
    font-size: 200px; color: rgba(255,235,59,0.15);
    font-weight:900; line-height: 1;
    font-family: "SF Mono", monospace;
  }
</style>
</head>
<body>
  <div class="safe">
    <div class="num">{ 12 }</div>
    <div class="tag">$ DICT.cpp · OI 黑话</div>
    <div class="pre">// 一句话讲明白</div>
    <div class="title">
      DP / KMP /<br>
      <em>Trie</em>
    </div>
    <div class="sub">
      陪娃讨论 OI 不再尬聊<br>
      <b>家长收藏卡片</b>
    </div>
  </div>
  <div class="footer">
    <span># 词典 # 信奥 # 大连家长</span>
    <span class="stamp">{ 收藏 }</span>
  </div>
</body>
</html>
