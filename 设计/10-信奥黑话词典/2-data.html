<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>常错对照</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; overflow: hidden;
font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
background: #FFFFFF; color: #1A1A1A; }
.top { position: absolute; top: 0; left: 0; right: 0; height: 150px;
background: #0D47A1; display: flex; align-items: center; padding: 0 60px; }
.top .badge { background: #FFFFFF; color: #0D47A1; padding: 12px 24px;
border-radius: 8px; font-size: 28px; font-weight: 900; }
.top .right { margin-left: auto; color: #FFFFFF; font-size: 22px; font-weight: 800; }
.h1 { position: absolute; top: 200px; left: 60px; right: 60px; }
.h1 .pre { color: #2196F3; font-size: 26px; font-weight: 800; letter-spacing: 3px; margin-bottom: 10px; }
.h1 h1 { font-size: 60px; font-weight: 900; color: #0D47A1; line-height: 1.1; }
.h1 h1 b { background: #2196F3; color: #FFFFFF; padding: 0 12px; border-radius: 6px; }
.pairs { position: absolute; top: 380px; left: 60px; right: 60px; }
.pair { display: flex; align-items: stretch; margin-bottom: 16px; }
.pair .left, .pair .right {
flex: 1; padding: 14px 18px; border-radius: 10px; }
.pair .left { background: #E3F2FD; margin-right: 12px; }
.pair .right { background: #FFEBEE; }
.pair h3 { font-size: 22px; font-weight: 900; color: #0D47A1; }
.pair .right h3 { color: #B71C1C; }
.pair p { font-size: 16px; color: #424242; margin-top: 4px; font-weight: 700; }
.pair p b { background: #FFF59D; padding: 0 4px; color: #B71C1C; border-radius: 3px; }
.pull { position: absolute; bottom: 200px; left: 60px; right: 60px;
background: #0D47A1; color: #FFFFFF; padding: 22px 28px; border-radius: 16px; }
.pull h2 { font-size: 28px; font-weight: 900; line-height: 1.4; }
.pull h2 b { background: #2196F3; padding: 0 8px; border-radius: 4px; }
.footer { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
background: #0D47A1; display: flex; align-items: center; justify-content: center; }
.footer .txt { color: #FFFFFF; font-size: 22px; font-weight: 900; letter-spacing: 4px; }
</style></head><body>
<div class="top"><span class="badge">CONFUSE · 易混对照</span><span class="right">因诺信奥 · 大连</span></div>
<div class="h1"><div class="pre">// 这几对家长背一下</div><h1>容易<b>搞混</b><br>4 对术语</h1></div>
<div class="pairs">
<div class="pair">
<div class="left"><h3>子串</h3><p>必须 <b>连续</b> · "abc" 是 "xabcx" 的子串</p></div>
<div class="right"><h3>子序列</h3><p>可以 <b>挑着选</b> · "abc" 是 "axbxc" 的子序列</p></div>
</div>
<div class="pair">
<div class="left"><h3>DFS</h3><p>用栈 / 递归找一条路径或全排列</p></div>
<div class="right"><h3>BFS</h3><p>用队列找最短步数或最近</p></div>
</div>
<div class="pair">
<div class="left"><h3>前缀和</h3><p>查询区间的<b>和</b> · 不修改</p></div>
<div class="right"><h3>差分</h3><p>修改区间的<b>值</b> · 不查询</p></div>
</div>
<div class="pair">
<div class="left"><h3>Dijkstra</h3><p><b>不能</b>处理负权 · 稳 O((n+m) log n)</p></div>
<div class="right"><h3>SPFA</h3><p>能处理负权 · 但<b>易卡</b>到 O(nm)</p></div>
</div>
</div>
<div class="pull"><h2>家长一句话 · <b>"听不懂没关系 · 别说错就行"</b></h2></div>
<div class="footer"><span class="txt">陪娃讨论 OI 不尴聊</span></div>
</body></html>
