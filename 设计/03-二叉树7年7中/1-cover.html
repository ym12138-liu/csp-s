<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二叉树 7 年 7 中 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(165deg, #6A1B9A 0%, #AB47BC 45%, #FF7043 100%);
    color: #FFF; position:relative;
  }
  body::before {
    content:""; position:absolute; bottom:120px; left:-80px;
    width: 360px; height: 360px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,193,7,0.4) 0%, transparent 70%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .tag {
    display:inline-block; background:#FFEB3B; color:#4A148C; padding:14px 32px;
    border-radius:100px; font-size:30px; font-weight:900; letter-spacing:2px; margin-bottom: 50px;
    box-shadow: 6px 6px 0 #1A1A1A;
  }
  .nine {
    font-size: 280px; font-weight: 900; line-height: 0.85;
    color: #FFEB3B;
    text-shadow: 10px 10px 0 #1A1A1A;
    letter-spacing: -10px;
  }
  .nine .slash { color: #FFF; }
  .title {
    font-size: 92px; font-weight: 900;
    color: #FFF; line-height: 1.05; margin-top: 30px;
    text-shadow: 5px 5px 0 #4A148C;
  }
  .title .hl {
    background: #FF7043; padding: 0 14px;
    box-shadow: 6px 6px 0 #1A1A1A;
    display: inline-block;
  }
  .sub {
    margin-top: 36px;
    font-size: 38px; font-weight: 800;
    background: #FFF; color: #1A1A1A;
    padding: 18px 24px; border-radius: 14px;
    border: 4px solid #1A1A1A;
    box-shadow: 6px 6px 0 #FFEB3B;
    display: inline-block;
    line-height: 1.4;
  }
  .sub b { color: #B71C1C; }
  .footer {
    position:absolute; bottom:0; left:70px; right:70px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:28px; color:#FFF; font-weight:800;
  }
  .stamp {
    background:#FFEB3B; color:#4A148C; padding:14px 24px; border-radius:8px;
    transform:rotate(-5deg); font-weight:900;
  }
</style>
</head>
<body>
  <div class="safe">
    <div class="tag">单选必拿题 · 4 分稳了</div>
    <div class="nine">7<span class="slash">/</span>7</div>
    <div class="title">
      <span class="hl">二叉树</span><br>
      性质题
    </div>
    <div class="sub">
      2019-2025 <b>每一年都考</b><br>
      不会的话基本与初赛 60+ 无缘
    </div>
  </div>
  <div class="footer">
    <span>#CSP-J #信奥必背</span>
    <span class="stamp">收藏背诵</span>
  </div>
</body>
</html>
