<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二叉树 · 看到这题就是送分</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1B5E20; color: #FFFFFF; }
  .top { position: absolute; top: 60px; left: 60px; right: 60px;
    display: flex; align-items: center; }
  .top .badge { background: #FCE4EC; color: #1B5E20; padding: 8px 18px;
    border-radius: 6px; font-size: 22px; font-weight: 900; }
  .top .right { margin-left: auto; color: #FFE082; font-size: 20px; font-weight: 800; }

  .h1-area { position: absolute; top: 160px; left: 80px; right: 80px; }
  .h1-area h1 { font-size: 60px; font-weight: 900; color: #FFFFFF; line-height: 1.15; }
  .h1-area h1 b { background: #FCE4EC; color: #1B5E20; padding: 0 12px; }

  .formula-card {
    position: absolute; top: 360px; left: 80px; right: 80px;
    background: rgba(255,255,255,0.06); border: 2px dashed #FFE082;
    padding: 20px 24px; border-radius: 8px;
  }
  .formula-card .lbl { font-size: 22px; color: #FFE082; font-weight: 900;
    letter-spacing: 1px; margin-bottom: 10px; }
  .formula-card h3 { font-size: 28px; color: #FFFFFF; font-weight: 900;
    margin-bottom: 10px; }
  .formula-card p { font-size: 22px; color: #FFFFFF; line-height: 1.8;
    font-weight: 500; }
  .formula-card .code {
    background: #FFE082; color: #1B5E20;
    padding: 0 8px; font-weight: 900; border-radius: 3px;
    font-family: Consolas, monospace;
  }

  .steps-area { position: absolute; top: 720px; left: 80px; right: 80px; }
  .steps-area .lbl { font-size: 26px; color: #FFE082; font-weight: 900;
    letter-spacing: 1px; margin-bottom: 14px; }
  .steps-area .step {
    display: flex; align-items: flex-start;
    padding: 10px 0; border-bottom: 1px dashed rgba(255,255,255,0.2);
  }
  .steps-area .step:last-child { border-bottom: none; }
  .steps-area .num {
    flex: 0 0 36px; height: 36px; border-radius: 50%;
    background: #FF6B9D; color: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; margin-right: 14px;
  }
  .steps-area .txt { flex: 1; font-size: 22px; color: #FFFFFF; line-height: 1.6;
    font-weight: 500; padding-top: 4px; }
  .steps-area .high { background: #FFE082; color: #1B5E20; padding: 0 6px; font-weight: 900; }
  .steps-area .circle { color: #FF6B9D; border-bottom: 3px solid #FF6B9D;
    padding: 0 6px; font-weight: 900; }

  .bottom { position: absolute; bottom: 80px; left: 80px; right: 80px;
    background: rgba(252, 228, 236, 0.15); border-left: 6px solid #FF6B9D;
    padding: 16px 22px; border-radius: 4px; }
  .bottom .ttl { font-size: 22px; color: #FFE082; font-weight: 900; margin-bottom: 4px; }
  .bottom .txt { font-size: 22px; color: #FFFFFF; font-weight: 700; line-height: 1.5; }
  .bottom .txt b { color: #FFE082; }
</style>
</head>
<body>
  <div class="top">
    <span class="badge">老师手记 · 三遍历口诀</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="h1-area">
    <h1>看到这题<br>就是 <b>送 4 分</b></h1>
  </div>

  <div class="formula-card">
    <div class="lbl">★ 完全二叉树性质</div>
    <h3>3 个公式背一句话就行</h3>
    <p>高度 H = <span class="code">floor(log₂ n) + 1</span></p>
    <p>节点 i 的左孩子 = <span class="code">2i</span> · 右孩子 = <span class="code">2i+1</span></p>
    <p>叶子数 ≈ <span class="code">n - floor(n/2)</span></p>
  </div>

  <div class="steps-area">
    <div class="lbl">★ 遍历转换 · 三步法</div>
    <div class="step">
      <div class="num">1</div>
      <div class="txt">先看 <span class="circle">前序 / 后序</span> 第一个或最后一个 = 根</div>
    </div>
    <div class="step">
      <div class="num">2</div>
      <div class="txt">在 <span class="circle">中序</span> 找这个根 · 把序列<span class="high">切成左右两段</span></div>
    </div>
    <div class="step">
      <div class="num">3</div>
      <div class="txt"><span class="circle">递归</span> 到左右子树 · 重复 1-2 直到结束</div>
    </div>
  </div>

  <div class="bottom">
    <div class="ttl">★ 一句话口诀 ★</div>
    <div class="txt"><b>"中序找根分左右,前后序认根"</b> — 5 道题就有手感</div>
  </div>
</body>
</html>
