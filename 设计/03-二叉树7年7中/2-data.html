<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二叉树 7 年 7 中 · 数据</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background: #FFF3E0; color:#1A1A1A; position:relative; }
  body::before { content:""; position:absolute; top:0; height:80px; left:0; right:0; background:linear-gradient(90deg,#6A1B9A,#FF7043); }
  body::after  { content:""; position:absolute; bottom:0; height:80px; left:0; right:0; background:linear-gradient(90deg,#FF7043,#6A1B9A); }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#6A1B9A; color:#FFEB3B; padding:10px 26px; border-radius:8px; font-weight:800; font-size:28px; }
  h1 { font-size: 70px; font-weight: 900; margin-top:18px; line-height:1.1; color:#4A148C; }
  h1 em { font-style:normal; background:linear-gradient(transparent 60%, #FFEB3B 60%); padding:0 6px; }
  .yrs {
    margin-top: 30px;
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px;
  }
  .yr {
    background:#FFF; border-radius: 12px; text-align:center; padding: 14px 0;
    border: 3px solid #1A1A1A; box-shadow: 4px 4px 0 #6A1B9A;
  }
  .yr .y { font-size: 24px; font-weight: 900; color: #6A1B9A; }
  .yr .v { font-size: 36px; font-weight: 900; color: #B71C1C; line-height: 1; margin-top: 4px; }
  .topics {
    margin-top: 30px;
  }
  .topic {
    display: flex; align-items: center;
    background: #FFF; border-radius: 14px;
    padding: 16px 20px; margin-bottom: 12px;
    border: 3px solid #1A1A1A; box-shadow: 5px 5px 0 #FF7043;
  }
  .topic .num {
    flex: 0 0 56px; height: 56px; border-radius: 50%;
    background: #6A1B9A; color: #FFEB3B; font-weight: 900; font-size: 28px;
    display:flex; align-items:center; justify-content:center;
    margin-right: 18px;
  }
  .topic .name { font-size: 28px; font-weight: 800; color: #1A1A1A; flex: 1; }
  .topic .tag { font-size: 22px; font-weight: 700; color: #FFF; background: #FF7043; padding: 4px 14px; border-radius: 6px; }
  .key {
    margin-top: 28px; background: #1A1A1A; color: #FFEB3B;
    padding: 22px 26px; border-radius: 16px;
    box-shadow: 8px 8px 0 #FF7043;
  }
  .key .lbl { font-size: 22px; letter-spacing: 2px; font-weight: 700; opacity: .85; }
  .key .txt { font-size: 32px; color: #FFF; font-weight: 800; line-height: 1.4; margin-top: 6px; }
  .key .txt b { color: #FFEB3B; }
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">FREQUENCY · 历年命中</span>
    <h1>每一年<em>都有它</em>的身影</h1>
    <div class="yrs">
      <div class="yr"><div class="y">2019</div><div class="v">中</div></div>
      <div class="yr"><div class="y">2020</div><div class="v">中</div></div>
      <div class="yr"><div class="y">2021</div><div class="v">中</div></div>
      <div class="yr"><div class="y">2022</div><div class="v">中</div></div>
      <div class="yr"><div class="y">2023</div><div class="v">中</div></div>
      <div class="yr"><div class="y">2024</div><div class="v">中</div></div>
      <div class="yr"><div class="y">2025</div><div class="v">中</div></div>
    </div>
    <div class="topics">
      <div class="topic"><div class="num">1</div><div class="name">完全二叉树高度 · 节点数</div><span class="tag">必背</span></div>
      <div class="topic"><div class="num">2</div><div class="name">三种遍历转换（前 中 后）</div><span class="tag">必背</span></div>
      <div class="topic"><div class="num">3</div><div class="name">数组顺序存储 · 父子下标</div><span class="tag">高频</span></div>
      <div class="topic"><div class="num">4</div><div class="name">叶子节点数计算</div><span class="tag">2025</span></div>
      <div class="topic"><div class="num">5</div><div class="name">三叉树 / 完全 k 叉树</div><span class="tag">2023</span></div>
    </div>
    <div class="key">
      <div class="lbl">DATA · 7 年统计</div>
      <div class="txt">单选 1-2 题 · 累计 <b>≈ 16 分</b><br>不学就送分给别人</div>
    </div>
  </div>
</body>
</html>
