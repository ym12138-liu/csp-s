<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二叉树 · 7 年命中表</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1B5E20; color: #FFFFFF; }
  .top { position: absolute; top: 60px; left: 60px; right: 60px;
    display: flex; align-items: center; }
  .top .badge { background: #FCE4EC; color: #1B5E20; padding: 8px 18px;
    border-radius: 6px; font-size: 22px; font-weight: 900; }
  .top .right { margin-left: auto; color: #FFE082; font-size: 20px; font-weight: 800; }

  .h1-area { position: absolute; top: 160px; left: 80px; right: 80px; }
  .h1-area h1 { font-size: 56px; font-weight: 900; color: #FFFFFF; line-height: 1.15; }
  .h1-area h1 b { background: #FCE4EC; color: #1B5E20; padding: 0 12px; }

  .table { position: absolute; top: 380px; left: 80px; right: 80px;
    background: rgba(255,255,255,0.06); border-radius: 8px; padding: 18px; }
  .table table { width: 100%; border-collapse: collapse; }
  .table th { color: #FFE082; font-size: 22px; font-weight: 900; padding: 10px 4px; text-align: left;
    border-bottom: 2px solid #FFE082; }
  .table th.year { text-align: center; width: 56px; }
  .table td { color: #FFFFFF; font-size: 18px; padding: 12px 4px;
    border-bottom: 1px dashed rgba(255,255,255,0.2); }
  .table td:first-child { font-weight: 700; }
  .table td.hit { text-align: center; color: #FF6B9D; font-weight: 900; font-size: 22px; }

  .body-area { position: absolute; top: 980px; left: 80px; right: 80px; }
  .body-area .star { color: #FF6B9D; }
  .body-area .lbl { font-size: 24px; font-weight: 900; color: #FFE082; margin-bottom: 12px; }
  .body-area p { font-size: 22px; color: #FFFFFF; line-height: 1.7; font-weight: 500; }
  .body-area .high { background: #FFE082; color: #1B5E20; padding: 0 6px; font-weight: 900; }
  .body-area .circle { color: #FF6B9D; border-bottom: 3px solid #FF6B9D; padding: 0 6px; font-weight: 900; }

  .bottom { position: absolute; bottom: 80px; left: 80px; right: 80px;
    background: rgba(252, 228, 236, 0.15); border-left: 6px solid #FF6B9D;
    padding: 16px 22px; border-radius: 4px; }
  .bottom .ttl { font-size: 22px; color: #FFE082; font-weight: 900; margin-bottom: 4px; }
  .bottom .txt { font-size: 22px; color: #FFFFFF; font-weight: 700; line-height: 1.5; }
  .bottom .txt b { color: #FFE082; }
</style>
</head>
<body>
  <div class="top">
    <span class="badge">老师手记 · 7 年命中表</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="h1-area">
    <h1>每一年<br>都有它的<b>身影</b></h1>
  </div>

  <div class="table">
    <table>
      <tr>
        <th>考点</th>
        <th class="year">19</th><th class="year">20</th><th class="year">21</th>
        <th class="year">22</th><th class="year">23</th><th class="year">24</th>
        <th class="year">25</th>
      </tr>
      <tr><td>完全二叉树高度 / 节点数</td>
        <td class="hit">★</td><td class="hit">★</td><td class="hit">★</td>
        <td></td><td class="hit">★</td><td></td><td></td>
      </tr>
      <tr><td>三种遍历转换 (前 中 后)</td>
        <td class="hit">★</td><td></td><td class="hit">★</td>
        <td class="hit">★</td><td class="hit">★</td><td class="hit">★</td><td class="hit">★</td>
      </tr>
      <tr><td>数组顺序存储 / 父子下标</td>
        <td></td><td></td><td></td>
        <td></td><td class="hit">★</td><td class="hit">★</td><td></td>
      </tr>
      <tr><td>叶子节点数计算</td>
        <td></td><td></td><td></td>
        <td></td><td></td><td></td><td class="hit">★</td>
      </tr>
      <tr><td>三叉树 / 完全 k 叉树</td>
        <td></td><td></td><td></td>
        <td></td><td class="hit">★</td><td></td><td></td>
      </tr>
    </table>
  </div>

  <div class="body-area">
    <div class="lbl"><span class="star">★</span> 一句话总结</div>
    <p><span class="circle">中序找根分左右</span>,前后序认根。</p>
    <p>三遍历转换会了 = <span class="high">7 年单选稳吃 8 分</span>。</p>
  </div>

  <div class="bottom">
    <div class="ttl">★ 想清楚 ★</div>
    <div class="txt">不是题难,是<b>不识考法</b>。识完套路 2 分钟一题</div>
  </div>
</body>
</html>
