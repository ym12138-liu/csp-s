<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二叉树 7 年 7 中 · 行动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { background:#1A1A1A; color:#FFF; position:relative; }
  body::before {
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 30% 20%, rgba(171,71,188,0.5) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255,112,67,0.4) 0%, transparent 50%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 60px; }
  .h-tag { display:inline-block; background:#FF7043; color:#FFF; padding:10px 26px; border-radius:8px; font-weight:800; font-size:28px;}
  h1 { font-size: 84px; font-weight: 900; margin-top:18px; line-height:1.05; }
  h1 em { font-style:normal; color:#FFEB3B; }

  .ex {
    background:#FFF; color:#1A1A1A; border-radius: 18px;
    padding: 22px 26px; margin-top: 22px;
    border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #FF7043;
  }
  .ex .n { display:inline-block; background:#6A1B9A; color:#FFEB3B; padding:6px 18px; border-radius:8px; font-weight:900; font-size:26px;}
  .ex h3 { font-size:32px; font-weight:900; margin-top:8px; color:#1A1A1A; }
  .ex code { background:#FFEB3B; color:#1A1A1A; padding:2px 12px; border-radius:6px; font-weight:800; font-family:"PingFang SC", monospace;}
  .ex p { font-size:24px; line-height:1.5; color:#424242; margin-top:6px;}
  .ex p b { color:#B71C1C; }

  .pull {
    margin-top: 26px; padding: 24px 28px;
    background: linear-gradient(135deg, #FFEB3B, #FF7043);
    color:#1A1A1A; border-radius: 18px;
    box-shadow: 8px 8px 0 #6A1B9A;
  }
  .pull h2 { font-size:42px; font-weight:900; line-height:1.3; }
  .pull h2 b { color: #6A1B9A; }
  .pull p { font-size: 24px; font-weight:700; margin-top:8px; }
  .cta {
    position:absolute; bottom:0; left:60px; right:60px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:24px; color:#FFEB3B; font-weight:700;
  }
  .pill { background:#FFEB3B; color:#1A1A1A; padding:10px 22px; border-radius:100px; font-weight:800;}
</style>
</head>
<body>
  <div class="safe">
    <span class="h-tag">PRACTICE · 3 道必刷</span>
    <h1>背完模板<br>立刻 <em>开练</em></h1>

    <div class="ex">
      <span class="n">题 1</span>
      <h3>洛谷 <code>P1030</code> · 求先序遍历</h3>
      <p>给定 <b>中序 + 后序</b> · 输出前序<br>三步法练手 · 5 分钟出结果</p>
    </div>
    <div class="ex">
      <span class="n">题 2</span>
      <h3>洛谷 <code>P1827</code> · 美国血统</h3>
      <p>给定<b>前序 + 中序</b> · 输出后序<br>同款套路 · 反过来练一次</p>
    </div>
    <div class="ex">
      <span class="n">题 3</span>
      <h3>历年真题 · CSP-J 2024 单选 12</h3>
      <p>前+中→后 标准题 · 限时 <b>2 分钟</b>做完<br>对照本号 2024 分析订正</p>
    </div>

    <div class="pull">
      <h2>记住口诀<br><b>"中序找根分左右"</b></h2>
      <p>这一题 4 分 · 三个月之内别再丢</p>
    </div>
  </div>
  <div class="cta">
    <span>#二叉树 #信奥 #大连娃</span>
    <span class="pill">收藏开练</span>
  </div>
</body>
</html>
