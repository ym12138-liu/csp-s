<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二叉树 · 3 道必练</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1B5E20; color: #FFFFFF; }
  .top { position: absolute; top: 60px; left: 60px; right: 60px;
    display: flex; align-items: center; }
  .top .badge { background: #FCE4EC; color: #1B5E20; padding: 8px 18px;
    border-radius: 6px; font-size: 22px; font-weight: 900; }
  .top .right { margin-left: auto; color: #FFE082; font-size: 20px; font-weight: 800; }

  .h1-area { position: absolute; top: 160px; left: 80px; right: 80px; }
  .h1-area h1 { font-size: 60px; font-weight: 900; color: #FFFFFF; line-height: 1.15; }
  .h1-area h1 b { background: #FCE4EC; color: #1B5E20; padding: 0 12px; }

  .qs { position: absolute; top: 380px; left: 80px; right: 80px; }
  .q-card {
    background: rgba(255,255,255,0.06); border-left: 6px solid #FFE082;
    padding: 16px 22px; margin-bottom: 16px; border-radius: 4px;
  }
  .q-card .num { display: inline-block;
    background: #FF6B9D; color: #FFFFFF;
    padding: 4px 14px; border-radius: 6px;
    font-size: 18px; font-weight: 900; margin-bottom: 8px; }
  .q-card h3 { font-size: 26px; color: #FFFFFF; font-weight: 900;
    margin-bottom: 6px; }
  .q-card h3 .code {
    background: #FFE082; color: #1B5E20;
    padding: 2px 10px; border-radius: 4px;
    font-family: Consolas, monospace;
  }
  .q-card p { font-size: 20px; color: #FFFFFF; line-height: 1.6;
    font-weight: 500; opacity: 0.92; }
  .q-card p .high { background: #FFE082; color: #1B5E20; padding: 0 6px; font-weight: 900; }
  .q-card p .circle { color: #FF6B9D; border-bottom: 2px solid #FF6B9D;
    padding: 0 4px; font-weight: 900; }

  .bottom { position: absolute; bottom: 80px; left: 80px; right: 80px;
    background: rgba(252, 228, 236, 0.15); border-left: 6px solid #FF6B9D;
    padding: 16px 22px; border-radius: 4px; }
  .bottom .ttl { font-size: 22px; color: #FFE082; font-weight: 900; margin-bottom: 4px; }
  .bottom .txt { font-size: 22px; color: #FFFFFF; font-weight: 700; line-height: 1.5; }
  .bottom .txt b { color: #FFE082; }
</style>
</head>
<body>
  <div class="top">
    <span class="badge">老师手记 · 3 道必练</span>
    <span class="right">因诺信奥 · 大连</span>
  </div>

  <div class="h1-area">
    <h1>背完模板<br>立刻 <b>开练</b></h1>
  </div>

  <div class="qs">
    <div class="q-card">
      <div class="num">题 1</div>
      <h3>洛谷 <span class="code">P1030</span> · 求先序遍历</h3>
      <p>给定<span class="circle">中序 + 后序</span> · 输出前序<br>
      三步法练手 · <span class="high">5 分钟出结果</span></p>
    </div>
    <div class="q-card">
      <div class="num">题 2</div>
      <h3>洛谷 <span class="code">P1827</span> · 美国血统</h3>
      <p>给定<span class="circle">前序 + 中序</span> · 输出后序<br>
      同款套路 · 反过来练一次</p>
    </div>
    <div class="q-card">
      <div class="num">题 3</div>
      <h3>历年真题 · CSP-J 2024 单选 12</h3>
      <p>前 + 中 → 后 标准题 · 限时 <span class="high">2 分钟</span> 做完<br>
      对照本号 2024 分析订正</p>
    </div>
  </div>

  <div class="bottom">
    <div class="ttl">★ 记住这句口诀 ★</div>
    <div class="txt"><b>"中序找根分左右"</b> — 这 4 分 · 三个月之内别再丢</div>
  </div>
</body>
</html>
