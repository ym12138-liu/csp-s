<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSP-S 状压 DP 拆解 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(160deg, #1A237E 0%, #5E35B1 50%, #AA00FF 100%);
    color:#FFF; position:relative;
  }
  body::before {
    content:""; position:absolute; top:120px; right:-100px;
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(198,255,0,0.4) 0%, transparent 70%);
  }
  body::after {
    content:""; position:absolute; bottom:200px; left:-100px;
    width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .tag {
    display:inline-block; background:#C6FF00; color:#1A237E; padding:14px 32px;
    border-radius:100px; font-size:30px; font-weight:900; letter-spacing:2px; margin-bottom:50px;
    box-shadow: 6px 6px 0 #1A1A1A;
  }
  .pre {
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 36px; color: #C6FF00; font-weight: 900;
    margin-bottom: 18px;
    background: rgba(0,0,0,0.4); padding: 6px 16px; border-radius: 8px;
    display:inline-block;
  }
  .title {
    font-size: 200px; font-weight: 900; line-height: 0.9;
    color: #FFF; letter-spacing: -8px;
    text-shadow: 8px 8px 0 #1A237E;
  }
  .title em {
    font-style:normal;
    background: #C6FF00; color: #1A237E;
    padding: 0 16px; display:inline-block;
    box-shadow: 8px 8px 0 #1A1A1A;
  }
  .sub {
    margin-top: 36px;
    background: #1A1A1A; color: #C6FF00;
    padding: 18px 24px; border-radius: 14px;
    box-shadow: 6px 6px 0 #C6FF00;
    font-size: 32px; font-weight: 800; display:inline-block;
    line-height: 1.4;
    border: 4px solid #C6FF00;
  }
  .sub b { color:#FFF; }
  .footer {
    position:absolute; bottom:0; left:70px; right:70px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:28px; color:#C6FF00; font-weight:800;
  }
  .stamp { background:#C6FF00; color:#1A237E; padding:14px 24px; border-radius:8px; transform:rotate(-5deg); font-weight:900;}
</style>
</head>
<body>
  <div class="safe">
    <div class="tag">CSP-S 难度天花板 · 卷王专属</div>
    <div class="pre">f[s][i] = max(f[s^(1&lt;&lt;i)][j] + cost)</div>
    <div class="title">
      状压<br>
      <em>DP</em>
    </div>
    <div class="sub">
      2020 / 2024 真题硬核拆解<br>
      <b>看完别再被它锤</b>
    </div>
  </div>
  <div class="footer">
    <span>#CSPS #DP #大连卷王</span>
    <span class="stamp">收藏拆解</span>
  </div>
</body>
</html>
