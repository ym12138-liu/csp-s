<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>4 年最短路真题对照</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; overflow: hidden;
font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
background: #FFFFFF; color: #1A1A1A; }
.top { position: absolute; top: 0; left: 0; right: 0; height: 150px;
background: #0D47A1; display: flex; align-items: center; padding: 0 60px; }
.top .badge { background: #FFFFFF; color: #0D47A1; padding: 12px 24px;
border-radius: 8px; font-size: 28px; font-weight: 900; }
.top .right { margin-left: auto; color: #FFFFFF; font-size: 22px; font-weight: 800; }
.h1 { position: absolute; top: 200px; left: 60px; right: 60px; }
.h1 .pre { color: #2196F3; font-size: 26px; font-weight: 800; letter-spacing: 3px; margin-bottom: 10px; }
.h1 h1 { font-size: 60px; font-weight: 900; color: #0D47A1; line-height: 1.1; }
.h1 h1 b { background: #2196F3; color: #FFFFFF; padding: 0 12px; border-radius: 6px; }
.list { position: absolute; top: 380px; left: 60px; right: 60px; }
.row { display: flex; align-items: center; padding: 14px 20px;
margin-bottom: 12px; border-radius: 12px;
background: #FFFFFF; border: 3px solid #E3F2FD; }
.row:nth-child(odd) { background: #F5F9FF; }
.row .yr { flex: 0 0 90px; font-size: 24px; font-weight: 900; color: #0D47A1;
text-align: center; padding: 8px 0; background: #E3F2FD; border-radius: 8px; margin-right: 16px; }
.row .body { flex: 1; }
.row .body h3 { font-size: 22px; font-weight: 900; color: #0D47A1; line-height: 1.2; }
.row .body p { font-size: 16px; color: #424242; margin-top: 2px; font-weight: 700; }
.row .score { flex: 0 0 90px; text-align: right;
font-size: 22px; font-weight: 900; color: #B71C1C; }
.pull { position: absolute; bottom: 200px; left: 60px; right: 60px;
background: #0D47A1; color: #FFFFFF; padding: 22px 28px; border-radius: 16px; }
.pull h2 { font-size: 28px; font-weight: 900; line-height: 1.4; }
.pull h2 b { background: #2196F3; padding: 0 8px; border-radius: 4px; }
.footer { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
background: #0D47A1; display: flex; align-items: center; justify-content: center; }
.footer .txt { color: #FFFFFF; font-size: 22px; font-weight: 900; letter-spacing: 4px; }
</style></head><body>
<div class="top"><span class="badge">RANK · 4 年真题</span><span class="right">因诺信奥 · 大连</span></div>
<div class="h1"><div class="pre">// 题型轮换 · 套路不变</div><h1>4 年 4 题<br><b>都是 Dijkstra</b></h1></div>
<div class="list">
<div class="row"><div class="yr">2020</div><div class="body"><h3>单选 14 · 复杂度计算</h3><p>堆优化 = O((n+m) log n)</p></div><div class="score">2 分</div></div>
<div class="row"><div class="yr">2021</div><div class="body"><h3>单选 15 · 有向图最短路</h3><p>简单图手算就能拿满</p></div><div class="score">2 分</div></div>
<div class="row"><div class="yr">2024</div><div class="body"><h3>完善 2 · 次短路拆点</h3><p>需要 dis2 数组 + 链式前向星</p></div><div class="score">15 分</div></div>
<div class="row"><div class="yr">2025</div><div class="body"><h3>完善 1 · 带"免费票"特殊最短路</h3><p>分层 Dijkstra · used 0/1 双层状态</p></div><div class="score">15 分</div></div>
</div>
<div class="pull"><h2>合计 ≈ <b>34 分</b> · 模板背熟<b>稳吃</b></h2></div>
<div class="footer"><span class="txt">套路反复出 · 必背</span></div>
</body></html>
