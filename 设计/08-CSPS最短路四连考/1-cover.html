<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>最短路 · 4 年连考</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; overflow: hidden;
font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
background: #FFFFFF; color: #1A1A1A; }
.top { position: absolute; top: 0; left: 0; right: 0; height: 150px;
background: #0D47A1; display: flex; align-items: center; padding: 0 60px; }
.top .badge { background: #FFFFFF; color: #0D47A1; padding: 12px 24px;

.top .right { margin-left: auto; color: #FFFFFF; font-size: 22px; font-weight: 800; }
.h1 { position: absolute; top: 200px; left: 60px; right: 60px; }
.h1 .pre { color: #2196F3; font-size: 26px; font-weight: 800; letter-spacing: 3px; margin-bottom: 10px; }
.h1 h1 { font-size: 64px; font-weight: 900; color: #0D47A1; line-height: 1.1; }
.h1 h1 b { background: #2196F3; color: #FFFFFF; padding: 0 12px; border-radius: 6px; }
.big { position: absolute; top: 480px; left: 60px;

background: #0D47A1; color: #FFFFFF;
display: flex; align-items: center; justify-content: center;
border-radius: 24px;
font-size: 220px; font-weight: 900; line-height: 1; letter-spacing: -8px; }
.big .pct { font-size: 80px; vertical-align: middle; margin-left: 10px; }
.desc { position: absolute; top: 480px; right: 60px;
width: 480px; height: 460px;
display: flex; flex-direction: column; justify-content: center; }
.desc .lead { font-size: 30px; font-weight: 900; color: #1A1A1A; line-height: 1.3; }
.desc .lead em { font-style: normal; background: #E3F2FD; color: #0D47A1;
padding: 0 6px; border-radius: 4px; }
.desc .meta { margin-top: 20px; }
.desc .meta-row { display: flex; align-items: center; padding: 10px 0;
border-bottom: 2px solid #E3F2FD; font-size: 22px; font-weight: 700; color: #424242; }
.desc .meta-row .k { flex: 0 0 100px; color: #2196F3; font-weight: 900; }
.desc .meta-row .v { flex: 1; color: #1A1A1A; }
.desc .meta-row:last-child { border-bottom: none; }
.pull { position: absolute; bottom: 200px; left: 60px; right: 60px;
background: #E3F2FD; color: #0D47A1; padding: 24px 30px; border-radius: 16px;
border-left: 8px solid #0D47A1; }
.pull .lbl { font-size: 22px; font-weight: 900; color: #2196F3;
letter-spacing: 2px; margin-bottom: 6px; }
.pull h2 { font-size: 32px; font-weight: 900; line-height: 1.4; }
.footer { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
background: #0D47A1; display: flex; align-items: center; justify-content: center; }
.footer .txt { color: #FFFFFF; font-size: 22px; font-weight: 900; letter-spacing: 4px; }
</style></head><body>
<div class="top"><span class="badge">DATA · 4 年连考</span><span class="right">因诺信奥 · 大连</span></div>

<div class="desc">

<div class="meta">

<div class="meta-row"><span class="k">2021</span><span class="v">单选 15 · 简图最短</span></div>
<div class="meta-row"><span class="k">2024</span><span class="v">完善 2 · 次短路拆点</span></div>
<div class="meta-row"><span class="k">2025</span><span class="v">完善 1 · 免费票分层</span></div>
</div>
</div>

<div class="footer"><span class="txt">套路稳定 · 必背</span></div>
