<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSP-S 最短路四连考 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(180deg, #01579B 0%, #039BE5 50%, #B3E5FC 100%);
    color:#FFF; position:relative;
  }
  body::before {
    content:""; position:absolute; bottom: 0; left:0; right:0; height:300px;
    background: radial-gradient(ellipse at 50% 100%, rgba(255,255,255,0.4) 0%, transparent 60%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .tag {
    display:inline-block; background:#FFEB3B; color:#01579B; padding:14px 32px;
    border-radius:100px; font-size:30px; font-weight:900; letter-spacing:2px; margin-bottom: 50px;
    box-shadow: 6px 6px 0 #1A1A1A;
  }
  .pre {
    font-size: 40px; font-weight: 800; color: #FFEB3B;
    margin-bottom: 14px;
  }
  .num {
    font-size: 320px; font-weight: 900; line-height: 0.85;
    color: #FFEB3B;
    text-shadow: 12px 12px 0 #01579B;
  }
  .title {
    font-size: 88px; font-weight: 900; line-height: 1.05; color: #FFF;
    text-shadow: 5px 5px 0 #01579B; margin-top: 24px;
  }
  .title em {
    font-style:normal;
    background:#FF5722; padding:0 14px; display:inline-block;
    box-shadow: 6px 6px 0 #1A1A1A;
  }
  .sub {
    margin-top: 36px;
    background: #FFF; color: #01579B;
    padding: 18px 24px; border-radius: 14px;
    border: 4px solid #1A1A1A; box-shadow: 6px 6px 0 #FFEB3B;
    font-size: 32px; font-weight: 800; display:inline-block;
    line-height: 1.4;
  }
  .sub b { color:#B71C1C; }
  .footer {
    position:absolute; bottom:0; left:70px; right:70px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:28px; color:#01579B; font-weight:900;
  }
  .stamp { background:#FFEB3B; color:#01579B; padding:14px 24px; border-radius:8px; transform:rotate(-5deg); font-weight:900;}
</style>
</head>
<body>
  <div class="safe">
    <div class="tag">CSP-S 必拿模块 · 大连娃挚爱</div>
    <div class="pre">2020 / 2021 / 2024 / 2025 连考 4 年</div>
    <div class="num">4</div>
    <div class="title">连考<br><em>Dijkstra</em> 拆点</div>
    <div class="sub">
      跟海事大学到东软的<br>
      <b>最短路一个套路</b>
    </div>
  </div>
  <div class="footer">
    <span>#CSPS #最短路 #大连</span>
    <span class="stamp">收藏照背</span>
  </div>
</body>
</html>
