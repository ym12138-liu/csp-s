<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>排列组合 4 大套路 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    background: linear-gradient(160deg, #6A1B9A 0%, #E91E63 50%, #FFC1E3 100%);
    color:#FFF; position:relative;
  }
  body::before {
    content:""; position:absolute; top:50px; left:50%; transform:translateX(-50%);
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
  }
  .safe { position:absolute; top:150px; bottom:150px; left:0; right:0; padding:0 70px; }
  .tag {
    display:inline-block; background:#FFEB3B; color:#4A148C; padding:14px 32px;
    border-radius:100px; font-size:30px; font-weight:900; letter-spacing:2px; margin-bottom: 50px;
    box-shadow: 6px 6px 0 #1A1A1A;
  }
  .four {
    font-size: 320px; font-weight: 900; line-height: 0.85;
    color: #FFEB3B;
    text-shadow: 12px 12px 0 #4A148C;
  }
  .title {
    font-size: 96px; font-weight: 900;
    color: #FFF; line-height: 1.05; margin-top: 20px;
    text-shadow: 5px 5px 0 #4A148C;
  }
  .title em {
    font-style: normal;
    background: #1A1A1A; color:#FFEB3B;
    padding: 0 14px; display: inline-block;
    box-shadow: 6px 6px 0 #FFC1E3;
  }
  .badges {
    margin-top: 40px;
    display:flex; gap: 14px; flex-wrap: wrap;
  }
  .b {
    background:#FFF; color:#4A148C;
    padding: 12px 24px; border-radius: 100px;
    font-size: 30px; font-weight: 900;
    border: 4px solid #1A1A1A; box-shadow: 4px 4px 0 #FFEB3B;
  }
  .footer {
    position:absolute; bottom:0; left:70px; right:70px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:28px; color:#FFF; font-weight:800;
  }
  .stamp { background:#FFEB3B; color:#4A148C; padding:14px 24px; border-radius:8px; transform:rotate(-5deg); font-weight:900;}
</style>
</head>
<body>
  <div class="safe">
    <div class="tag">单选必拿题 · 7 年 7 中</div>
    <div class="four">4</div>
    <div class="title">大套路<br><em>背完就够</em></div>
    <div class="badges">
      <span class="b">隔板法</span>
      <span class="b">捆绑法</span>
      <span class="b">容斥</span>
      <span class="b">错排</span>
    </div>
  </div>
  <div class="footer">
    <span>#排列组合 #信奥数学 #大连娃</span>
    <span class="stamp">收藏背诵</span>
  </div>
</body>
</html>
