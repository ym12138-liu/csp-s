<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>排列组合 4 大套路</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; overflow: hidden;
font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
background: #FFFFFF; color: #1A1A1A; }
.top { position: absolute; top: 0; left: 0; right: 0; height: 150px;
background: #0D47A1; display: flex; align-items: center; padding: 0 60px; }
.top .badge { background: #FFFFFF; color: #0D47A1; padding: 12px 24px;
border-radius: 8px; font-size: 28px; font-weight: 900; }
.top .right { margin-left: auto; color: #FFFFFF; font-size: 22px; font-weight: 800; }
.h1 { position: absolute; top: 200px; left: 60px; right: 60px; }
.h1 .pre { color: #2196F3; font-size: 26px; font-weight: 800; letter-spacing: 3px; margin-bottom: 10px; }
.h1 h1 { font-size: 64px; font-weight: 900; color: #0D47A1; line-height: 1.1; }
.h1 h1 b { background: #2196F3; color: #FFFFFF; padding: 0 12px; border-radius: 6px; }
.cards { position: absolute; top: 460px; left: 60px; right: 60px;
display: flex; flex-wrap: wrap; gap: 16px; }
.card { flex: 1 1 calc(50% - 8px);
background: #FFFFFF; border: 4px solid #FCE4EC;
padding: 18px 22px; border-radius: 14px; }
.card.c2 { border-color: #FFF8E1; }
.card.c3 { border-color: #E8F5E9; }
.card.c4 { border-color: #E3F2FD; }
.card .tag { display: inline-block;
padding: 4px 12px; border-radius: 6px;
font-size: 16px; font-weight: 900; color: #FFFFFF;
margin-bottom: 8px; }
.card.c1 .tag { background: #C2185B; }
.card.c2 .tag { background: #F57F17; }
.card.c3 .tag { background: #2E7D32; }
.card.c4 .tag { background: #0D47A1; }
.card h3 { font-size: 24px; font-weight: 900; color: #0D47A1; line-height: 1.2; }
.card p { font-size: 16px; color: #424242; margin-top: 6px; line-height: 1.4; font-weight: 700; }
.card p b { background: #FFF59D; padding: 0 4px; color: #B71C1C; border-radius: 3px; }
.pull { position: absolute; bottom: 200px; left: 60px; right: 60px;
background: #0D47A1; color: #FFFFFF; padding: 22px 28px; border-radius: 16px; }
.pull h2 { font-size: 28px; font-weight: 900; line-height: 1.4; }
.pull h2 b { background: #2196F3; padding: 0 8px; border-radius: 4px; }
.footer { position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
background: #0D47A1; display: flex; align-items: center; justify-content: center; }
.footer .txt { color: #FFFFFF; font-size: 22px; font-weight: 900; letter-spacing: 4px; }
</style></head><body>
<div class="top"><span class="badge">FORMULA · 4 大套路</span><span class="right">因诺信奥 · 大连</span></div>
<div class="h1"><div class="pre">// 单选数学味最浓的一块</div><h1>4 个公式背熟<br>就能<b>稳吃 16 分</b></h1></div>
<div class="cards">
<div class="card c1"><span class="tag">隔板法</span><h3>分球到盒子</h3><p>n 个球放 k 个盒每盒至少 1 → <b>C(n-1, k-1)</b></p></div>
<div class="card c2"><span class="tag">捆绑法</span><h3>必相邻问题</h3><p>整体 × 内部排列 × 整体排列 · CSP-J 2024 出过</p></div>
<div class="card c3"><span class="tag">容斥原理</span><h3>多条件</h3><p>|A∪B∪C| = ΣA - ΣAB + ABC · 整除题 / 部门选人最爱用</p></div>
<div class="card c4"><span class="tag">错排公式</span><h3>全错位排列</h3><p>D(n) = (n-1)(D(n-1) + D(n-2)) · 必背 D(5) = 44</p></div>
</div>
<div class="pull"><h2>这 4 个会了 · <b>7 年单选稳吃 16 分</b></h2></div>
<div class="footer"><span class="txt">数学不会背 · 套路就是答案</span></div>
</body></html>
